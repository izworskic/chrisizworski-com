<title id="drawing-title">Jones Falls: three lower locks, then one upper lock</title>
<desc id="drawing-desc">Simplified, illustrative isometric diagram. Three lower chambers, an additional upper lock, and the separate Stone Arch Dam are represented symbolically. No scale, precise location, elevations or access paths are implied.</desc>
