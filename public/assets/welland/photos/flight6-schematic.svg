<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc"><title id="title">Welland Canal Lock 6 engineering diagram</title><desc id="desc">Interpretive cross-section, not to scale or a photograph. Three flight locks are 4, 5, 6; this panel highlights Lock 6, with a lift of 13 metres.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#061e2e"/><stop offset="1" stop-color="#19526b"/></linearGradient></defs><rect width="1100" height="620" fill="url(#bg)"/><path d="M 77 474 L 1020 244" fill="none" stroke="#9aaeb5" opacity=".3" stroke-width="2" stroke-dasharray="8 12"/><text x="62" y="74" font-family="Arial,sans-serif" font-size="15" font-weight="800" fill="#ddb87b" letter-spacing="4">WELLAND CANAL / THOROLD FLIGHT</text><text x="62" y="128" font-family="Georgia,serif" font-size="43" font-weight="700" fill="#fff">Lock 6 · UPPER TWIN FLIGHT</text><text x="64" y="160" font-family="Arial,sans-serif" font-size="19" fill="#bed7df">Upbound ships complete the three-chamber flight.</text><g><rect x="115" y="268" width="278" height="157" rx="11" fill="#224e60" fill-opacity="0.35" stroke="#648592" stroke-width="2"/><rect x="126" y="373" width="256" height="41" rx="6" fill="#4a91a5" opacity=".88"/><path d="M 141 371 H 365" stroke="#b1dde1" stroke-width="3"/><path d="M 245 383 l 28 0 9 9 -40 0z" fill="#10384d"/><text x="254" y="319" font-family="Arial,sans-serif" font-weight="800" font-size="29" text-anchor="middle" fill="#d6e9ed">LOCK 4</text><text x="254" y="351" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#dae9e9">15 m lift</text></g><g><rect x="430" y="214" width="278" height="157" rx="11" fill="#224e60" fill-opacity="0.35" stroke="#648592" stroke-width="2"/><rect x="441" y="319" width="256" height="41" rx="6" fill="#4a91a5" opacity=".88"/><path d="M 456 317 H 680" stroke="#b1dde1" stroke-width="3"/><path d="M 560 329 l 28 0 9 9 -40 0z" fill="#10384d"/><text x="569" y="265" font-family="Arial,sans-serif" font-weight="800" font-size="29" text-anchor="middle" fill="#d6e9ed">LOCK 5</text><text x="569" y="297" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#dae9e9">15 m lift</text></g><g><rect x="745" y="160" width="278" height="157" rx="11" fill="#b6d5d9" fill-opacity="0.24" stroke="#e9b96e" stroke-width="4"/><rect x="756" y="265" width="256" height="41" rx="6" fill="#c9eff0" opacity=".88"/><path d="M 771 263 H 995" stroke="#b1dde1" stroke-width="3"/><path d="M 875 275 l 28 0 9 9 -40 0z" fill="#10384d"/><text x="884" y="211" font-family="Arial,sans-serif" font-weight="800" font-size="29" text-anchor="middle" fill="#f2c985">LOCK 6</text><text x="884" y="243" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#dae9e9">13 m lift</text></g><path d="M 113 489 h860" stroke="#adcdd3" stroke-width="2" opacity=".3"/><text x="64" y="544" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#f1c77b">UPBOUND → TOWARD LAKE ERIE</text><text x="64" y="574" font-family="Arial,sans-serif" font-size="15" fill="#b1ccd4">Schematic · simplified steps, not to scale · lift data: NOAA Coast Pilot 6</text></svg>