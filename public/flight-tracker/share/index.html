<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Flight pickup update</title>
  <style>
    :root{--ink:#13202b;--muted:#5d6973;--line:#d9e0e5;--wash:#f4f7f8}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6f8f9;color:var(--ink)}
    main{max-width:680px;margin:0 auto;padding:28px 16px 48px}.eyebrow{margin:0 0 7px;font-size:11px;font-weight:900;letter-spacing:.1em;color:var(--muted)}
    h1{margin:0;font-size:clamp(28px,8vw,44px);letter-spacing:-.04em;line-height:1}.route{margin:9px 0 0;font-size:16px;color:var(--muted)}
    .card{margin-top:22px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 8px 24px rgba(19,32,43,.08)}
    .status{font-size:24px;font-weight:900;letter-spacing:-.025em}.where{margin:10px 0 0;font-size:17px;line-height:1.45}
    .arrival{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:18px}.cell{background:var(--wash);border-radius:10px;padding:10px}
    .cell span{display:block;font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.06em}.cell strong{display:block;margin-top:4px;font-size:16px;overflow-wrap:anywhere}
    .updated{margin:14px 0 0;color:var(--muted);font-size:11px}.expired{padding:24px 0;font-size:18px;line-height:1.45}
    footer{margin-top:26px;color:var(--muted);font-size:11px}footer a{color:inherit;font-weight:800}
    @media(max-width:440px){main{padding-top:20px}.card{padding:15px}.arrival{grid-template-columns:1fr 1fr}.cell:first-child{grid-column:1/-1}}
  </style>
</head>
<body>
<main>
  <p class="eyebrow">PICKUP VIEW</p>
  <h1 id="flight">Flight update</h1>
  <p class="route" id="route"></p>
  <section class="card" id="card" hidden>
    <div class="status" id="status"></div>
    <p class="where" id="where"></p>
    <div class="arrival">
      <div class="cell"><span>Arrival</span><strong id="arrival-time">—</strong></div>
      <div class="cell"><span>Terminal</span><strong id="terminal">—</strong></div>
      <div class="cell"><span>Gate</span><strong id="gate">—</strong></div>
    </div>
    <p class="updated" id="updated"></p>
  </section>
  <p class="expired" id="message">Loading the latest flight update…</p>
  <footer>Shared from <a href="/flight-tracker/">Where's the Plane for My Flight?</a></footer>
</main>
<script>
(async()=>{
  const token=location.pathname.split('/').filter(Boolean).pop()||new URLSearchParams(location.search).get('token')||'';
  const message=document.getElementById('message');
  try{
    const r=await fetch('/api/flight-assignment?flightV3=1&action=share&token='+encodeURIComponent(token),{headers:{accept:'application/json'}});
    const data=await r.json();
    if(!data.ok||!data.share){
      message.textContent=data.code==='expired'?'This pickup link has expired.':'This pickup link is unavailable.';
      return;
    }
    const s=data.share;
    document.getElementById('flight').textContent=s.flightNumber||'Flight update';
    document.getElementById('route').textContent=[s.route?.origin,s.route?.destination].filter(Boolean).join(' → ');
    document.getElementById('status').textContent=s.statusText||'Status unavailable';
    document.getElementById('where').textContent=s.whereText||'Current location unavailable.';
    document.getElementById('arrival-time').textContent=s.arrival?.time||'Not published';
    document.getElementById('terminal').textContent=s.arrival?.terminal||'Not published';
    document.getElementById('gate').textContent=s.arrival?.gate||'Not published';
    document.getElementById('updated').textContent=(data.stale?'Last saved update · ':'Updated · ')+new Date(s.updatedAt).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
    document.getElementById('card').hidden=false;
    message.hidden=true;
  }catch{
    message.textContent='The latest flight update is temporarily unavailable.';
  }
})();
</script>
</body>
</html>
