name: Winter layup live season source watch
on:
  schedule:
    # UTC, four source scans daily during Nov–Apr; no weather/ship writes outside winter.
    - cron: '29 0,6,12,18 * 11,12,1,2,3,4 *'
    # Early Nov 1 publishing pass follows midnight in America/Detroit (04:00 UTC).
    - cron: '9 4 1 11 *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/freighter-layup-editorial.json'
permissions:
  contents: write
concurrency:
  group: winter-layup-source-ledger-writer
  cancel-in-progress: false
jobs:
  winter-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run dated-report ingestion and November season rollover
        run: node scripts/freighter-layup/refresh.cjs --shadow-input=/tmp/freighter-layup-shadow-input.json
      - name: Publish the current winter and freeze completed source-backed winters
        run: |
          python3 scripts/freighter-layup/evergreen.py
          python3 scripts/freighter-layup/evergreen.py --check
          python3 scripts/freighter-layup/history.py --check
      - name: Run Python shadow intelligence without publishing any findings
        run: |
          python3 scripts/freighter-layup/shadow.py \
            --input /tmp/freighter-layup-shadow-input.json \
            --output /tmp/freighter-layup-shadow-report.json
          python3 scripts/freighter-layup/evaluate.py --check \
            --output /tmp/freighter-layup-retrospective-check.json
          python3 scripts/freighter-layup/evaluate.py \
            --cases data/freighter-layup-source-checked-evaluation-2026.json \
            --check --require-large-sample \
            --output /tmp/freighter-layup-large-source-check.json
          python3 -m unittest discover -s scripts/freighter-layup -p 'test_*.py' -v
      - name: Keep the private non-publishing evidence audit for seven days
        uses: actions/upload-artifact@v4
        with:
          name: winter-layup-shadow-intelligence
          path: |
            /tmp/freighter-layup-shadow-report.json
            /tmp/freighter-layup-retrospective-check.json
            /tmp/freighter-layup-large-source-check.json
          if-no-files-found: error
          retention-days: 7
      - name: Validate winter story ledger
        run: node --test tests/freighter-layup-season.test.js tests/freighter-layup-feeds.test.js
      - name: Publish only on new evidence or season rollover
        run: |
          if git diff --quiet -- public/assets/freighter-layup-live-season.json data/freighter-layup-review.json public/assets/freighter-layup-registry.json public/assets/freighter-layup-history.json public/great-lakes-freighter-winter-layup/index.html public/sitemap-winter.xml; then
            echo 'No new independently sourced winter stories; no deploy.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/freighter-layup-live-season.json data/freighter-layup-review.json public/assets/freighter-layup-registry.json public/assets/freighter-layup-history.json public/great-lakes-freighter-winter-layup/index.html public/sitemap-winter.xml
          git commit -m "data(layup): refresh source evidence and archive the completed shipping winter"
          git push origin HEAD:main
