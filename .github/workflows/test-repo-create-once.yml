name: Test sibling repository creation once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/test-repo-create-once.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Attempt sibling repo creation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          code="$(curl -sS -o "$RUNNER_TEMP/body.json" -w '%{http_code}'             -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             https://api.github.com/user/repos             -d '{"name":"repo-split-permission-probe-20260903","private":true,"auto_init":true,"description":"Temporary permission probe; safe to delete."}')"
          echo "HTTP $code"
          cat "$RUNNER_TEMP/body.json"
          if [ "$code" = "201" ]; then
            echo "CREATE_SUPPORTED=true"
          else
            echo "CREATE_SUPPORTED=false"
          fi
