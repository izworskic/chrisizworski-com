name: Frozen lighthouse forecast desk browser acceptance
on:
  pull_request:
    paths:
      - 'public/frozen-lighthouses-michigan/index.html'
      - 'public/assets/frozen-lighthouse*.js'
      - 'tests/frozen-lighthouse-browser-smoke.mjs'
      - 'tests/frozen-lighthouse-photos.test.js'
      - 'public/assets/frozen-lighthouse-field-guide.css'
      - 'data/frozen-lighthouse-photography.json'
      - 'experience-foundry/examples/lighthouse-photo-foundry.mjs'
      - 'experience-foundry/examples/lighthouse-visual-replay.cjs'
      - 'docs/experience-briefs/frozen-lighthouse-snow-stone.release.json'
      - '.github/workflows/frozen-lighthouse-browser.yml'
jobs:
  interactive-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ephemeral Chromium test driver
        run: |
          npm install --prefix /tmp/lighthouse-playwright --no-save --package-lock=false playwright@1.56.1
          if command -v google-chrome >/dev/null 2>&1; then
            echo "LIGHTHOUSE_CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null 2>&1; then
            echo "LIGHTHOUSE_CHROME=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            /tmp/lighthouse-playwright/node_modules/.bin/playwright install --with-deps chromium
          fi
      - name: Serve HTML and test mock forecast journey
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory public >/tmp/lighthouse-http.log 2>&1 &
          node tests/frozen-lighthouse-browser-smoke.mjs
      - name: Verify licensed photo assets and Experience OS 1.2 record
        run: |
          node --test tests/frozen-lighthouse-photos.test.js
          node scripts/verify-experience-os-v1.2.mjs docs/experience-briefs/frozen-lighthouse-snow-stone.release.json
      - name: Run Foundry 0.3 real-baseline research and before-after proof
        run: |
          node experience-foundry/examples/lighthouse-photo-foundry.mjs
          node scripts/experience-foundry.mjs assess --run experience-foundry/drafts/lighthouse-visual-field-guide-20261117/run.json
          node scripts/experience-foundry.mjs prove --run experience-foundry/drafts/lighthouse-visual-field-guide-20261117/run.json --out build/experience-foundry/lighthouse-visual-field-guide-20261117
          node scripts/experience-foundry.mjs assess --run experience-foundry/drafts/lighthouse-visual-field-guide-20261117/run.json --proof build/experience-foundry/lighthouse-visual-field-guide-20261117/proof.json
      - name: Archive Foundry before-after evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frozen-lighthouse-foundry-proof
          path: |
            experience-foundry/drafts/lighthouse-visual-field-guide-20261117/
            build/experience-foundry/lighthouse-visual-field-guide-20261117/
          if-no-files-found: ignore
          retention-days: 10
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frozen-lighthouse-desk-screenshots
          path: /tmp/lighthouse-browser-proof/*.png
          if-no-files-found: ignore
          retention-days: 7
