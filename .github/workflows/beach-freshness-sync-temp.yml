name: Temporary beach freshness sync

on:
  push:
    branches:
      - feat/beach-ctr-push-2026-08-22

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sync derived freshness signals
        run: node scripts/stamp-freshness.mjs
      - name: Commit derived sitemap changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/sitemap.xml public/sitemap-beaches.xml public/sitemap-reputation.xml public/great-lakes-beaches/index.html
          if git diff --cached --quiet; then
            echo "No freshness changes needed"
            exit 0
          fi
          git commit -m "Sync beach freshness metadata"
          git push
