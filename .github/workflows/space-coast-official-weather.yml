name: Space Coast 45WS official mission weather watch

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/space-coast-official-weather.yml'
      - 'api/space-coast-official-weather.js'
      - 'lib/space-coast-official-weather.js'
      - 'scripts/monitor-space-coast-official-weather.py'
  schedule:
    # UTC, staggered from KSC monitor. Bounded LL2 requests hourly.
    - cron: '17 * * * *'

permissions:
  contents: read
  id-token: write

concurrency:
  group: space-coast-official-weather
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up PDF reader
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install bounded official-document parser
        run: python -m pip install --disable-pip-version-check 'pypdf==5.9.0'
      - name: Test PDF source parsing
        run: python -m unittest discover -s tests -p 'test_space_coast_official_weather_pdf.py' -v
      - name: Discover official 45WS mission PDFs
        run: python scripts/monitor-space-coast-official-weather.py --output /tmp/space-coast-weather.json
      - name: Mint narrow GitHub OIDC token
        uses: actions/github-script@v7
        id: oidc
        with:
          script: |
            const token = await core.getIDToken('https://chrisizworski.com/api/space-coast-official-weather');
            core.setSecret(token);
            core.setOutput('token', token);
      - name: Store verified document observations in private Postgres
        env:
          WEATHER_MONITOR_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          result="$(curl --fail-with-body --silent --show-error --retry 1 \
            --retry-all-errors --max-time 35 -X POST \
            -H "Authorization: Bearer ${WEATHER_MONITOR_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/space-coast-weather.json \
            "https://chrisizworski.com/api/space-coast-official-weather")"
          if ! printf '%s' "$result" | jq -e '.ok == true' >/dev/null; then
            echo "Weather observations not accepted; previous evidence preserved."
            exit 1
          fi
          echo "Official forecast monitor observation accepted."
