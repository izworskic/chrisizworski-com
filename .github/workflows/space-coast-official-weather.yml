name: Space Coast 45WS official mission weather watch

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/space-coast-official-weather.yml'
      - 'api/space-coast-official-weather.js'
      - 'lib/space-coast-official-weather.js'
      - 'scripts/monitor-space-coast-official-weather.py'
      - 'scripts/space_coast_nasa_weather.py'
      - 'lib/space-coast-weather-story.js'
      - 'tests/test_space_coast_nasa_weather.py'
      - 'tests/space-coast-weather-story.test.js'
      - 'scripts/space_coast_weather_discovery.py'
      - 'tests/test_space_coast_weather_discovery.py'
  schedule:
    # UTC, staggered from KSC monitor. Bounded LL2 requests hourly.
    - cron: '17 * * * *'

permissions:
  contents: read
  id-token: write

concurrency:
  group: space-coast-official-weather
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify official-weather API is on production before initial observation
        if: github.event_name == 'push'
        run: |
          for attempt in $(seq 1 24); do
            if curl --silent --show-error --max-time 8 \
              "https://chrisizworski.com/api/space-coast-official-weather" | \
              jq -e '.ok == true' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 10
          done
          echo "Official-weather API has not reached production; no observation sent."
          exit 1
      - name: Checkout reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up PDF reader
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install bounded official-document parser
        run: python -m pip install --disable-pip-version-check 'pypdf==5.9.0'
      - name: Test PDF source parsing
        run: python -m unittest discover -s tests -p 'test_space_coast_official_weather_pdf.py' -v
      - name: Test bounded first-party discovery, source failures and LL2 fallback
        run: python -m unittest discover -s tests -p 'test_space_coast_weather_discovery.py' -v
      - name: Verify NASA evidence and source-linked weather interpretation
        run: |
          python -m unittest discover -s tests -p 'test_space_coast_nasa_weather.py' -v
          node --test tests/space-coast-official-weather.test.js tests/space-coast-weather-story.test.js
      - name: Discover official 45WS mission PDFs
        run: python scripts/monitor-space-coast-official-weather.py --output /tmp/space-coast-weather.json
      - name: Mint narrow GitHub OIDC token
        uses: actions/github-script@v7
        id: oidc
        with:
          script: |
            const token = await core.getIDToken('https://chrisizworski.com/api/space-coast-official-weather');
            core.setSecret(token);
            core.setOutput('token', token);
      - name: Store verified document observations in private Postgres
        id: persist
        env:
          WEATHER_MONITOR_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          result="$(curl --fail-with-body --silent --show-error --retry 1 \
            --retry-all-errors --max-time 35 -X POST \
            -H "Authorization: Bearer ${WEATHER_MONITOR_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/space-coast-weather.json \
            "https://chrisizworski.com/api/space-coast-official-weather")"
          if ! printf '%s' "$result" | jq -e '.ok == true' >/dev/null; then
            echo "Weather observations not accepted; previous evidence preserved."
            exit 1
          fi
          checked_at="$(printf '%s' "$result" | jq -r '.checkedAt')"
          test -n "$checked_at"
          echo "checked_at=$checked_at" >> "$GITHUB_OUTPUT"
          printf '%s' "$result" | jq '{monitorStatus,accepted,changes,nasaAccepted,nasaChanges,forecastWindow}'
          echo "Official forecast monitor observation accepted."
      - name: Verify the actual production read-back after private Postgres write
        env:
          EXPECTED_CHECKED_AT: ${{ steps.persist.outputs.checked_at }}
        run: |
          set -euo pipefail
          # Unique cache key ensures a current health read after this signed
          # POST, not a stale CDN response from an earlier monitor run.
          health="$(curl --fail --silent --show-error --retry 1 --max-time 16 \
            "https://chrisizworski.com/api/space-coast-official-weather?auditRun=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")"
          if ! printf '%s' "$health" | jq -e --arg observed "$EXPECTED_CHECKED_AT" '
            .ok == true and .health.checkedAt == $observed and
            (.health.forecastWindow.status | type == "string") and
            (.health.sourceChecks | type == "array") and
            (.health.nasaSourceChecks | type == "array")
          ' >/dev/null; then
            echo "Official-weather state write/read monitoring is incomplete."
            exit 1
          fi
          echo "Live Postgres read-back verified, including forecast horizon and source diagnostics."

