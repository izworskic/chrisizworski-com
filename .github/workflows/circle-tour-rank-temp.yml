name: Compose Circle Tour rank distribution

on:
  push:
    branches:
      - feat/circle-tour-rank-distribution-2026-08-23

permissions:
  contents: write

jobs:
  compose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/circle-tour-rank-distribution-2026-08-23
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply measured Circle Tour rank treatment
        run: node scripts/compose-circle-tour-rank.mjs
