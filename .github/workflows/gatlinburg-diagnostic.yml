name: Gatlinburg diagnostic

on:
  push:
    branches:
      - agent/gatlinburg-winter
  workflow_dispatch:

# Temporary workflow used only to isolate the repository-wide verification failure.
jobs:
  benchmark:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: beaches
            cmd: npm run benchmark:beaches
          - name: beach-ctr
            cmd: npm run benchmark:beach-ctr
          - name: border-ctr
            cmd: npm run benchmark:border-ctr
          - name: growth
            cmd: npm run benchmark:growth
          - name: seo
            cmd: npm run benchmark:seo
          - name: serp-length
            cmd: npm run benchmark:serp-length
          - name: ctr
            cmd: npm run benchmark:ctr -- --check
          - name: search-growth
            cmd: npm run benchmark:search-growth -- --check
          - name: search-strategy
            cmd: npm run benchmark:search-strategy -- --check
          - name: search-authority
            cmd: npm run benchmark:search-authority -- --check
          - name: outdoors-now-growth
            cmd: npm run benchmark:outdoors-now-growth -- --check
          - name: mackinac-toll-ctr
            cmd: npm run benchmark:mackinac-toll-ctr
          - name: trip-stack
            cmd: npm run benchmark:trip-stack -- --check
          - name: tool-network
            cmd: npm run benchmark:tool-network -- --check
          - name: circle-tour
            cmd: npm run benchmark:circle-tour
          - name: entity
            cmd: npm run benchmark:entity -- --check
          - name: winter
            cmd: npm run benchmark:winter -- --check
          - name: winter-flow
            cmd: npm run benchmark:winter-flow -- --check
          - name: winter-final
            cmd: npm run benchmark:winter-final -- --check
          - name: freshness
            cmd: npm run freshness -- --check
          - name: citation
            cmd: npm run benchmark:citation -- --check
          - name: decision-network
            cmd: npm run benchmark:decision-network
          - name: map-insights
            cmd: npm run benchmark:map-insights
          - name: boat-launches
            cmd: npm run benchmark:boat-launches
          - name: boat-launch-source
            cmd: npm run audit:boat-launch-source
          - name: boat-launches-v3
            cmd: npm run benchmark:boat-launches-v3
          - name: boat-launch-search
            cmd: npm run benchmark:boat-launch-search
          - name: manistee
            cmd: npm run benchmark:manistee
          - name: manistee-parity
            cmd: npm run benchmark:manistee-parity
          - name: manistee-popups
            cmd: npm run benchmark:manistee-popups
          - name: manistee-ux
            cmd: npm run benchmark:manistee-ux
          - name: au-sable-search
            cmd: npm run benchmark:au-sable-search
          - name: manistee-page-one
            cmd: npm run benchmark:manistee-page-one -- --check
          - name: fall-aurora-ctr
            cmd: npm run benchmark:fall-aurora-ctr -- --check
          - name: up-fall-rank
            cmd: npm run benchmark:up-fall-rank -- --check
          - name: fall-weekend-planner-ctr
            cmd: npm run benchmark:fall-weekend-planner-ctr -- --check
          - name: beach-detail-ctr
            cmd: npm run benchmark:beach-detail-ctr -- --check
          - name: garden-page-one-ctr
            cmd: npm run benchmark:garden-page-one-ctr -- --check
          - name: entity-discovery-ctr
            cmd: npm run benchmark:entity-discovery-ctr -- --check
          - name: circle-tour-rank
            cmd: npm run benchmark:circle-tour-rank -- --check
          - name: extracted-routing
            cmd: npm run benchmark:extracted-routing
          - name: gauley-routing
            cmd: npm run benchmark:gauley-routing
          - name: tool-entities
            cmd: npm run benchmark:tool-entities
          - name: white-christmas-indexing
            cmd: npm run benchmark:white-christmas-indexing
          - name: mackinac-hub
            cmd: npm run benchmark:mackinac-hub
          - name: mackinac-platform
            cmd: npm run benchmark:mackinac-platform
          - name: snowmobile
            cmd: npm run benchmark:snowmobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: ${{ matrix.name }}
        run: ${{ matrix.cmd }}
