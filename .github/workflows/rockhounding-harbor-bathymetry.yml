name: Rockhounding NOAA harbor sounding and contour research

on:
  workflow_dispatch:
  push:
    branches:
      - research/rockhounding-harbor-bathymetry-20261015
    paths:
      - .github/workflows/rockhounding-harbor-bathymetry.yml

permissions:
  contents: read

jobs:
  verify-chart-depth:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Python syntax before requesting NOAA chart service
        run: python3 -m py_compile scripts/rockhounding/*.py
      - name: Run rockhounding geometry, dated depth evidence, and research lab regression tests
        run: |
          node --test tests/rockhounding*.test.js
          python3 -m unittest discover -s tests -p 'test_rockhounding_*.py' -v
      - name: Fetch actual NOAA ENC sounding and depth contour layers for four bounded zones
        run: |
          python3 scripts/rockhounding/verify-harbor-bathymetry.py \
            --expect data/rockhounding/grand-marais-noaa-enc-harbor-depth-2026-10-15.json \
            --out artifacts/grand-marais-noaa-chart-depth-coverage.json
      - name: Retain real NOAA research source responses and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rockhounding-harbor-charted-depth-coverage
          path: artifacts/grand-marais-noaa-chart-depth-coverage.json
          retention-days: 30
          if-no-files-found: warn
