name: ShoreFeel beach microclimate browser QA
on:
  pull_request:
    paths:
      - 'lib/shorefeel/**'
      - 'api/shorefeel.js'
      - 'public/assets/shorefeel-saginaw.*'
      - 'public/lake-huron-water-temperature/saginaw-bay/**'
      - 'tests/shorefeel-beach-feel.test.js'
      - 'tests/shorefeel-physics.test.js'
      - 'tests/shorefeel-noaa-grid.test.js'
      - 'tests/shorefeel-field-validation.test.js'
      - 'scripts/shorefeel-validate-field.cjs'
      - 'scripts/shorefeel-noaa-hindcast.py'
      - 'scripts/shorefeel-field-pair.py'
      - 'tests/test_shorefeel_noaa_hindcast.py'
      - 'tests/test_shorefeel_field_pair.py'
      - 'docs/SHOREFEEL_PHASE3_HINDCAST.md'
      - 'scripts/verify-shorefeel-beach-browser.cjs'
      - 'scripts/verify-shorefeel-network-browser.cjs'
      - 'api/beaches.js'
      - 'public/assets/beach-report.js'
      - 'public/assets/beach-report.css'
      - 'scripts/generate-beach-pages.mjs'
      - 'public/great-lakes-beaches/**'
      - 'scripts/generate-shorefeel-details.mjs'
      - 'public/assets/shorefeel-beach-detail.*'
      - 'scripts/verify-shorefeel-every-beach-browser.cjs'
      - 'tests/shorefeel-every-beach.test.js'
      - 'public/sitemap-shorefeel-beaches.xml'
      - 'public/sitemap-index.xml'
      - 'tests/shorefeel-beach-network.test.js'
      - 'tests/shorefeel-us-coast.test.js'
      - 'lib/shorefeel/us-coast.js'
      - 'api/shorefeel-us.js'
      - 'data/shorefeel-us-coast.json'
      - 'public/assets/shorefeel-us.*'
      - 'scripts/generate-shorefeel-us.mjs'
      - 'scripts/verify-shorefeel-us-browser.cjs'
      - '.github/workflows/shorefeel-beach-feel-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shorefeel-beach-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inventory exact changed-beach source hashes
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const crypto=require('node:crypto');
          const catalog=JSON.parse(fs.readFileSync('data/beaches.json','utf8'));
          console.log('SHOREFEEL_GUIDE_HASHES_START');
          for(const beach of catalog.beaches){
            const file='public/great-lakes-beaches/'+beach.slug+'/index.html';
            const hash=crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
            console.log(JSON.stringify(['/great-lakes-beaches/'+beach.slug+'/',hash]));
          }
          console.log('SHOREFEEL_GUIDE_HASHES_END');
          console.log('SHOREFEEL_ASSET_HASHES_START');
          for(const file of ['beach-report.js','beach-report.css']){
            const bytes=fs.readFileSync('public/assets/'+file);
            console.log(JSON.stringify(['/assets/'+file,crypto.createHash('sha256').update(bytes).digest('hex')]));
          }
          console.log('SHOREFEEL_ASSET_HASHES_END');
          NODE
      - name: NWS apparent-temperature and shore wind source tests
        run: node --test tests/shorefeel-beach-feel.test.js tests/shorefeel-saginaw.test.js tests/shorefeel-physics.test.js tests/shorefeel-noaa-grid.test.js tests/shorefeel-field-validation.test.js
      - name: Great Lakes beach network data and integrity tests
        run: node --test tests/shorefeel-beach-network.test.js tests/shorefeel-every-beach.test.js tests/beach-static.test.js
      - name: US Great Lakes weather and state safety contract tests
        run: node --test tests/shorefeel-us-coast.test.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline NOAA archive and paired logger scientific tests
        run: python3 -m unittest discover -s tests -p 'test_shorefeel_*.py' -v
      - name: Predictive validation and uncertainty research fixtures
        if: github.head_ref == 'research/shorefeel-predictive-validation'
        run: node --test tests/shorefeel-predictive-validation.test.js tests/shorefeel-uncertainty-calibration.test.js tests/shorefeel-archive-coverage.test.js tests/shorefeel-native-grid-parity.test.js
      - name: Bounded one-off NOAA archive coverage probe
        if: github.head_ref == 'research/shorefeel-predictive-validation'
        run: |
          mkdir -p artifacts/shorefeel-beach-qa
          node scripts/shorefeel-archive-coverage.cjs > artifacts/shorefeel-beach-qa/archive-coverage.json
          cat artifacts/shorefeel-beach-qa/archive-coverage.json
      - name: Offline preserved ShoreFeel empirical evidence
        run: node --test tests/shorefeel-empirical-evidence.test.js tests/shorefeel-forecast-reliability.test.js
      - name: Install isolated pinned browser harness
        run: |
          npm install --prefix "$RUNNER_TEMP/shorefeel-playwright" --ignore-scripts --no-package-lock playwright@1.56.1
          "$RUNNER_TEMP/shorefeel-playwright/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run phone, desktop and no-data visits
        env:
          SHORE_QA_OUTPUT: artifacts/shorefeel-beach-qa
        run: SHORE_PW_MODULE="$RUNNER_TEMP/shorefeel-playwright/node_modules/playwright" node scripts/verify-shorefeel-beach-browser.cjs
      - name: Run Great Lakes beach field-note browser acceptance
        env:
          SHORE_QA_OUTPUT: artifacts/shorefeel-beach-qa
        run: SHORE_PW_MODULE="$RUNNER_TEMP/shorefeel-playwright/node_modules/playwright" node scripts/verify-shorefeel-network-browser.cjs
      - name: US regional beaches, map failover and no-JS in Chromium
        env:
          SHORE_QA_OUTPUT: artifacts/shorefeel-beach-qa
        run: SHORE_PW_MODULE="$RUNNER_TEMP/shorefeel-playwright/node_modules/playwright" node scripts/verify-shorefeel-us-browser.cjs
      - name: Every individual shore field note in phone and desktop Chromium
        env:
          SHORE_QA_OUTPUT: artifacts/shorefeel-beach-qa
        run: SHORE_PW_MODULE="$RUNNER_TEMP/shorefeel-playwright/node_modules/playwright" node scripts/verify-shorefeel-every-beach-browser.cjs
      - name: Upload browser screenshots and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorefeel-beach-qa
          path: artifacts/shorefeel-beach-qa/
          if-no-files-found: ignore
          retention-days: 7
