name: Temporary Upper Peninsula fall ledger fix

on:
  push:
    branches:
      - feat/up-fall-page-one-rank-2026-08-22

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Correct pending experiment metadata
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'benchmarks/growth-experiments.json';
          const ledger = JSON.parse(readFileSync(path, 'utf8'));
          const item = ledger.experiments.find((entry) => entry.id === '2026-08-22-upper-peninsula-fall-rank');
          if (!item) throw new Error('Upper Peninsula fall rank experiment missing');
          if (item.status !== 'pending-clean-window' || item.releaseDate !== null || item.evaluationWindow !== null) {
            throw new Error('Unexpected experiment release state');
          }
          item.lastSearchFacingChangeDate = '2026-08-22';
          writeFileSync(path, JSON.stringify(ledger, null, 2) + '\n');
          NODE
          rm .github/workflows/up-fall-ledger-fix-temp.yml
          rm notes/up-fall-ledger-fix-trigger.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Upper Peninsula fall experiment release metadata'
          git push origin HEAD:feat/up-fall-page-one-rank-2026-08-22
