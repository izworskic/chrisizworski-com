name: Detroit Anthropic production smoke

on:
  push:
    branches:
      - main
    paths:
      - 'lib/detroit-outdoors/route.js'
      - 'lib/detroit-outdoors/engines.js'
      - 'public/assets/detroit-outdoors.js'
      - 'public/detroit-outdoors/index.html'
      - '.github/workflows/detroit-anthropic-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production Anthropic configuration
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          URL="https://chrisizworski.com/api/detroit-outdoors?edition=cards-v1&smoke=${EXPECTED_SHA}"
          for attempt in $(seq 1 30); do
            if body="$(curl -fsS --max-time 35 "${URL}&attempt=${attempt}")"; then
              status="$(printf '%s' "$body" | node -e '
                let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{
                  const d=JSON.parse(s);
                  const r=d.runtime||{};
                  const e=(d.decision&&d.decision.editorial)||{};
                  const b=(d.decision&&d.decision.boardEditor)||{};
                  const oe=(d.diagnostics&&d.diagnostics.opportunityEngines)||{};
                  const writers=Array.isArray(e.cardWriters)?e.cardWriters:[];
                  const opportunities=Array.isArray(d.opportunities)?d.opportunities:[];
                  const placements=Array.isArray(e.placements)?e.placements:[];
                  const placementById=new Map(placements.map(p=>[p&&p.candidateId,p]));
                  const notes=(d.edition&&d.edition.notes&&typeof d.edition.notes==="object")?d.edition.notes:{};
                  console.log(JSON.stringify({
                    commitSha:r.commitSha||null,
                    vercelEnv:r.vercelEnv||null,
                    anthropicKeyConfigured:r.anthropicKeyConfigured===true,
                    writerModel:r.writerModel||null,
                    editorialMode:e.mode||null,
                    editorialReason:e.reason||null,
                    opportunityCount:opportunities.length,
                    opportunityIds:opportunities.map(o=>o&&o.id).filter(Boolean),
                    boardEditorMode:b.mode||null,
                    boardCandidateCount:Number(b.candidateCount)||0,
                    boardSelectedCount:Number(b.selectedCount)||0,
                    boardSelectedIds:Array.isArray(b.selectedIds)?b.selectedIds:[],
                    boardCandidateCountByEngine:b.candidateCountByEngine||{},
                    boardSelectedEngineDiversity:Number(b.selectedEngineDiversity)||0,
                    boardSelectedEngineCountByEngine:b.selectedEngineCountByEngine||{},
                    opportunitySourceEngines:opportunities.map(o=>o&&o.sourceEngine||null),
                    engineDiagnostics:oe,
                    vetoedLegacyCandidates:Array.isArray(oe.vetoedLegacyCandidates)?oe.vetoedLegacyCandidates:[],
                    boardPostureMode:b.posture&&b.posture.mode||null,
                    boardSlotModes:Array.isArray(b.slots)?b.slots.map(s=>({position:s.position||null,mode:s.mode||null,choiceId:s.choiceId||null})):[],
                    cardWriterCount:writers.length,
                    acceptedCardCount:writers.filter(w=>w&&w.accepted===true).length,
                    cardWriterModes:writers.map(w=>({candidateId:w.candidateId||null,mode:w.mode||null,accepted:w.accepted===true,attempt:w.attempt||null})),
                    cardDetails:writers.map(w=>{
                      const id=w&&w.candidateId||null;
                      const placement=placementById.get(id)||{};
                      return {
                        candidateId:id,
                        treatment:placement.treatment||null,
                        mode:w&&w.mode||null,
                        accepted:w&&w.accepted===true,
                        attempt:w&&w.attempt||null,
                        reason:w&&w.reason||null,
                        note:String(id&&notes[id]||"").slice(0,320)
                      };
                    })
                  }));
                });
              ')"
              echo "Production diagnostics: $status"
              current="$(printf '%s' "$status" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).commitSha || ""')"
              if [ "$current" = "$EXPECTED_SHA" ]; then
                printf '%s' "$status" | node -e '
                  let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{
                    const x=JSON.parse(s);
                    if (!x.anthropicKeyConfigured) {
                      console.error("ANTHROPIC_API_KEY is not configured in the production runtime.");
                      process.exit(2);
                    }
                    if (!x.boardCandidateCount || x.boardCandidateCount < x.opportunityCount) {
                      console.error("JEV board editor did not receive the full hard-safe candidate pool.", x);
                      process.exit(9);
                    }
                    const ed=x.engineDiagnostics||{};
                    const sourceStatus=ed.sourceStatus||{};
                    const emitted=ed.emittedCandidateCountByEngine||{};
                    if (Number(ed.mixedSafeCandidateCount)!==x.boardCandidateCount) {
                      console.error("Mixed hard-safe engine pool does not match the candidate count sent to JEV.", ed, x.boardCandidateCount);
                      process.exit(12);
                    }
                    for (const engine of ["park-weather","great-lakes-water","night-sky-aurora","fall-color-phenology"]) {
                      if (!Object.prototype.hasOwnProperty.call(emitted,engine)) {
                        console.error("Expected opportunity engine did not report diagnostics.", engine, emitted);
                        process.exit(13);
                      }
                    }
                    if (!(sourceStatus["great-lakes-water"]&&sourceStatus["great-lakes-water"].ok) ||
                        !(sourceStatus["night-sky-aurora"]&&sourceStatus["night-sky-aurora"].ok)) {
                      console.error("Reusable water or aurora specialist engine is not participating in production.", sourceStatus);
                      process.exit(14);
                    }
                    if (x.opportunitySourceEngines.some(engine=>!engine)) {
                      console.error("At least one displayed opportunity is missing its source engine.", x.opportunitySourceEngines);
                      process.exit(15);
                    }
                    if (JSON.stringify(ed.selectedIds||[])!==JSON.stringify(x.opportunityIds)) {
                      console.error("Engine diagnostics selected IDs do not match the rendered board.", ed.selectedIds, x.opportunityIds);
                      process.exit(16);
                    }
                    const rejectedIds=new Set((ed.hardRejected||[]).map(r=>r&&r.id).filter(Boolean));
                    if (x.opportunityIds.some(id=>rejectedIds.has(id))) {
                      console.error("A deterministically rejected specialist candidate reached the rendered board.", ed.hardRejected, x.opportunityIds);
                      process.exit(17);
                    }
                    const vetoedLegacyIds=new Set((x.vetoedLegacyCandidates||[]).map(r=>r&&r.legacyId).filter(Boolean));
                    if (x.opportunityIds.some(id=>vetoedLegacyIds.has(id))) {
                      console.error("A legacy candidate survived an authoritative specialist hard veto.", x.vetoedLegacyCandidates, x.opportunityIds);
                      process.exit(18);
                    }
                    if (!["shared-harness-jev","mixed"].includes(x.boardEditorMode)) {
                      console.error("Detroit board selection is not using JEV.", x.boardEditorMode, x.boardSlotModes);
                      process.exit(10);
                    }
                    if (x.boardSelectedCount !== x.opportunityCount || JSON.stringify(x.boardSelectedIds) !== JSON.stringify(x.opportunityIds)) {
                      console.error("Displayed board does not match JEV board-editor selection.", x.boardSelectedIds, x.opportunityIds);
                      process.exit(11);
                    }
                    if (x.editorialMode === "deterministic") {
                      console.error("Anthropic key exists, but Detroit editorial is still deterministic. Reason:", x.editorialReason || "unknown");
                      process.exit(3);
                    }
                    if (!x.opportunityCount || x.cardWriterCount !== x.opportunityCount) {
                      console.error("Per-card Haiku mismatch. Opportunities:", x.opportunityCount, "card writers:", x.cardWriterCount, x.cardWriterModes);
                      process.exit(5);
                    }
                    if (x.acceptedCardCount !== x.opportunityCount) {
                      console.error("Not every displayed card has accepted Haiku copy.", x.cardWriterModes);
                      process.exit(6);
                    }
                    if (x.cardWriterModes.some(w=>!["anthropic","cached-ai"].includes(w.mode))) {
                      console.error("At least one displayed card is not using an Anthropic writer.", x.cardWriterModes);
                      process.exit(7);
                    }
                    if (x.cardDetails.some(c=>!c.note||!c.note.trim())) {
                      console.error("At least one displayed card is missing rendered Haiku copy.", x.cardDetails);
                      process.exit(8);
                    }
                    console.log("Opportunity-engine diagnostics:", JSON.stringify(x.engineDiagnostics));
                    console.log("Per-card editorial detail:", JSON.stringify(x.cardDetails));
                    console.log("Anthropic production configuration is active on every displayed Detroit card.");
                  });
                '
                echo "Verifying live Detroit client bundle parses..."
                curl -fsS --max-time 20 "https://chrisizworski.com/assets/detroit-outdoors.js?smoke=${EXPECTED_SHA}" -o /tmp/detroit-outdoors.js
                node --check /tmp/detroit-outdoors.js
                grep -Fq "/assets/detroit-outdoors.js?v=20260921b" <(curl -fsS --max-time 20 "https://chrisizworski.com/detroit-outdoors/?smoke=${EXPECTED_SHA}")
                echo "Live Detroit page references the cache-busted, parseable client bundle."
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Production did not reach expected commit $EXPECTED_SHA during smoke window."
          exit 4
