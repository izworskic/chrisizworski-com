name: Detroit Anthropic production smoke

on:
  push:
    branches:
      - main
    paths:
      - 'lib/detroit-outdoors/route.js'
      - '.github/workflows/detroit-anthropic-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production Anthropic configuration
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          URL="https://chrisizworski.com/api/detroit-outdoors?edition=cards-v1&smoke=${EXPECTED_SHA}"
          for attempt in $(seq 1 30); do
            if body="$(curl -fsS --max-time 35 "${URL}&attempt=${attempt}")"; then
              status="$(printf '%s' "$body" | node -e '
                let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{
                  const d=JSON.parse(s);
                  const r=d.runtime||{};
                  const e=(d.decision&&d.decision.editorial)||{};
                  const writers=Array.isArray(e.cardWriters)?e.cardWriters:[];
                  const opportunities=Array.isArray(d.opportunities)?d.opportunities:[];
                  const placements=Array.isArray(e.placements)?e.placements:[];
                  const placementById=new Map(placements.map(p=>[p&&p.candidateId,p]));
                  const notes=(d.edition&&d.edition.notes&&typeof d.edition.notes==="object")?d.edition.notes:{};
                  console.log(JSON.stringify({
                    commitSha:r.commitSha||null,
                    vercelEnv:r.vercelEnv||null,
                    anthropicKeyConfigured:r.anthropicKeyConfigured===true,
                    writerModel:r.writerModel||null,
                    editorialMode:e.mode||null,
                    editorialReason:e.reason||null,
                    opportunityCount:opportunities.length,
                    cardWriterCount:writers.length,
                    acceptedCardCount:writers.filter(w=>w&&w.accepted===true).length,
                    cardWriterModes:writers.map(w=>({candidateId:w.candidateId||null,mode:w.mode||null,accepted:w.accepted===true,attempt:w.attempt||null})),
                    cardDetails:writers.map(w=>{
                      const id=w&&w.candidateId||null;
                      const placement=placementById.get(id)||{};
                      return {
                        candidateId:id,
                        treatment:placement.treatment||null,
                        mode:w&&w.mode||null,
                        accepted:w&&w.accepted===true,
                        attempt:w&&w.attempt||null,
                        reason:w&&w.reason||null,
                        note:String(id&&notes[id]||"").slice(0,320)
                      };
                    })
                  }));
                });
              ')"
              echo "Production diagnostics: $status"
              current="$(printf '%s' "$status" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).commitSha || ""')"
              if [ "$current" = "$EXPECTED_SHA" ]; then
                printf '%s' "$status" | node -e '
                  let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{
                    const x=JSON.parse(s);
                    if (!x.anthropicKeyConfigured) {
                      console.error("ANTHROPIC_API_KEY is not configured in the production runtime.");
                      process.exit(2);
                    }
                    if (x.editorialMode === "deterministic") {
                      console.error("Anthropic key exists, but Detroit editorial is still deterministic. Reason:", x.editorialReason || "unknown");
                      process.exit(3);
                    }
                    if (!x.opportunityCount || x.cardWriterCount !== x.opportunityCount) {
                      console.error("Per-card Haiku mismatch. Opportunities:", x.opportunityCount, "card writers:", x.cardWriterCount, x.cardWriterModes);
                      process.exit(5);
                    }
                    if (x.acceptedCardCount !== x.opportunityCount) {
                      console.error("Not every displayed card has accepted Haiku copy.", x.cardWriterModes);
                      process.exit(6);
                    }
                    if (x.cardWriterModes.some(w=>!["anthropic","cached-ai"].includes(w.mode))) {
                      console.error("At least one displayed card is not using an Anthropic writer.", x.cardWriterModes);
                      process.exit(7);
                    }
                    if (x.cardDetails.some(c=>!c.note||!c.note.trim())) {
                      console.error("At least one displayed card is missing rendered Haiku copy.", x.cardDetails);
                      process.exit(8);
                    }
                    console.log("Per-card editorial detail:", JSON.stringify(x.cardDetails));
                    console.log("Anthropic production configuration is active on every displayed Detroit card.");
                  });
                '
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Production did not reach expected commit $EXPECTED_SHA during smoke window."
          exit 4
