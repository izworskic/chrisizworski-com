name: Detroit Anthropic production smoke

on:
  push:
    branches:
      - main
    paths:
      - 'api/fall-color.js'
      - 'api/freighter-ais.js'
      - 'lib/detroit-outdoors/route.js'
      - 'lib/detroit-outdoors/engines.js'
      - 'lib/detroit-outdoors/expanded-engines.js'
      - 'lib/detroit-outdoors/engine-registry.js'
      - 'public/assets/detroit-outdoors.js'
      - 'public/assets/detroit-intent.js'
      - 'public/assets/detroit-intent.css'
      - 'public/detroit-outdoors/index.html'
      - 'public/detroit-river-freighters/index.html'
      - 'public/detroit-birding-today/index.html'
      - 'public/lake-st-clair-outdoors/index.html'
      - 'public/detroit-sunset-tonight/index.html'
      - '.github/workflows/detroit-anthropic-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify board-bound JEV and Anthropic production path
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            core_file="/tmp/detroit-core.json"
            editorial_file="/tmp/detroit-editorial.json"
            image_file="/tmp/detroit-image.json"

            if ! curl -fsS --max-time 35 "https://chrisizworski.com/api/detroit-outdoors?edition=cards-v1&mode=core&smoke=${EXPECTED_SHA}&attempt=${attempt}" -o "${core_file}"; then
              sleep 10
              continue
            fi

            current="$(node -e '
              const d=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));
              process.stdout.write((d.runtime&&d.runtime.commitSha)||"");
            ' "${core_file}")"
            if [ "${current}" != "${EXPECTED_SHA}" ]; then
              sleep 10
              continue
            fi

            board_ids="$(node -e '
              const d=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));
              if(!d.ok||d.mode!=="core-board"||!Array.isArray(d.opportunities)||!d.opportunities.length) process.exit(2);
              const ids=d.opportunities.map(x=>x&&x.id).filter(Boolean).slice(0,4);
              if(new Set((d.opportunities||[]).map(x=>x&&x.place&&x.place.id).filter(Boolean)).size!==ids.length) process.exit(3);
              const b=d.decision&&d.decision.boardEditor||{};
              if(!["shared-harness-jev","mixed"].includes(b.mode)) process.exit(4);
              if(JSON.stringify(b.selectedIds||[])!==JSON.stringify(ids)) process.exit(5);
              process.stdout.write(ids.join(","));
            ' "${core_file}")"
            hold="$(node -e '
              const d=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));
              process.stdout.write(d.decision&&d.decision.boardEditor&&d.decision.boardEditor.posture&&d.decision.boardEditor.posture.choiceId==="QUIET"?"1":"0");
            ' "${core_file}")"

            if ! curl -fsS --get --max-time 55               --data-urlencode "mode=editorial"               --data-urlencode "boardIds=${board_ids}"               --data-urlencode "hold=${hold}"               --data-urlencode "smoke=${EXPECTED_SHA}"               "https://chrisizworski.com/api/detroit-outdoors" -o "${editorial_file}"; then
              sleep 10
              continue
            fi

            if ! curl -fsS --get --max-time 35               --data-urlencode "mode=image"               --data-urlencode "boardIds=${board_ids}"               --data-urlencode "smoke=${EXPECTED_SHA}"               "https://chrisizworski.com/api/detroit-outdoors" -o "${image_file}"; then
              sleep 10
              continue
            fi

            EXPECTED_SHA="${EXPECTED_SHA}" node -e '
              const fs=require("fs");
              const core=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
              const editorial=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
              const image=JSON.parse(fs.readFileSync(process.argv[3],"utf8"));
              const ids=core.opportunities.map(x=>x.id);

              if(editorial.mode!=="editorial-enrichment") throw new Error("editorial enrichment mode failed");
              if(JSON.stringify(editorial.boardIds||[])!==JSON.stringify(ids)) throw new Error("editorial endpoint changed the rendered board");
              if((editorial.runtime&&editorial.runtime.commitSha)!==process.env.EXPECTED_SHA) throw new Error("editorial runtime commit mismatch");
              if(!editorial.runtime||editorial.runtime.anthropicKeyConfigured!==true) throw new Error("ANTHROPIC_API_KEY is not configured");
              const e=editorial.decision&&editorial.decision.editorial||{};
              const writers=Array.isArray(e.cardWriters)?e.cardWriters:[];
              const notes=editorial.edition&&editorial.edition.notes||{};
              if(writers.length!==ids.length) throw new Error("not every card received an independent writer job");
              if(writers.some(w=>!w.accepted||!["anthropic","cached-ai"].includes(w.mode))) throw new Error("a displayed card lacks accepted Anthropic copy: "+JSON.stringify(writers));
              if(ids.some(id=>!String(notes[id]||"").trim())) throw new Error("a displayed card is missing rendered Haiku copy");

              if(image.mode!=="hero-image") throw new Error("hero image mode failed");
              if(JSON.stringify(image.boardIds||[])!==JSON.stringify(ids)) throw new Error("image endpoint changed the rendered board");
              const im=image.decision&&image.decision.image||{};
              const pool=Array.isArray(im.pool)?im.pool:[];
              if(pool.length>=2&&!["shared-harness-jev","cached-jev-image"].includes(im.mode)) throw new Error("multi-image pool is not using JEV");
              if(pool.length&&(!image.image||!im.choiceId||!pool.includes(im.choiceId))) throw new Error("JEV image choice is outside approved pool");

              console.log("Detroit production verified:",JSON.stringify({
                boardIds:ids,
                boardMode:core.decision&&core.decision.boardEditor&&core.decision.boardEditor.mode,
                editorialMode:e.mode,
                writers:writers.map(w=>({id:w.candidateId,mode:w.mode,attempt:w.attempt,treatment:w.treatment})),
                imageMode:im.mode,
                imageChoice:im.choiceId,
                imagePool:pool,
                recentIds:im.recentIds||[]
              }));
            ' "${core_file}" "${editorial_file}" "${image_file}"

            curl -fsS --max-time 20 "https://chrisizworski.com/assets/detroit-outdoors.js?smoke=${EXPECTED_SHA}" -o /tmp/detroit-outdoors.js
            node --check /tmp/detroit-outdoors.js
            grep -Fq "/assets/detroit-outdoors.js?v=20260924a" <(curl -fsS --max-time 20 "https://chrisizworski.com/detroit-outdoors/?smoke=${EXPECTED_SHA}")
            curl -fsS --max-time 20 "https://chrisizworski.com/assets/detroit-intent.js?smoke=${EXPECTED_SHA}" -o /tmp/detroit-intent.js
            node --check /tmp/detroit-intent.js
            grep -Fq 'intent==="freighter"?5*60*1000:10*60*1000' /tmp/detroit-intent.js
            grep -Fq 'editorialSessionTtlMs=intent==="freighter"?10*60*1000:30*60*1000' /tmp/detroit-intent.js
            grep -Fq 'evidence:Array.isArray(candidate.verifiedEvidence)?candidate.verifiedEvidence:[]' /tmp/detroit-intent.js
            grep -Fq 'editorialSig=' /tmp/detroit-intent.js
            grep -Fq 'sessionStorage' /tmp/detroit-intent.js
            if grep -Fq '&fresh=' /tmp/detroit-intent.js; then
              echo "Focused Detroit client still defeats shared edge caching with a per-minute fresh query."
              exit 1
            fi
            if grep -Fq 'cache:"no-store"' /tmp/detroit-intent.js; then
              echo "Focused Detroit client still bypasses browser/edge reuse."
              exit 1
            fi
            for slug in detroit-river-freighters detroit-birding-today lake-st-clair-outdoors detroit-sunset-tonight; do
              curl -fsS --max-time 20 "https://chrisizworski.com/${slug}/?smoke=${EXPECTED_SHA}" -o "/tmp/${slug}.html"
              grep -Fq "/assets/detroit-intent.js?v=20260922b" "/tmp/${slug}.html"
            done

            curl -fsS --max-time 25 -A "ChrisIzworski.com Detroit Outdoors specialist adapter" "https://chrisizworski.com/api/freighter-ais?freshness_smoke=${EXPECTED_SHA}" -o /tmp/detroit-freighter-ais.json
            node -e '
              const d=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));
              if(!d.ok) throw new Error("Detroit AIS specialist response failed");
              if(!d.detroitSignal||d.detroitSignal.movingOnly!==true||d.detroitSignal.maxAgeMinutes!==8||d.detroitSignal.publicDecisionMaxAgeMinutes!==10) throw new Error("Detroit AIS freshness contract missing");
              const now=Date.now();
              for(const v of d.vessels||[]){
                const seen=Date.parse(v&&v.seen||"");
                const speed=Number(v&&v.speedKnots);
                if(!Number.isFinite(seen)||now-seen>8*60*1000) throw new Error("Detroit AIS returned a vessel outside the eight-minute admission budget: "+JSON.stringify(v));
                if(!Number.isFinite(speed)||speed<=0.5) throw new Error("Detroit AIS returned a non-passing vessel: "+JSON.stringify(v));
              }
              console.log("Detroit AIS live contract verified:",JSON.stringify({vessels:(d.vessels||[]).map(v=>({name:v.name,seen:v.seen,speedKnots:v.speedKnots}))}));
            ' /tmp/detroit-freighter-ais.json

            live_intents=0
            for intent in freighter birding water sunset; do
              intent_core="/tmp/detroit-intent-${intent}.json"
              fresh_bucket="$(date +%s)"
              curl -fsS --get --max-time 35 --data-urlencode "intent=${intent}" --data-urlencode "fresh=${fresh_bucket}" --data-urlencode "smoke=${EXPECTED_SHA}" "https://chrisizworski.com/api/detroit-outdoors" -o "${intent_core}"
              candidate_id="$(EXPECTED_SHA="${EXPECTED_SHA}" node -e '
                const d=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));
                if(!d.ok||d.mode!=="intent-core") throw new Error("intent core mode failed");
                if((d.runtime&&d.runtime.commitSha)!==process.env.EXPECTED_SHA) throw new Error("intent core runtime mismatch");
                if(!d.intent||!Array.isArray(d.intent.metrics)) throw new Error("intent metrics missing");
                process.stdout.write(d.intent.candidate&&d.intent.candidate.id||"");
              ' "${intent_core}")"
              if [ -n "${candidate_id}" ]; then
                live_intents=$((live_intents+1))
                intent_editorial="/tmp/detroit-intent-${intent}-editorial.json"
                curl -fsS --get --max-time 55 --data-urlencode "intent=${intent}" --data-urlencode "mode=editorial" --data-urlencode "candidateId=${candidate_id}" --data-urlencode "fresh=${fresh_bucket}" --data-urlencode "smoke=${EXPECTED_SHA}" "https://chrisizworski.com/api/detroit-outdoors" -o "${intent_editorial}"
                EXPECTED_SHA="${EXPECTED_SHA}" CANDIDATE_ID="${candidate_id}" node -e '
                  const d=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));
                  if(!d.ok||d.mode!=="intent-editorial-enrichment") throw new Error("intent editorial mode failed");
                  if((d.runtime&&d.runtime.commitSha)!==process.env.EXPECTED_SHA) throw new Error("intent editorial runtime mismatch");
                  if(!d.runtime||d.runtime.anthropicKeyConfigured!==true) throw new Error("intent Anthropic key missing");
                  if(!d.enrichment||d.enrichment.candidateId!==process.env.CANDIDATE_ID) throw new Error("intent editorial detached from live candidate");
                  if(!String(d.enrichment.note||"").trim()) throw new Error("intent Haiku note missing");
                  if(!["anthropic","cached-ai"].includes(d.enrichment.mode)) throw new Error("intent writer did not use Anthropic");
                  console.log("Intent editorial verified:",d.intent.id,d.enrichment.treatment,d.enrichment.mode,d.enrichment.plannerMode);
                ' "${intent_editorial}"
              fi
            done
            if [ "${live_intents}" -lt 1 ]; then
              echo "No live Detroit intent candidate existed during this smoke; static and core intent paths still verified."
            fi
            echo "Detroit board-bound editorial, image, cost-aware refresh and focused-intent production smoke passed."
            exit 0
          done

          echo "Detroit production did not expose a healthy board-bound editorial path during the smoke window."
          exit 1