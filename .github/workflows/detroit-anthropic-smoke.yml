name: Detroit Anthropic production smoke

on:
  push:
    branches:
      - main
    paths:
      - 'lib/detroit-outdoors/route.js'
      - 'lib/detroit-outdoors/engines.js'
      - 'lib/detroit-outdoors/expanded-engines.js'
      - 'lib/detroit-outdoors/engine-registry.js'
      - 'public/assets/detroit-outdoors.js'
      - 'public/detroit-outdoors/index.html'
      - '.github/workflows/detroit-anthropic-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify board-bound JEV and Anthropic production path
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            core_file="/tmp/detroit-core.json"
            editorial_file="/tmp/detroit-editorial.json"
            image_file="/tmp/detroit-image.json"

            if ! curl -fsS --max-time 35 "https://chrisizworski.com/api/detroit-outdoors?edition=cards-v1&mode=core&smoke=${EXPECTED_SHA}&attempt=${attempt}" -o "${core_file}"; then
              sleep 10
              continue
            fi

            current="$(node -e '
              const d=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));
              process.stdout.write((d.runtime&&d.runtime.commitSha)||"");
            ' "${core_file}")"
            if [ "${current}" != "${EXPECTED_SHA}" ]; then
              sleep 10
              continue
            fi

            board_ids="$(node -e '
              const d=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));
              if(!d.ok||d.mode!=="core-board"||!Array.isArray(d.opportunities)||!d.opportunities.length) process.exit(2);
              const ids=d.opportunities.map(x=>x&&x.id).filter(Boolean).slice(0,4);
              if(new Set((d.opportunities||[]).map(x=>x&&x.place&&x.place.id).filter(Boolean)).size!==ids.length) process.exit(3);
              const b=d.decision&&d.decision.boardEditor||{};
              if(!["shared-harness-jev","mixed"].includes(b.mode)) process.exit(4);
              if(JSON.stringify(b.selectedIds||[])!==JSON.stringify(ids)) process.exit(5);
              process.stdout.write(ids.join(","));
            ' "${core_file}")"
            hold="$(node -e '
              const d=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));
              process.stdout.write(d.decision&&d.decision.boardEditor&&d.decision.boardEditor.posture&&d.decision.boardEditor.posture.choiceId==="QUIET"?"1":"0");
            ' "${core_file}")"

            if ! curl -fsS --get --max-time 55               --data-urlencode "mode=editorial"               --data-urlencode "boardIds=${board_ids}"               --data-urlencode "hold=${hold}"               --data-urlencode "smoke=${EXPECTED_SHA}"               "https://chrisizworski.com/api/detroit-outdoors" -o "${editorial_file}"; then
              sleep 10
              continue
            fi

            if ! curl -fsS --get --max-time 35               --data-urlencode "mode=image"               --data-urlencode "boardIds=${board_ids}"               --data-urlencode "smoke=${EXPECTED_SHA}"               "https://chrisizworski.com/api/detroit-outdoors" -o "${image_file}"; then
              sleep 10
              continue
            fi

            EXPECTED_SHA="${EXPECTED_SHA}" node -e '
              const fs=require("fs");
              const core=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
              const editorial=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
              const image=JSON.parse(fs.readFileSync(process.argv[3],"utf8"));
              const ids=core.opportunities.map(x=>x.id);

              if(editorial.mode!=="editorial-enrichment") throw new Error("editorial enrichment mode failed");
              if(JSON.stringify(editorial.boardIds||[])!==JSON.stringify(ids)) throw new Error("editorial endpoint changed the rendered board");
              if((editorial.runtime&&editorial.runtime.commitSha)!==process.env.EXPECTED_SHA) throw new Error("editorial runtime commit mismatch");
              if(!editorial.runtime||editorial.runtime.anthropicKeyConfigured!==true) throw new Error("ANTHROPIC_API_KEY is not configured");
              const e=editorial.decision&&editorial.decision.editorial||{};
              const writers=Array.isArray(e.cardWriters)?e.cardWriters:[];
              const notes=editorial.edition&&editorial.edition.notes||{};
              if(writers.length!==ids.length) throw new Error("not every card received an independent writer job");
              if(writers.some(w=>!w.accepted||!["anthropic","cached-ai"].includes(w.mode))) throw new Error("a displayed card lacks accepted Anthropic copy: "+JSON.stringify(writers));
              if(ids.some(id=>!String(notes[id]||"").trim())) throw new Error("a displayed card is missing rendered Haiku copy");

              if(image.mode!=="hero-image") throw new Error("hero image mode failed");
              if(JSON.stringify(image.boardIds||[])!==JSON.stringify(ids)) throw new Error("image endpoint changed the rendered board");
              const im=image.decision&&image.decision.image||{};
              const pool=Array.isArray(im.pool)?im.pool:[];
              if(pool.length>=2&&!["shared-harness-jev","cached-jev-image"].includes(im.mode)) throw new Error("multi-image pool is not using JEV");
              if(pool.length&&(!image.image||!im.choiceId||!pool.includes(im.choiceId))) throw new Error("JEV image choice is outside approved pool");

              console.log("Detroit production verified:",JSON.stringify({
                boardIds:ids,
                boardMode:core.decision&&core.decision.boardEditor&&core.decision.boardEditor.mode,
                editorialMode:e.mode,
                writers:writers.map(w=>({id:w.candidateId,mode:w.mode,attempt:w.attempt,treatment:w.treatment})),
                imageMode:im.mode,
                imageChoice:im.choiceId,
                imagePool:pool,
                recentIds:im.recentIds||[]
              }));
            ' "${core_file}" "${editorial_file}" "${image_file}"

            curl -fsS --max-time 20 "https://chrisizworski.com/assets/detroit-outdoors.js?smoke=${EXPECTED_SHA}" -o /tmp/detroit-outdoors.js
            node --check /tmp/detroit-outdoors.js
            grep -Fq "/assets/detroit-outdoors.js?v=20260922f" <(curl -fsS --max-time 20 "https://chrisizworski.com/detroit-outdoors/?smoke=${EXPECTED_SHA}")
            echo "Detroit board-bound editorial and image production smoke passed."
            exit 0
          done

          echo "Detroit production did not expose a healthy board-bound editorial path during the smoke window."
          exit 1
