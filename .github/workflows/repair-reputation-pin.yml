name: Repair reputation sitemap pin
# One-shot branch repair; remove after the pin commit lands.
on:
  push:
    branches:
      - feat/owned-domain-network
permissions:
  contents: write
jobs:
  repair:
    if: "!contains(github.event.head_commit.message, '[pin-repaired]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/owned-domain-network
      - name: Update exact reputation sitemap integrity pin
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/verify-source.mjs')
          s = p.read_text()
          old = 'f6624b50bd277e91c805f59b96a3f44a7ac760bf9cf53b689d5756e670555bfa'
          new = '28c519666de392d6e66596ce609d52993a593eed1877fd9ab1c769bb667e4899'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one old pin, found {s.count(old)}')
          p.write_text(s.replace(old, new))
          PY
      - name: Commit pin repair
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-source.mjs
          git commit -m "Update reputation sitemap integrity pin [pin-repaired]"
          git push origin HEAD:feat/owned-domain-network
