name: Sync Gauley Static Bundle

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/sync-gauley-release-live.mjs'
      - '.github/workflows/sync-gauley-static.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Build Gauley static bundle
        run: node scripts/sync-gauley-release-live.mjs
      - name: Commit generated Gauley bundle
        shell: bash
        run: |
          set -euo pipefail
          git add public/national-tools/gauley-release-live/index.html data/gauley-release-mirror.json
          if git diff --cached --quiet; then
            echo 'Gauley static bundle already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sync Gauley persona static bundle'
          git push origin HEAD:main
