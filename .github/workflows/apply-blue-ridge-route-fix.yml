name: Apply Blue Ridge route fix
on:
  pull_request:
    branches: ["main"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Patch exact Blue Ridge routes
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('vercel.json')
          data = json.loads(p.read_text())
          rewrites = data.setdefault('rewrites', [])
          destination = 'https://national-fall-color.vercel.app/national-tools/fall-color/blue-ridge-parkway/index.html'
          exact = [
            {'source': '/national-tools/fall-color/blue-ridge-parkway', 'destination': destination},
            {'source': '/national-tools/fall-color/blue-ridge-parkway/', 'destination': destination},
          ]
          sources = {x['source'] for x in exact}
          rewrites = [r for r in rewrites if r.get('source') not in sources]
          anchor = next((i for i, r in enumerate(rewrites) if r.get('source') == '/national-tools/fall-color/:path*'), None)
          if anchor is None:
            raise SystemExit('fall-color wildcard rewrite not found')
          rewrites[anchor:anchor] = exact
          data['rewrites'] = rewrites
          p.write_text(json.dumps(data, indent=2) + '\n')
          PY
          node -e "const c=require('./vercel.json');const d='https://national-fall-color.vercel.app/national-tools/fall-color/blue-ridge-parkway/index.html';for(const s of ['/national-tools/fall-color/blue-ridge-parkway','/national-tools/fall-color/blue-ridge-parkway/']){const r=c.rewrites.find(x=>x.source===s);if(!r||r.destination!==d)process.exit(1)}"
      - name: Commit route repair to PR branch
        shell: bash
        run: |
          rm .github/workflows/apply-blue-ridge-route-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vercel.json .github/workflows/apply-blue-ridge-route-fix.yml
          git commit -m "Fix Blue Ridge canonical routing"
          git push origin HEAD:${{ github.head_ref }}
