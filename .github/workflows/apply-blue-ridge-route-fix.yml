name: Apply Blue Ridge route fix
on:
  push:
    branches: ["fix-blue-ridge-canonical-route"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-blue-ridge-canonical-route
          fetch-depth: 0
      - name: Patch exact Blue Ridge routes and verifier
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          vercel_path = Path('vercel.json')
          data = json.loads(vercel_path.read_text())
          rewrites = data.setdefault('rewrites', [])
          exact = [
              {
                  'source': '/national-tools/fall-color/blue-ridge-parkway',
                  'destination': 'https://national-fall-color.vercel.app/national-tools/fall-color/blue-ridge-parkway/index.html'
              },
              {
                  'source': '/national-tools/fall-color/blue-ridge-parkway/',
                  'destination': 'https://national-fall-color.vercel.app/national-tools/fall-color/blue-ridge-parkway/index.html'
              },
          ]
          exact_sources = {x['source'] for x in exact}
          rewrites = [r for r in rewrites if r.get('source') not in exact_sources]
          anchor = next((i for i, r in enumerate(rewrites) if r.get('source') == '/national-tools/fall-color/:path*'), None)
          if anchor is None:
              raise SystemExit('fall-color wildcard rewrite not found')
          rewrites[anchor:anchor] = exact
          data['rewrites'] = rewrites
          vercel_path.write_text(json.dumps(data, indent=2) + '\n')

          verify_path = Path('scripts/verify-extracted-routing.mjs')
          text = verify_path.read_text()
          destination = 'https://national-fall-color.vercel.app/national-tools/fall-color/blue-ridge-parkway/index.html'
          expected_anchor = '  "/national-tools/fall-color/": "https://national-fall-color.vercel.app/national-tools/fall-color/",\n'
          additions = (
              f'  "/national-tools/fall-color/blue-ridge-parkway": "{destination}",\n'
              f'  "/national-tools/fall-color/blue-ridge-parkway/": "{destination}",\n'
          )
          if '/national-tools/fall-color/blue-ridge-parkway"' not in text:
              if expected_anchor not in text:
                  raise SystemExit('expected-map fall-color anchor not found')
              text = text.replace(expected_anchor, expected_anchor + additions)

          marker = 'const wcWildcardIndex = rewrites.findIndex(item => item.source === "/national-tools/white-christmas/:path*");\n'
          fall_guard = '''const fallColorWildcardIndex = rewrites.findIndex(item => item.source === "/national-tools/fall-color/:path*");
for (const source of [
  "/national-tools/fall-color/blue-ridge-parkway",
  "/national-tools/fall-color/blue-ridge-parkway/"
]) {
  const i = rewrites.findIndex(item => item.source === source);
  if (i < 0 || fallColorWildcardIndex < 0 || i >= fallColorWildcardIndex) failures.push(`explicit Blue Ridge route must precede fall-color wildcard: ${source}`);
}

'''
          if 'explicit Blue Ridge route must precede fall-color wildcard' not in text:
              if marker not in text:
                  raise SystemExit('routing verifier guard anchor not found')
              text = text.replace(marker, fall_guard + marker)
          verify_path.write_text(text)
          PY
          node scripts/verify-extracted-routing.mjs
      - name: Commit route repair
        shell: bash
        run: |
          rm .github/workflows/apply-blue-ridge-route-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vercel.json scripts/verify-extracted-routing.mjs .github/workflows/apply-blue-ridge-route-fix.yml
          git commit -m "Fix Blue Ridge canonical routing"
          git push origin HEAD:fix-blue-ridge-canonical-route
