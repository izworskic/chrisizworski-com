# Temporary one-shot conflict reconciliation; remove after branch sync.
name: Ice PR main-sync one-shot
on:
  push:
    branches:
      - feature/great-lakes-ice-cover-today-54-year
permissions:
  contents: write
jobs:
  merge-main:
    if: "!contains(github.event.head_commit.message, '[ice sync complete]')"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Reconcile with main without dropping other work
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git show origin/main:docs/GROWTH_SESSION_LOG.md > /tmp/ice-main-growth-log.md
          # The only overlapping work is the independently prepended growth log entry.
          # Favor PR edits only for any directly conflicting hunk.
          git merge --no-edit -X ours origin/main
          python3 - <<'PY'
          from pathlib import Path
          current_path = Path('docs/GROWTH_SESSION_LOG.md')
          current = current_path.read_text()
          main = Path('/tmp/ice-main-growth-log.md').read_text()
          first_entry = main.split('\n### ', 1)[0].rstrip() + '\n\n'
          assert first_entry.startswith('### 2026-11-23 | Michigan ski official operating evidence'), 'Unexpected main log divergence; stop for review.'
          if first_entry.strip() not in current:
              current_path.write_text(first_entry + current)
          assert '### 2026-11-23 | Great Lakes ice cover today' in current_path.read_text()
          assert '### 2026-11-23 | Michigan ski official operating evidence' in current_path.read_text()
          PY
          git add docs/GROWTH_SESSION_LOG.md
          git commit --allow-empty -m "Reconcile ice and ski growth log after main sync [ice sync complete]"
          git push origin HEAD:feature/great-lakes-ice-cover-today-54-year
