name: Sync verified National Tools gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-national-gate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    env:
      HUB_COMMIT: 661648d107e428e743b95f967973a4185c23d01f
      HUB_RAW: https://raw.githubusercontent.com/izworskic/national-outdoor-tools-hub/661648d107e428e743b95f967973a4185c23d01f
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pull verified National Tools files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/synced-national-tools/assets
          mkdir -p public/synced-national-tools/northeast-great-lakes
          mkdir -p public/synced-national-tools/appalachia
          mkdir -p public/synced-national-tools/southeast
          mkdir -p public/synced-national-tools/great-plains
          mkdir -p public/synced-national-tools/rockies
          mkdir -p public/synced-national-tools/pacific-northwest
          mkdir -p public/synced-national-tools/bird-migration
          mkdir -p public/synced-national-tools/columbia-salmon-run
          mkdir -p public/synced-national-tools/florida-red-tide
          mkdir -p public/synced-national-tools/space-coast-launch
          mkdir -p public/synced-national-tools/trail-ridge-road
          mkdir -p public/synced-national-tools/yellowstone-geysers
          mkdir -p api

          curl -fLsS "$HUB_RAW/public/national-tools/index.html" -o public/synced-national-tools/index.html
          curl -fLsS "$HUB_RAW/public/national-tools/assets/national-tools-directory.css" -o public/synced-national-tools/assets/national-tools-directory.css
          curl -fLsS "$HUB_RAW/public/national-tools/assets/national-tools-directory.js" -o public/synced-national-tools/assets/national-tools-directory.js
          curl -fLsS "$HUB_RAW/public/national-tools/assets/region-hub.css" -o public/synced-national-tools/assets/region-hub.css
          curl -fLsS "$HUB_RAW/public/national-tools/assets/southeast-tool.css" -o public/synced-national-tools/assets/southeast-tool.css
          curl -fLsS "$HUB_RAW/public/national-tools/assets/mountain-tool.css" -o public/synced-national-tools/assets/mountain-tool.css

          curl -fLsS "$HUB_RAW/public/national-tools/northeast-great-lakes/index.html" -o public/synced-national-tools/northeast-great-lakes/index.html
          curl -fLsS "$HUB_RAW/public/national-tools/appalachia/index.html" -o public/synced-national-tools/appalachia/index.html
          curl -fLsS "$HUB_RAW/public/national-tools/southeast/index.html" -o public/synced-national-tools/southeast/index.html
          curl -fLsS "$HUB_RAW/public/national-tools/great-plains/index.html" -o public/synced-national-tools/great-plains/index.html
          curl -fLsS "$HUB_RAW/public/national-tools/rockies/index.html" -o public/synced-national-tools/rockies/index.html
          curl -fLsS "$HUB_RAW/public/national-tools/pacific-northwest/index.html" -o public/synced-national-tools/pacific-northwest/index.html

          curl -fLsS "$HUB_RAW/public/national-tools/bird-migration/index.html" -o public/synced-national-tools/bird-migration/index.html
          curl -fLsS "$HUB_RAW/public/national-tools/bird-migration/app.js" -o public/synced-national-tools/bird-migration/app.js
          curl -fLsS "$HUB_RAW/public/national-tools/bird-migration/styles.css" -o public/synced-national-tools/bird-migration/styles.css
          curl -fLsS "$HUB_RAW/api/bird-migration-morning.js" -o api/bird-migration-morning.js
          curl -fLsS "$HUB_RAW/api/birding-local-action.js" -o api/birding-local-action.js

          curl -fLsS "$HUB_RAW/public/national-tools/columbia-salmon-run/index.html" -o public/synced-national-tools/columbia-salmon-run/index.html
          curl -fLsS "$HUB_RAW/public/national-tools/columbia-salmon-run/app.js" -o public/synced-national-tools/columbia-salmon-run/app.js
          curl -fLsS "$HUB_RAW/public/national-tools/columbia-salmon-run/styles.css" -o public/synced-national-tools/columbia-salmon-run/styles.css
          curl -fLsS "$HUB_RAW/api/columbia-salmon.js" -o api/columbia-salmon.js

          curl -fLsS "$HUB_RAW/public/national-tools/florida-red-tide/index.html" -o public/synced-national-tools/florida-red-tide/index.html
          curl -fLsS "$HUB_RAW/public/national-tools/florida-red-tide/app.js" -o public/synced-national-tools/florida-red-tide/app.js
          curl -fLsS "$HUB_RAW/api/florida-red-tide.js" -o api/florida-red-tide.js

          curl -fLsS "$HUB_RAW/public/national-tools/space-coast-launch/index.html" -o public/synced-national-tools/space-coast-launch/index.html
          curl -fLsS "$HUB_RAW/public/national-tools/space-coast-launch/app.js" -o public/synced-national-tools/space-coast-launch/app.js
          curl -fLsS "$HUB_RAW/api/space-coast-launch.js" -o api/space-coast-launch.js

          curl -fLsS "$HUB_RAW/public/national-tools/trail-ridge-road/index.html" -o public/synced-national-tools/trail-ridge-road/index.html
          curl -fLsS "$HUB_RAW/public/national-tools/trail-ridge-road/app.js" -o public/synced-national-tools/trail-ridge-road/app.js
          curl -fLsS "$HUB_RAW/api/trail-ridge-road.js" -o api/trail-ridge-road.js

          curl -fLsS "$HUB_RAW/public/national-tools/yellowstone-geysers/index.html" -o public/synced-national-tools/yellowstone-geysers/index.html
          curl -fLsS "$HUB_RAW/public/national-tools/yellowstone-geysers/app.js" -o public/synced-national-tools/yellowstone-geysers/app.js
          curl -fLsS "$HUB_RAW/api/yellowstone-geysers.js" -o api/yellowstone-geysers.js

      - name: Pin production routes ahead of stale hub fallback
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const file='vercel.json';
          const v=JSON.parse(fs.readFileSync(file,'utf8'));
          v.functions ||= {};
          for (const api of ['api/bird-migration-morning.js','api/birding-local-action.js','api/columbia-salmon.js','api/florida-red-tide.js','api/space-coast-launch.js','api/trail-ridge-road.js','api/yellowstone-geysers.js']) delete v.functions[api];
          v.rewrites ||= [];

          const routes=[
            ['/national-tools','/synced-national-tools/index.html'],
            ['/national-tools/','/synced-national-tools/index.html'],
            ['/national-tools/assets/national-tools-directory.css','/synced-national-tools/assets/national-tools-directory.css'],
            ['/national-tools/assets/national-tools-directory.js','/synced-national-tools/assets/national-tools-directory.js'],
            ['/national-tools/assets/region-hub.css','/synced-national-tools/assets/region-hub.css'],
            ['/national-tools/assets/southeast-tool.css','/synced-national-tools/assets/southeast-tool.css'],
            ['/national-tools/assets/mountain-tool.css','/synced-national-tools/assets/mountain-tool.css'],
            ['/national-tools/northeast-great-lakes','/synced-national-tools/northeast-great-lakes/index.html'],
            ['/national-tools/northeast-great-lakes/','/synced-national-tools/northeast-great-lakes/index.html'],
            ['/national-tools/appalachia','/synced-national-tools/appalachia/index.html'],
            ['/national-tools/appalachia/','/synced-national-tools/appalachia/index.html'],
            ['/national-tools/southeast','/synced-national-tools/southeast/index.html'],
            ['/national-tools/southeast/','/synced-national-tools/southeast/index.html'],
            ['/national-tools/great-plains','/synced-national-tools/great-plains/index.html'],
            ['/national-tools/great-plains/','/synced-national-tools/great-plains/index.html'],
            ['/national-tools/rockies','/synced-national-tools/rockies/index.html'],
            ['/national-tools/rockies/','/synced-national-tools/rockies/index.html'],
            ['/national-tools/pacific-northwest','/synced-national-tools/pacific-northwest/index.html'],
            ['/national-tools/pacific-northwest/','/synced-national-tools/pacific-northwest/index.html'],
            ['/national-tools/bird-migration','/synced-national-tools/bird-migration/index.html'],
            ['/national-tools/bird-migration/','/synced-national-tools/bird-migration/index.html'],
            ['/national-tools/bird-migration/:path*','/synced-national-tools/bird-migration/:path*'],
            ['/national-tools/columbia-salmon-run','/synced-national-tools/columbia-salmon-run/index.html'],
            ['/national-tools/columbia-salmon-run/','/synced-national-tools/columbia-salmon-run/index.html'],
            ['/national-tools/columbia-salmon-run/:path*','/synced-national-tools/columbia-salmon-run/:path*'],
            ['/national-tools/florida-red-tide','/synced-national-tools/florida-red-tide/index.html'],
            ['/national-tools/florida-red-tide/','/synced-national-tools/florida-red-tide/index.html'],
            ['/national-tools/florida-red-tide/:path*','/synced-national-tools/florida-red-tide/:path*'],
            ['/national-tools/space-coast-launch','/synced-national-tools/space-coast-launch/index.html'],
            ['/national-tools/space-coast-launch/','/synced-national-tools/space-coast-launch/index.html'],
            ['/national-tools/space-coast-launch/:path*','/synced-national-tools/space-coast-launch/:path*'],
            ['/national-tools/trail-ridge-road','/synced-national-tools/trail-ridge-road/index.html'],
            ['/national-tools/trail-ridge-road/','/synced-national-tools/trail-ridge-road/index.html'],
            ['/national-tools/trail-ridge-road/:path*','/synced-national-tools/trail-ridge-road/:path*'],
            ['/national-tools/yellowstone-geysers','/synced-national-tools/yellowstone-geysers/index.html'],
            ['/national-tools/yellowstone-geysers/','/synced-national-tools/yellowstone-geysers/index.html'],
            ['/national-tools/yellowstone-geysers/:path*','/synced-national-tools/yellowstone-geysers/:path*']
          ];

          const sources=new Set(routes.map(([source])=>source));
          v.rewrites=v.rewrites.filter(r=>!sources.has(r.source));
          const fallbackIndex=v.rewrites.findIndex(r=>r.source==='/national-tools/:path*');
          const insertAt=fallbackIndex>=0?fallbackIndex:v.rewrites.length;
          v.rewrites.splice(insertAt,0,...routes.map(([source,destination])=>({source,destination})));
          fs.writeFileSync(file,JSON.stringify(v,null,2)+'\n');
          NODE

      - name: Apply main-site shell metadata
        run: node scripts/normalize-national-shell.mjs

      - name: Verify production bundle
        shell: bash
        run: |
          set -euo pipefail
          for id in bird-migration columbia-salmon great-lakes-levels florida-red-tide space-coast-launch trail-ridge-road yellowstone-geysers shoshone-falls; do
            grep -q "data-tool-id=\"$id\"" public/synced-national-tools/index.html
          done
          grep -q 'href="/national-tools/northeast-great-lakes/"' public/synced-national-tools/index.html
          grep -q 'href="/national-tools/southeast/"' public/synced-national-tools/index.html
          grep -q 'href="/national-tools/rockies/"' public/synced-national-tools/index.html
          grep -q 'href="https://greatlakeslevels.org/"' public/synced-national-tools/index.html
          grep -q 'numberOfItems":35' public/synced-national-tools/index.html

          grep -q 'Northeast &amp; Great Lakes' public/synced-national-tools/northeast-great-lakes/index.html
          grep -q 'Great Lakes Levels' public/synced-national-tools/northeast-great-lakes/index.html
          grep -q 'Niagara Falls Rainbow Predictor' public/synced-national-tools/northeast-great-lakes/index.html
          grep -q 'Thunder Hole Live' public/synced-national-tools/northeast-great-lakes/index.html

          grep -q 'Regional decision desk' public/synced-national-tools/southeast/index.html
          grep -q 'Blue Spring Live' public/synced-national-tools/southeast/index.html
          grep -q 'Florida Red Tide Live' public/synced-national-tools/southeast/index.html
          grep -q 'Space Coast Launch Viewing' public/synced-national-tools/southeast/index.html
          grep -qi 'no nearby sample is not the same thing as no red tide' public/synced-national-tools/florida-red-tide/index.html
          grep -q 'FWC-FWRI' public/synced-national-tools/florida-red-tide/index.html
          grep -q 'schedule confidence' public/synced-national-tools/space-coast-launch/index.html
          grep -q 'viewing weather' public/synced-national-tools/space-coast-launch/index.html
          grep -q 'Clear skies do not mean the rocket will launch' public/synced-national-tools/space-coast-launch/index.html

          grep -q 'Shoshone Falls Live' public/synced-national-tools/rockies/index.html
          grep -q 'Rocky Mountain Elk Rut Live' public/synced-national-tools/rockies/index.html
          grep -q 'Trail Ridge Road Live' public/synced-national-tools/rockies/index.html
          grep -q 'Yellowstone Geyser Timing' public/synced-national-tools/rockies/index.html
          grep -q 'numberOfItems":4' public/synced-national-tools/rockies/index.html
          grep -q 'Road first. Weather second.' public/synced-national-tools/trail-ridge-road/index.html
          grep -qi 'official NPS road status comes first' public/synced-national-tools/trail-ridge-road/index.html
          grep -q 'A window, not an appointment.' public/synced-national-tools/yellowstone-geysers/index.html
          grep -qi 'does not invent an eruption schedule' public/synced-national-tools/yellowstone-geysers/index.html

          grep -q 'Insufficient recent sampling nearby' api/florida-red-tide.js
          grep -qi 'not an all-clear' api/florida-red-tide.js
          grep -q 'isFutureLaunch' api/space-coast-launch.js
          grep -q 'filter(l=>isFutureLaunch(l,now))' api/space-coast-launch.js
          grep -q 'NWS hourly guidance does not yet cover the launch time' api/space-coast-launch.js
          grep -q 'NPS road status is authoritative' api/trail-ridge-road.js
          grep -q 'weather assessment never overrides it' api/trail-ridge-road.js
          grep -q 'does not calculate its own eruption model' api/yellowstone-geysers.js
          grep -q 'Open Database License' api/yellowstone-geysers.js

          grep -q 'Where should you bird this morning?' public/synced-national-tools/bird-migration/index.html
          grep -q 'Strongest current evidence' public/synced-national-tools/bird-migration/index.html
          grep -q 'Closer strong option' public/synced-national-tools/bird-migration/index.html
          grep -q 'Other places to check' public/synced-national-tools/bird-migration/index.html
          grep -q 'at least 2 miles closer and at least 15% closer' public/synced-national-tools/bird-migration/index.html
          grep -q '.choice-grid{display:grid' public/synced-national-tools/bird-migration/styles.css
          grep -q '.notable-panel{grid-column:1/-1}' public/synced-national-tools/bird-migration/styles.css
          grep -q 'decisionChoices' public/synced-national-tools/bird-migration/app.js
          grep -q 'distanceSavedMi' public/synced-national-tools/bird-migration/app.js
          grep -q "ACTION='/api/birding-local-action'" public/synced-national-tools/bird-migration/app.js
          grep -q 'michiganbirdingreport.com/api/observations' api/bird-migration-morning.js
          grep -q 'michiganbirdingreport.com/api/local-action' api/birding-local-action.js
          grep -q "DECISION_SURFACE='two-choice-v1'" api/birding-local-action.js
          grep -q 'decisionSurface:DECISION_SURFACE' api/birding-local-action.js
          grep -q 'Columbia Salmon Run Live' public/synced-national-tools/columbia-salmon-run/index.html

          node -e "const v=require('./vercel.json'); const needed=['/national-tools/northeast-great-lakes/','/national-tools/southeast/','/national-tools/rockies/','/national-tools/bird-migration/:path*','/national-tools/columbia-salmon-run/:path*','/national-tools/florida-red-tide/:path*','/national-tools/space-coast-launch/:path*','/national-tools/trail-ridge-road/:path*','/national-tools/yellowstone-geysers/:path*']; for(const source of needed) if(!v.rewrites.some(r=>r.source===source)) process.exit(1); for(const f of ['api/bird-migration-morning.js','api/birding-local-action.js','api/columbia-salmon.js','api/florida-red-tide.js','api/space-coast-launch.js','api/trail-ridge-road.js','api/yellowstone-geysers.js']) if(v.functions[f]) process.exit(1);"
          node -e "require('./api/bird-migration-morning.js'); require('./api/birding-local-action.js'); require('./api/florida-red-tide.js'); require('./api/space-coast-launch.js'); require('./api/trail-ridge-road.js'); require('./api/yellowstone-geysers.js'); import('./api/columbia-salmon.js').then(()=>console.log('National APIs load')).catch(e=>{console.error(e);process.exit(1)})"

      - name: Commit production gate
        shell: bash
        run: |
          if git diff --quiet -- vercel.json api/bird-migration-morning.js api/birding-local-action.js api/columbia-salmon.js api/florida-red-tide.js api/space-coast-launch.js api/trail-ridge-road.js api/yellowstone-geysers.js public/synced-national-tools; then
            echo 'Verified National Tools gate already synced.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vercel.json api/bird-migration-morning.js api/birding-local-action.js api/columbia-salmon.js api/florida-red-tide.js api/space-coast-launch.js api/trail-ridge-road.js api/yellowstone-geysers.js public/synced-national-tools
          git commit -m 'Sync verified National Tools production gate'
          git push
