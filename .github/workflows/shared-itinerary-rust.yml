name: Shared itinerary Rust WASM parity
on:
  pull_request:
    branches: [main]
    paths:
      - 'rust/shared-itinerary/**'
      - 'public/assets/shared-itinerary-engine.js'
      - 'public/assets/shared-itinerary.wasm.b64'
      - 'public/assets/up-waterfalls-day-sheet.js'
      - 'public/assets/up-waterfalls-nearby.js'
      - 'public/assets/up-waterfalls-munising-day.js'
      - 'public/assets/up-waterfalls-presque-isle-outing.js'
      - 'public/assets/up-waterfalls-regional-clusters.js'
      - 'public/upper-peninsula-waterfalls/index.html'
      - 'scripts/verify-shared-itinerary-rust.cjs'
      - 'tests/shared-itinerary-engine.test.cjs'
      - 'public/assets/circle-tour-rust-itinerary.js'
      - 'public/assets/circle-tour-feasibility-ui.js'
      - 'public/assets/circle-tour-trip-intelligence.json'
      - 'public/lake-superior-circle-tour/10-day/index.html'
      - 'scripts/build-circle-tour-trip-intelligence.py'
      - 'tests/circle-tour-trip-intelligence.test.cjs'
      - 'public/assets/lake-superior-circle-tour-core.js'
      - 'public/assets/lake-superior-circle-tour-live-day.js'
      - 'public/assets/lake-superior-circle-tour.js'
      - 'tests/circle-tour-shared-rust.test.cjs'
      - 'scripts/verify-circle-tour-bridge-browser.cjs'
      - '.github/workflows/shared-itinerary-rust.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install exact source-compatible Rust compiler
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          rustup default 1.90.0
          rustup target add wasm32-unknown-unknown --toolchain 1.90.0
      - name: Run native Rust unit tests
        run: |
          rustc --edition=2021 --test rust/shared-itinerary/src/lib.rs -o /tmp/shared-itinerary-tests
          /tmp/shared-itinerary-tests
      - name: Build actual browser-compatible WebAssembly
        run: |
          rustc --edition=2021 --crate-type cdylib --target wasm32-unknown-unknown \
            -C opt-level=z -C codegen-units=1 -C lto=fat -C panic=abort -C strip=symbols \
            -o /tmp/shared-itinerary.wasm rust/shared-itinerary/src/lib.rs
          echo SHARED_ITINERARY_WASM_B64_BEGIN
          base64 -w0 /tmp/shared-itinerary.wasm
          echo
          echo SHARED_ITINERARY_WASM_B64_END
      - name: Test compiled Rust against independent JavaScript contract
        run: node scripts/verify-shared-itinerary-rust.cjs --wasm=/tmp/shared-itinerary.wasm
      - name: Test existing destination and day-sheet policies
        run: |
          node --test tests/shared-itinerary-engine.test.cjs tests/up-waterfalls-day-sheet.test.js \
            tests/up-waterfalls-munising-day.test.js tests/up-waterfalls-presque-isle-outing.test.js \
            tests/up-waterfalls-regional-clusters.test.js tests/up-waterfalls-b59-nearby-python.test.js \
            tests/circle-tour-shared-rust.test.cjs tests/circle-tour-foundation.test.cjs tests/circle-tour-trip-intelligence.test.cjs
