name: Stamp freshness once

on:
  push:
    branches:
      - agent/adsense-auto-ads-sitewide
    paths:
      - .github/workflows/stamp-freshness-once.yml

permissions:
  contents: write

jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/adsense-auto-ads-sitewide
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run canonical freshness stamper
        run: node scripts/stamp-freshness.mjs
      - name: Commit derived freshness metadata and remove helper
        shell: bash
        run: |
          rm -f .github/workflows/stamp-freshness-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public .github/workflows/stamp-freshness-once.yml
          if git diff --cached --quiet; then
            echo "No freshness changes to commit"
            exit 0
          fi
          git commit -m "Sync derived freshness metadata"
          git push origin HEAD:agent/adsense-auto-ads-sitewide
