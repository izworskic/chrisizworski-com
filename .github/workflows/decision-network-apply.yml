name: Apply decision network growth build
on:
  push:
    branches: [agent/decision-network-boat-shipwreck]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/decision-network-boat-shipwreck
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic patch
        run: node scripts/apply-decision-network-growth.mjs
      - name: Remove one-time patch files
        run: rm scripts/apply-decision-network-growth.mjs .github/workflows/decision-network-apply.yml
      - name: Commit generated build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Build decision network, boat finder, and shipwreck explorer"
          git push origin HEAD:agent/decision-network-boat-shipwreck
