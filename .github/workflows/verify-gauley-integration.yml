name: Verify Gauley Integration

on:
  push:
    branches: [main]
    paths:
      - 'api/gauley-*.js'
      - 'scripts/*gauley*'
      - 'public/national-tools/gauley-release-live/index.html'
      - 'vercel.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/verify-gauley-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Run exact Vercel build command
        run: npm run vercel-build
      - name: Verify static Gauley persona artifact
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const body=fs.readFileSync('public/national-tools/gauley-release-live/index.html','utf8');
          for(const marker of ['Private paddle','Raft guest','data-persona="watch"','data-persona="photo"','Since your last check','persona-tabs','decision-card','ENVIRONMENTAL CONTEXT INDEX']){
            if(!body.includes(marker)) throw new Error(`missing ${marker}`);
          }
          if(!body.includes('/api/gauley-live')||!body.includes('/api/gauley-history')) throw new Error('first-party API remap missing');
          console.log('Gauley first-party static persona artifact: PASS');
          NODE
