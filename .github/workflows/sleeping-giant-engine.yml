name: Sleeping Giant engine and GIS source tests

on:
  pull_request:
    paths:
      - 'data/sleeping-giant/**'
      - 'lib/sleeping-giant/**'
      - 'tests/sleeping-giant-*.test.js'
      - 'scripts/export-sleeping-giant-geometry.mjs'
      - 'scripts/export-sleeping-giant-visitor-preview.mjs'
      - 'previews/sleeping-giant-explorer/**'
      - '.github/workflows/sleeping-giant-engine.yml'
  workflow_dispatch:

jobs:
  engine-contracts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Test route, daylight, forecast and GIS-source safety gates
        run: node --test tests/sleeping-giant-*.test.js
      - name: Export research-only trail topology report
        run: |
          mkdir -p artifacts/sleeping-giant
          node lib/sleeping-giant/topology-audit.cjs > artifacts/sleeping-giant/topology-audit.json
      - name: Export non-navigable geometry reconciliation and internal HTML map viewer
        run: node scripts/export-sleeping-giant-geometry.mjs artifacts/sleeping-giant
      - name: Export standalone visitor-facing explorer preview (review only)
        run: node scripts/export-sleeping-giant-visitor-preview.mjs artifacts/sleeping-giant/visitor-preview
      - uses: actions/upload-artifact@v4
        with:
          name: sleeping-giant-topology-audit
          path: artifacts/sleeping-giant/
          if-no-files-found: error
          retention-days: 14

  combined-repository-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact repository dependencies
        run: npm ci
      - name: Verify the actual feature + repaired baseline merge
        run: npm run verify:all
