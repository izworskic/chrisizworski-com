name: NYC official source scientific audit
on:
  pull_request:
    paths:
      - 'scripts/nyc_departure_intelligence.py'
      - 'scripts/test_nyc_departure_intelligence.py'
      - '.github/workflows/nyc-real-source-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate-real-observations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Test Python source and model rules independently of the live feed
        run: python3 -m unittest scripts/test_nyc_departure_intelligence.py -v
      - name: Independently examine actual NYC DOT rows and source heartbeats
        run: |
          mkdir -p /tmp/nyc-science
          python3 scripts/nyc_departure_intelligence.py audit-live --report /tmp/nyc-science/source-and-backtest.json
      - name: Save actual scientific findings without publishing a forecast
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nyc-real-source-backtest
          path: /tmp/nyc-science/*.json
          retention-days: 30
          if-no-files-found: warn
