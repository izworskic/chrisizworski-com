name: Verify Mackinac score production

on:
  push:
    branches:
      - 'fix/mackinac-zero-score'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live score contract
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -H 'Cache-Control: no-cache' 'https://chrisizworski.com/mackinac-island/?score_verify=live20' -o /tmp/page.html
          grep -q 'mackinac-island.js?v=20260920-live20' /tmp/page.html

          curl -fsSL -H 'Cache-Control: no-cache' 'https://chrisizworski.com/assets/mackinac-island.js?v=20260920-live20' -o /tmp/client.js
          grep -q 'tripDateExplicit:false' /tmp/client.js
          grep -q 'Visit score unavailable' /tmp/client.js
          if grep -q 'score=Math.round(dec.score||0)' /tmp/client.js; then
            echo 'ERROR: stale null-to-zero coercion is still live'
            exit 1
          fi

          curl -fsSL -H 'Cache-Control: no-cache' 'https://chrisizworski.com/api/mackinac-island?score_verify=live20' -o /tmp/default.json
          python - <<'PY'
          import json, math
          d=json.load(open('/tmp/default.json'))
          score=(d.get('decision') or {}).get('score')
          if not isinstance(score,(int,float)) or isinstance(score,bool) or not math.isfinite(score) or score <= 0:
              raise SystemExit(f'Invalid default score: {score!r}')
          print(json.dumps({
              'generated_at':d.get('generated_at'),
              'local_now':d.get('local_now'),
              'planning_mode':d.get('planning_mode'),
              'target_date':d.get('target_date'),
              'score':score,
              'label':(d.get('decision') or {}).get('label'),
              'confidence':(d.get('decision') or {}).get('confidence'),
              'engine':(d.get('decision') or {}).get('engine'),
              'engine_note':(d.get('decision') or {}).get('engine_note'),
              'weather_score':((d.get('decision') or {}).get('components') or {}).get('weather'),
              'marine_score':((d.get('decision') or {}).get('components') or {}).get('marine'),
              'crowd_score':((d.get('decision') or {}).get('components') or {}).get('crowd'),
              'ferry':(d.get('ferry') or {}).get('recommended_plan'),
              'failures':d.get('failures')
          },indent=2))
          PY
