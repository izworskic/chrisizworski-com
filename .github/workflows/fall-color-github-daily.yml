name: Publish free GitHub fall-color editions

on:
  # GitHub's schedule is UTC; 11:25 UTC is 7:25 AM in October and
  # 6:25 AM in winter. Date keys themselves always use Detroit local time.
  schedule:
    - cron: '25 11 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fall-color-github-daily.yml"

permissions:
  contents: write
  id-token: write

concurrency:
  group: fall-color-github-daily-writer
  cancel-in-progress: false

jobs:
  seasonal-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Michigan fall progression with Python
        run: python3 scripts/verify_fall_color_season.py

  publish:
    needs: seasonal-audit
    uses: ./.github/workflows/fall-color-writer-test.yml
    with:
      publish_github: true
    permissions:
      contents: write
      id-token: write
