name: Publish free GitHub fall-color editions

on:
  # GitHub's schedule is UTC; 11:25 UTC is 7:25 AM in October and
  # 6:25 AM in winter. Date keys themselves always use Detroit local time.
  schedule:
    - cron: '25 11 * * *'
  workflow_dispatch:
    inputs:
      recovery:
        description: 'Recover missing editions from source evidence without a model call'
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - ".github/workflows/fall-color-github-daily.yml"
      - ".github/workflows/fall-color-writer-test.yml"
      - "lib/fall-color/routes/github-publish.js"
      - "lib/fall-color/routes/national-briefings.js"

permissions:
  contents: write
  id-token: write

concurrency:
  group: fall-color-github-daily-writer
  cancel-in-progress: false

jobs:
  seasonal-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Michigan fall progression with Python
        run: python3 scripts/verify_fall_color_season.py

  publish:
    needs: seasonal-audit
    uses: ./.github/workflows/fall-color-writer-test.yml
    with:
      publish_github: true
      recovery_only: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.recovery) }}
    permissions:
      contents: write
      id-token: write
