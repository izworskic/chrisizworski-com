name: Cuyahoga noindex preview browser QA

# One-time read-only local browser smoke; not a deployment or live API test.
on:
  push:
    branches: [research/cuyahoga-ais-audit-20261122, design/cuyahoga-river-desk-v2-20261122]
    paths:
      - .github/workflows/cuyahoga-preview-browser-qa.yml
      - tests/cuyahoga-public-watch.test.js
      - scripts/cuyahoga-browser-smoke.py
      - public/cuyahoga-freighter-watch/index.html
      - public/assets/cuyahoga-watch.css
      - public/assets/cuyahoga-watch-app.js

permissions:
  contents: read

jobs:
  verified-local-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Run offline source and public preview unit tests
        run: |
          node --check public/assets/cuyahoga-watch-core.js
          node --check public/assets/cuyahoga-watch-app.js
          node --test tests/cuyahoga-public-watch.test.js
      - name: Create isolated browser-only Python environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/cuyahoga-browser-env"
          "$RUNNER_TEMP/cuyahoga-browser-env/bin/pip" install --quiet 'playwright==1.58.0'
          if command -v google-chrome >/dev/null || command -v chromium >/dev/null; then
            echo 'Existing browser runtime available'
          else
            "$RUNNER_TEMP/cuyahoga-browser-env/bin/python" -m playwright install chromium
          fi
      - name: Install ephemeral axe accessibility auditor
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/cuyahoga-axe" --ignore-scripts --no-save --package-lock=false 'axe-core@4.10.3'
      - name: Exercise real map, public places, fresh AIS, history and no-JS
        shell: bash
        env:
          CUYAHOGA_QA_OUTPUT: ${{ runner.temp }}/cuyahoga-preview-qa
          CUYAHOGA_AXE_PATH: ${{ runner.temp }}/cuyahoga-axe/node_modules/axe-core/axe.min.js
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 --directory public > "$RUNNER_TEMP/cuyahoga-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          "$RUNNER_TEMP/cuyahoga-browser-env/bin/python" scripts/cuyahoga-browser-smoke.py
          echo '### Cuyahoga shore-watch preview browser QA' >> "$GITHUB_STEP_SUMMARY"
          echo 'Mocked local AIS; real static NOAA data and official park source. Full-width mobile and desktop map UX, 360/390/768/1280/1440 px, no-JavaScript fallback.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Screenshots and browser acceptance JSON in attached short-retention artifact.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cuyahoga-preview-browser-qa
          path: ${{ runner.temp }}/cuyahoga-preview-qa/
          if-no-files-found: warn
          retention-days: 3
