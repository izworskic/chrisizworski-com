name: Diagnose Mackinac live score

on:
  push:
    branches:
      - 'fix/mackinac-zero-score'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch live Mackinac decision bundle
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://chrisizworski.com/api/mackinac-island' -o /tmp/mackinac.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/mackinac.json'))
          print(json.dumps({
            "generated_at":d.get("generated_at"),
            "local_now":d.get("local_now"),
            "planning_mode":d.get("planning_mode"),
            "target_date":d.get("target_date"),
            "decision":d.get("decision"),
            "weather":d.get("weather"),
            "marine":d.get("marine"),
            "crowds":d.get("crowds"),
            "ferry": {
              "recommended_plan": (d.get("ferry") or {}).get("recommended_plan"),
              "freshness": (d.get("ferry") or {}).get("freshness")
            },
            "failures":d.get("failures"),
            "operational":d.get("operational")
          }, indent=2)[:50000])
          PY
