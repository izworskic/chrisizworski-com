name: Stamp owned-domain freshness
on:
  push:
    branches:
      - feat/owned-domain-network
permissions:
  contents: write
jobs:
  stamp:
    if: "!contains(github.event.head_commit.message, '[freshness-stamped]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/owned-domain-network
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Stamp page and sitemap freshness
        run: node scripts/stamp-freshness.mjs
      - name: Commit freshness-only changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/projects/index.html public/sitemap.xml public/sitemap-reputation.xml public/sitemap-beaches.xml
          git commit -m "Stamp owned-domain freshness [freshness-stamped]"
          git push origin HEAD:feat/owned-domain-network
