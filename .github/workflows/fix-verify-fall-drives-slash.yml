name: Fix verifier fall drives path
on:
  push:
    branches: [fix/verify-fall-drives-slash]
    paths: [.github/workflows/fix-verify-fall-drives-slash.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/verify-fall-drives-slash
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Normalize intentional-change path
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/verify-source.mjs')
          s=p.read_text()
          old='  "/fall-color/michigan-fall-color-drives",\n  "/fall-color/when-do-leaves-peak-in-michigan",'
          new='  "/fall-color/michigan-fall-color-drives",\n  "/fall-color/michigan-fall-color-drives/",\n  "/fall-color/when-do-leaves-peak-in-michigan",'
          if old not in s: raise SystemExit('verifier anchor changed')
          p.write_text(s.replace(old,new,1))
          PY
          node scripts/verify-source.mjs
      - name: Commit verifier-only fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/verify-source.mjs
          git rm .github/workflows/fix-verify-fall-drives-slash.yml
          git commit -m 'Normalize Fall Color Drives verifier path'
          git push origin HEAD:fix/verify-fall-drives-slash
