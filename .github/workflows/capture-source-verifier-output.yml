name: Capture source verifier output

on:
  push:
    branches:
      - agent/michigan-ice-breakout-20260930

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/michigan-ice-breakout-20260930
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Capture verifier result
        run: |
          npm run verify > source-verifier-output.txt 2>&1 || true
          git rm .github/workflows/capture-source-verifier-output.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source-verifier-output.txt
          git commit -m "Capture source verifier diagnostics"
          git push origin HEAD:agent/michigan-ice-breakout-20260930
