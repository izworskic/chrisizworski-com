name: Fix entity CTR title test

on:
  push:
    branches:
      - feat/entity-discovery-runtime-ctr-2026-08-23

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/entity-discovery-runtime-ctr-2026-08-23
          fetch-depth: 0
      - name: Update stale Tools title assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/static-integrations.test.js')
          s = p.read_text()
          old = '<title>Free Michigan &amp; Great Lakes Tools | Chris Izworski</title>'
          new = '<title>Michigan &amp; Great Lakes Live Tools | Chris Izworski</title>'
          if old not in s:
              raise SystemExit('old title assertion not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git rm .github/workflows/fix-entity-title-test-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/static-integrations.test.js
          git commit -m 'Align Tools integration test with CTR treatment'
          git push origin HEAD
