name: Diagnose Cape Hatteras site-wide gate
on:
  push:
    branches: ["cape-hatteras-access-live"]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: boat launches
        continue-on-error: true
        run: npm run benchmark:boat-launches
      - name: boat source audit
        continue-on-error: true
        run: npm run audit:boat-launch-source
      - name: boat launches v3
        continue-on-error: true
        run: npm run benchmark:boat-launches-v3
      - name: boat search
        continue-on-error: true
        run: npm run benchmark:boat-launch-search
      - name: manistee
        continue-on-error: true
        run: npm run benchmark:manistee
      - name: manistee parity
        continue-on-error: true
        run: npm run benchmark:manistee-parity
      - name: manistee popups
        continue-on-error: true
        run: npm run benchmark:manistee-popups
      - name: manistee ux
        continue-on-error: true
        run: npm run benchmark:manistee-ux
      - name: au sable search
        continue-on-error: true
        run: npm run benchmark:au-sable-search
      - name: manistee page one
        continue-on-error: true
        run: npm run benchmark:manistee-page-one -- --check
      - name: fall aurora ctr
        continue-on-error: true
        run: npm run benchmark:fall-aurora-ctr -- --check
      - name: upper peninsula fall rank
        continue-on-error: true
        run: npm run benchmark:up-fall-rank -- --check
      - name: fall weekend planner ctr
        continue-on-error: true
        run: npm run benchmark:fall-weekend-planner-ctr -- --check
      - name: beach detail ctr
        continue-on-error: true
        run: npm run benchmark:beach-detail-ctr -- --check
      - name: garden page one
        continue-on-error: true
        run: npm run benchmark:garden-page-one-ctr -- --check
      - name: entity discovery ctr
        continue-on-error: true
        run: npm run benchmark:entity-discovery-ctr -- --check
      - name: circle tour rank
        continue-on-error: true
        run: npm run benchmark:circle-tour-rank -- --check
      - name: extracted routing
        continue-on-error: true
        run: npm run benchmark:extracted-routing
      - name: gauley routing
        continue-on-error: true
        run: npm run benchmark:gauley-routing
      - name: tool entities
        continue-on-error: true
        run: npm run benchmark:tool-entities
      - name: white christmas indexing
        continue-on-error: true
        run: npm run benchmark:white-christmas-indexing
