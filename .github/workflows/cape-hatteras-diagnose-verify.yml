name: Diagnose Cape Hatteras site-wide gate
on:
  push:
    branches: ["cape-hatteras-access-live"]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: search authority
        continue-on-error: true
        run: npm run benchmark:search-authority -- --check
      - name: outdoors growth
        continue-on-error: true
        run: npm run benchmark:outdoors-now-growth -- --check
      - name: mackinac toll ctr
        continue-on-error: true
        run: npm run benchmark:mackinac-toll-ctr
      - name: trip stack
        continue-on-error: true
        run: npm run benchmark:trip-stack -- --check
      - name: tool network
        continue-on-error: true
        run: npm run benchmark:tool-network -- --check
      - name: circle tour
        continue-on-error: true
        run: npm run benchmark:circle-tour
      - name: entity
        continue-on-error: true
        run: npm run benchmark:entity -- --check
      - name: winter
        continue-on-error: true
        run: npm run benchmark:winter -- --check
      - name: winter flow
        continue-on-error: true
        run: npm run benchmark:winter-flow -- --check
      - name: winter final
        continue-on-error: true
        run: npm run benchmark:winter-final -- --check
      - name: freshness
        continue-on-error: true
        run: npm run freshness -- --check
      - name: citation
        continue-on-error: true
        run: npm run benchmark:citation -- --check
      - name: decision network
        continue-on-error: true
        run: npm run benchmark:decision-network
      - name: map insights
        continue-on-error: true
        run: npm run benchmark:map-insights
