name: Yellowstone live API diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/yellowstone-live-diagnostic.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Print live Yellowstone contract
        shell: bash
        run: |
          set -euo pipefail
          raw="$(curl --retry 5 --retry-delay 3 --retry-all-errors -fLsS -H 'Cache-Control: no-cache' 'https://chrisizworski.com/api/yellowstone-geysers?gate-debug=20260916-yellowstone-contract')"
          node - <<'NODE' "$raw"
          const d=JSON.parse(process.argv[2]);
          console.log(JSON.stringify({
            ok:d.ok,
            keys:Object.keys(d),
            source:d.source||null,
            sources:d.sources||null,
            nps:d.nps||null,
            next:d.next||null,
            predictionCount:Array.isArray(d.predictions)?d.predictions.length:null,
            predictions:Array.isArray(d.predictions)?d.predictions.map(p=>({geyserName:p.geyserName,available:p.available,source:p.source,prediction:p.prediction,windowOpen:p.windowOpen,windowClose:p.windowClose,expiration:p.expiration,forecastNumber:p.forecastNumber})):null,
            limits:d.limits||null,
            error:d.error||null,
            detail:d.detail||null
          },null,2));
          NODE
