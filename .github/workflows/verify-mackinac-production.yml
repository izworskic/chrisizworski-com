name: Verify Mackinac production routes

on:
  push:
    branches:
      - 'fix/mackinac-materialize-pages'

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for production and verify Mackinac routes
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            "/mackinac-island/"
            "/mackinac-island/plan/"
            "/mackinac-island/ferry-planner/"
            "/mackinac-island/where-to-stay/"
            "/mackinac-island/dining/"
            "/mackinac-island/things-to-do/"
            "/mackinac-island/events/"
            "/mackinac-island/around-the-straits/"
            "/mackinac-island/day-trip/"
            "/mackinac-island/with-kids/"
            "/mackinac-island/2-day-itinerary/"
            "/mackinac-island/limited-walking/"
            "/mackinac-island/bike-day/"
            "/mackinac-island/fall/"
          )
          for attempt in $(seq 1 30); do
            failed=0
            echo "Attempt $attempt"
            for path in "${paths[@]}"; do
              code=$(curl -L -sS -o /tmp/page.html -w "%{http_code}" "https://chrisizworski.com$path" || true)
              echo "$code $path"
              if [ "$code" != "200" ]; then failed=1; fi
            done
            if [ "$failed" -eq 0 ]; then
              echo "ALL MACKINAC PRODUCTION ROUTES RETURN 200"
              exit 0
            fi
            sleep 10
          done
          echo "Mackinac production route verification failed"
          exit 1
