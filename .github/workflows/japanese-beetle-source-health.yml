name: Japanese beetle Pheno Forecast source health
on:
  schedule:
    # Daily at 13:15 UTC April-October; source can be a little later in spring.
    - cron: '15 13 * 4-10 *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: japanese-beetle-source-health
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check dated USA-NPN Japanese beetle adult and egg model pixels
        run: node scripts/audit-japanese-beetle-source.cjs
      - name: Preserve source evidence for reliability measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: japanese-beetle-source-health
          path: artifacts/japanese-beetle-source-health/source-health.json
          if-no-files-found: warn
          retention-days: 45
