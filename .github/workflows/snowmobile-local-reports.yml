name: Snowmobile local club freshness and mobile UX
on:
  pull_request:
    paths:
      - api/snowmobile-local-reports.js
      - lib/snowmobile/local-reports.cjs
      - public/assets/snowmobile-local-reports.js
      - public/assets/snowmobile.css
      - public/snowmobile/regions/**
      - scripts/generate-snowmobile-region-pages.mjs
      - scripts/verify-snowmobile-local-reports-browser.cjs
      - tests/snowmobile-local-reports.test.js
      - .github/workflows/snowmobile-local-reports.yml
permissions:
  contents: read
jobs:
  local-report-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse production source desk code
        run: |
          node --check api/snowmobile-local-reports.js
          node --check lib/snowmobile/local-reports.cjs
          node --check public/assets/snowmobile-local-reports.js
          node --check scripts/verify-snowmobile-local-reports-browser.cjs
      - name: Test dated MISORVA parser, stale suppression, route safety and existing parking
        run: |
          node --test tests/snowmobile-local-reports.test.js tests/snowmobile-parking.test.js tests/snowmobile-access-evidence.test.js tests/snowmobile-route-ui.test.js tests/snowmobile-rust.test.js
      - name: Check regenerated regional pages match their source template
        run: |
          node scripts/generate-snowmobile-region-pages.mjs
          git diff --exit-code -- public/snowmobile/regions/
      - name: Install isolated Playwright driver
        run: |
          npm install --prefix /tmp/snowmobile-club-browser --no-save --ignore-scripts playwright@1.58.2
          echo "NODE_PATH=/tmp/snowmobile-club-browser/node_modules" >> "$GITHUB_ENV"
          echo "CHROME_PATH=$(command -v google-chrome || command -v chromium-browser)" >> "$GITHUB_ENV"
      - name: Exercise 390px and desktop visitor workflow without live-data reliance
        run: node scripts/verify-snowmobile-local-reports-browser.cjs
