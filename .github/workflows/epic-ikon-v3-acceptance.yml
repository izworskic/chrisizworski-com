name: Epic Ikon V3 Vail Acceptance
on:
  push:
    branches:
      - feature/epic-ikon-v3-vail-slice-20261012
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety-and-mobile:
    name: Vail safety + screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install repository dependencies
        run: npm ci --ignore-scripts
      - name: Deterministic Epic Ikon regression
        run: node --test tests/epic-ikon-decoder.test.js tests/epic-ikon-v2.test.js tests/epic-ikon-v3.test.js tests/epic-ikon-discovery.test.js
      - name: Complete repo tests
        run: npm test
      - name: Install pinned screenshot tooling
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve public tool without external API privileges
        run: |
          python3 -m http.server 4173 --directory public > /tmp/epic-ikon-local.log 2>&1 &
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/epic-ikon-pass/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/epic-ikon-local.log
          exit 1
      - name: Screenshot-based 390px and desktop acceptance
        run: node scripts/epic-ikon-v3-browser.cjs
      - name: Always retain browser screenshots for manual review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: epic-ikon-vail-visual-evidence
          path: artifacts/epic-ikon-v3/
          if-no-files-found: warn
          retention-days: 7
