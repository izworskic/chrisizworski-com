name: U.P. waterfalls public production audit
on:
  pull_request:
    branches: [main]
    paths:
      - 'public/upper-peninsula-waterfalls/research/**'
      - 'data/up-waterfall-release-blockers-*.json'
      - 'tests/up-waterfall-release-blockers-*.test.js'
      - 'tests/up-waterfalls-production-browser.mjs'
      - '.github/workflows/up-waterfalls-production-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: up-waterfalls-public-audit-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  public-browser:
    name: Read-only public mobile, desktop and held-route checks
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source evidence and release holds
        run: node --test tests/up-waterfall-release-blockers-20261117.test.js
      - name: Prepare actual Chromium
        run: |
          npm install --prefix /tmp/up-waterfalls-production-playwright --no-save --package-lock=false playwright@1.56.1
          if command -v google-chrome >/dev/null 2>&1; then
            echo "UP_WATERFALL_CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null 2>&1; then
            echo "UP_WATERFALL_CHROME=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            /tmp/up-waterfalls-production-playwright/node_modules/.bin/playwright install --with-deps chromium
          fi
      - name: Check actual public waterfall visitor journeys
        run: node tests/up-waterfalls-production-browser.mjs
      - name: Preserve observed results and viewport captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: up-waterfalls-public-production-audit
          path: /tmp/up-waterfalls-production-audit/
          if-no-files-found: warn
          retention-days: 7
