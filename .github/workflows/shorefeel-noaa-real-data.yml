name: ShoreFeel real NOAA archive research

on:
  pull_request:
    paths:
      - 'scripts/shorefeel-pull-noaa-research.py'
      - 'tests/test_shorefeel_noaa_pull.py'
      - '.github/workflows/shorefeel-noaa-real-data.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shorefeel-noaa-real-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline source-range and NDBC quality tests
        run: python3 -m unittest discover -s tests -p test_shorefeel_noaa_pull.py -v
      - name: Install pinned ecCodes Python bindings
        run: python3 -m pip install --disable-pip-version-check eccodes==2.50.1
      - name: Retrieve real NOAA archived 19 November 2026 model fields
        run: |
          mkdir -p artifacts/shorefeel-real-noaa
          python3 scripts/shorefeel-pull-noaa-research.py --date 20261119 --cycle 12 --lead 1 > artifacts/shorefeel-real-noaa/2026-11-19-12z.json
          python3 -m json.tool artifacts/shorefeel-real-noaa/2026-11-19-12z.json > /dev/null
          cat artifacts/shorefeel-real-noaa/2026-11-19-12z.json
      - name: Retain verified source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorefeel-real-noaa-20261119
          path: artifacts/shorefeel-real-noaa/
          if-no-files-found: warn
          retention-days: 30
