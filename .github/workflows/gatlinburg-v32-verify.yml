name: Gatlinburg v3.2 verification

on:
  push:
    branches:
      - agent/gatlinburg-winter
  workflow_dispatch:

jobs:
  gatlinburg-v32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check lib/gatlinburg-winter/route-v4.js
      - name: Gatlinburg regression suite
        run: node --test tests/gatlinburg-winter.test.js tests/gatlinburg-winter-v2.test.js tests/gatlinburg-winter-v3.test.js tests/gatlinburg-winter-v4.test.js
