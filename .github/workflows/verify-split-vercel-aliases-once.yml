name: Verify split Vercel aliases once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-split-vercel-aliases-once.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke public aliases
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/split-vercel-aliases.txt"
          : > "$OUT"
          check() {
            local name="$1" url="$2" pattern="$3"
            local body code
            body="$RUNNER_TEMP/body-$name"
            code="$(curl -L -sS -o "$body" -w '%{http_code}' --max-time 30 "$url")"
            if [ "$code" != "200" ]; then
              echo "FAIL $name HTTP_$code $url" | tee -a "$OUT"
              return 1
            fi
            if ! grep -Eqi "$pattern" "$body"; then
              echo "FAIL $name CONTENT $url" | tee -a "$OUT"
              return 1
            fi
            echo "PASS $name HTTP_200 $url" | tee -a "$OUT"
          }
          failures=0
          check core "https://national-outdoor-core.vercel.app/assets/national-tools.css" "national|tool|--" || failures=$((failures+1))
          check hub "https://national-outdoor-tools-hub.vercel.app/national-tools/" "National Outdoor|national tools|National" || failures=$((failures+1))
          check aurora "https://national-aurora.vercel.app/national-tools/aurora/" "Aurora|aurora" || failures=$((failures+1))
          check rivers "https://national-rivers.vercel.app/national-tools/rivers/" "River|river" || failures=$((failures+1))
          check frost "https://national-frost.vercel.app/national-tools/frost/" "Frost|frost" || failures=$((failures+1))
          check planting "https://national-planting.vercel.app/national-tools/planting/" "Plant|plant" || failures=$((failures+1))
          check fall "https://national-fall-color.vercel.app/national-tools/fall-color/" "Fall|color" || failures=$((failures+1))
          check coastal "https://national-coastal-water.vercel.app/national-tools/coastal/" "Coastal|coastal" || failures=$((failures+1))
          check snow "https://national-snowpack-melt.vercel.app/national-tools/snow/" "Snow|snow" || failures=$((failures+1))
          check christmas "https://national-white-christmas.vercel.app/national-tools/white-christmas/" "Christmas|christmas" || failures=$((failures+1))
          check christmascss "https://national-white-christmas.vercel.app/assets/white-christmas.css" "christmas|snow|--" || failures=$((failures+1))
          check isle "https://isle-royale-outdoors.vercel.app/isle-royale-map/" "Isle Royale" || failures=$((failures+1))
          echo "FAILURES $failures" | tee -a "$OUT"
          test "$failures" = "0"

      - name: Record smoke result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p migration
          cp "$RUNNER_TEMP/split-vercel-aliases.txt" migration/split-vercel-aliases.txt 2>/dev/null || echo "Smoke did not produce output." > migration/split-vercel-aliases.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add migration/split-vercel-aliases.txt
          git commit -m "Record split Vercel alias smoke result" || true
          git push origin HEAD:main
