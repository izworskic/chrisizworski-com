name: Winter engine one-shot regeneration

on:
  push:
    branches:
      - agent/winter-engine-v2
    paths:
      - scripts/apply-winter-engine-v2.mjs

permissions:
  contents: write

jobs:
  apply-and-regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/winter-engine-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply source changes
        run: node scripts/apply-winter-engine-v2.mjs
      - name: Regenerate Michigan Ice outputs
        run: npm run generate:ice
      - name: Remove one-shot migration machinery
        run: rm scripts/apply-winter-engine-v2.mjs .github/workflows/winter-engine-regenerate.yml
      - name: Commit generated source and outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Build winter Ice and XC decision upgrades"
          git push origin HEAD:agent/winter-engine-v2
