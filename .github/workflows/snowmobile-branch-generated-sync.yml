name: Snowmobile branch generated HTML sync (one-time)
on:
  push:
    branches:
      - feat/snowmobile-town-condition-discovery-20261123
    paths:
      - .github/workflows/snowmobile-branch-generated-sync.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/snowmobile-town-condition-discovery-20261123
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Regenerate all seven existing snowmobile region pages from source of truth
        run: node scripts/generate-snowmobile-region-pages.mjs
      - name: Commit only generator-owned snowmobile HTML
        run: |
          git add public/snowmobile/regions/*.html public/snowmobile/index.html
          if git diff --cached --quiet; then
            echo "Generated region HTML is already in sync"
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "build: sync seven generated snowmobile region pages"
            git push origin HEAD:feat/snowmobile-town-condition-discovery-20261123
          fi
