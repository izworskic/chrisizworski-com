name: Remote Trout production smoke

on:
  push:
    branches:
      - test/remote-trout-production-smoke
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/remote-trout-production-smoke.mjs
