name: Import authenticated historical Welland lock photographs
on:
  push:
    branches: [research/welland-exact-lock-photos-20261012]
    paths:
      - .github/workflows/welland-historic-photo-import.yml
  workflow_dispatch:
permissions: {contents: write}
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: true}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify public-domain metadata and download actual numbered photographs
        run: node scripts/fetch-welland-historic-locks.cjs
      - name: Optimize with accurate original aspect ratios
        run: |
          python -m pip install -q Pillow
          python scripts/optimize-welland-historic-locks.py
      - name: Confirm image bytes
        run: |
          for stem in lock5-construction-1916 lock8-gates-1929; do
            f="public/assets/welland/photos/${stem}.jpg"
            test -s "${f}" && file "${f}" | grep -q 'JPEG image data' || exit 1
            ls -lh "${f}"
          done
      - name: Commit sources to the research implementation branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'research/welland-exact-lock-photos-20261012'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/welland/photos/lock5-construction-1916.jpg public/assets/welland/photos/lock8-gates-1929.jpg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add two verified public-domain, exactly numbered Welland lock photos"
          git push origin "HEAD:$GITHUB_REF_NAME"
