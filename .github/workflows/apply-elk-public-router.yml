name: Apply Elk Public Router

on:
  push:
    branches: [fix/elk-public-router]
    paths:
      - ".github/workflows/apply-elk-public-router.yml"
      - "tests/ballard-locks-extracted.test.js"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  route-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/elk-public-router

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Fix existing SERP length violations
        run: |
          node <<'NODE'
          const fs = require('fs');
          const edits = [
            ['public/national-tools/blue-spring-live/index.html',
              'Blue Spring Live combines current spring and St. Johns River temperatures, weather, manatee signals and park planning to help you choose the best time to visit Blue Spring State Park.',
              'Live Blue Spring manatee conditions, spring and St. Johns River temperatures, weather, park planning and the best time to visit Blue Spring State Park.'],
            ['public/national-tools/blue-spring-live/manatee-conditions-today/index.html',
              'Blue Spring Manatee Conditions Today | Latest Published Count',
              'Blue Spring Manatee Conditions Today | Latest Count'],
            ['public/national-tools/blue-spring-live/manatee-conditions-today/index.html',
              'Check Blue Spring manatee conditions today with the latest published count, live spring and St. Johns River temperatures, refuge difference and weather context.',
              'Check Blue Spring manatee conditions today with the latest published count, live spring and river temperatures, refuge difference and weather context.'],
            ['public/northern-lights-michigan/keweenaw/index.html',
              'Northern Lights Keweenaw Tonight: Live Aurora Forecast | Chris Izworski',
              'Northern Lights Keweenaw Tonight | Chris Izworski'],
            ['public/northern-lights-michigan/keweenaw/index.html',
              'Can you see the northern lights in the Keweenaw tonight? Live NOAA aurora signal, Kp, solar wind and NWS cloud cover for Copper Harbor, Houghton and the Keweenaw Peninsula.',
              'Live NOAA aurora signal, Kp, solar wind and NWS cloud cover for Copper Harbor, Houghton and the Keweenaw Peninsula tonight.'],
            ['public/northern-lights-michigan/mackinaw-city/index.html',
              'Northern Lights Mackinaw City Tonight: Headlands Aurora Forecast | Chris Izworski',
              'Northern Lights Mackinaw City Tonight | Chris Izworski'],
            ['public/northern-lights-michigan/mackinaw-city/index.html',
              'Can you see the northern lights near Mackinaw City tonight? Live NOAA aurora signal, Kp, solar wind and NWS cloud cover for Mackinaw City, the Straits and Headlands area.',
              'Live NOAA aurora signal, Kp, solar wind and NWS cloud cover for Mackinaw City, the Straits and Headlands tonight.'],
            ['public/northern-lights-michigan/marquette/index.html',
              'Northern Lights Marquette Tonight: Live Aurora Forecast | Chris Izworski',
              'Northern Lights Marquette Tonight | Chris Izworski'],
            ['public/northern-lights-michigan/marquette/index.html',
              'Can you see the northern lights in Marquette tonight? Live NOAA aurora signal, Kp, solar wind and NWS cloud cover for Marquette and the central Upper Peninsula.',
              "Live NOAA aurora signal, Kp, solar wind and NWS cloud cover for Marquette and Michigan's central Upper Peninsula tonight."],
            ['public/northern-lights-michigan/munising/index.html',
              'Northern Lights Munising Tonight: Pictured Rocks Aurora Forecast | Chris Izworski',
              'Northern Lights Munising Tonight | Chris Izworski']
          ];
          for (const [file, from, to] of edits) {
            let text = fs.readFileSync(file, 'utf8');
            if (!text.includes(from)) throw new Error(`Expected SERP string not found in ${file}`);
            text = text.replace(from, to);
            fs.writeFileSync(file, text);
          }
          NODE

      - name: Add explicit elk routes
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'vercel.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          const rewrites = config.rewrites || [];
          const marker = rewrites.findIndex(r => r.source === '/national-tools/:path*');
          if (marker < 0) throw new Error('National Tools catch-all rewrite not found');

          const additions = [
            {
              source: '/national-tools/elk-rut',
              destination: 'https://national-outdoor-tools-hub.vercel.app/national-tools/elk-rut/'
            },
            {
              source: '/national-tools/elk-rut/',
              destination: 'https://national-outdoor-tools-hub.vercel.app/national-tools/elk-rut/'
            },
            {
              source: '/national-tools/elk-rut/_api/live',
              destination: 'https://national-outdoor-tools-hub.vercel.app/national-tools/elk-rut/_api/live'
            }
          ];

          const existing = new Set(rewrites.map(r => r.source));
          const missing = additions.filter(r => !existing.has(r.source));
          rewrites.splice(marker, 0, ...missing);
          config.rewrites = rewrites;
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          console.log(`Inserted ${missing.length} explicit elk routes before National Tools catch-all`);
          NODE
          node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8')); console.log('vercel.json: valid JSON')"
          git diff --check

      - name: Commit candidate changes locally
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vercel.json public/national-tools/blue-spring-live/index.html public/national-tools/blue-spring-live/manatee-conditions-today/index.html public/northern-lights-michigan/keweenaw/index.html public/northern-lights-michigan/mackinaw-city/index.html public/northern-lights-michigan/marquette/index.html public/northern-lights-michigan/munising/index.html
          git commit -m "Route elk tool and clear SERP length gate"

      - name: Reconcile derived freshness metadata
        run: |
          node scripts/stamp-freshness.mjs
          git diff --check
          echo "Freshness changes:"
          git status --short
          if git diff --unified=0 | grep -qi 'white-christmas'; then
            echo "Refusing to alter White Christmas pages or sitemap entries." >&2
            git diff --unified=0 | grep -i -C 2 'white-christmas' || true
            exit 1
          fi
          if ! git diff --quiet; then
            git add -A
            git commit -m "Sync freshness metadata after routing prep"
          fi

      - name: Repin generated reputation sitemap
        run: |
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const sitemap = fs.readFileSync('public/sitemap-reputation.xml');
          const hash = crypto.createHash('sha256').update(sitemap).digest('hex');
          const file = 'scripts/verify-source.mjs';
          let text = fs.readFileSync(file, 'utf8');
          const pin = /\["\/sitemap-reputation\.xml", "[a-f0-9]{64}"\]/g;
          const matches = text.match(pin) || [];
          if (matches.length !== 1) throw new Error(`Expected exactly one reputation sitemap pin; found ${matches.length}`);
          text = text.replace(pin, `["/sitemap-reputation.xml", "${hash}"]`);
          fs.writeFileSync(file, text);
          console.log(`Reputation sitemap SHA-256: ${hash}`);
          NODE
          git diff --check
          if git diff --unified=0 | grep -qi 'white-christmas'; then
            echo "Refusing to alter White Christmas pages or sitemap entries." >&2
            exit 1
          fi
          if ! git diff --quiet; then
            git add scripts/verify-source.mjs
            git commit -m "Repin reputation sitemap after freshness sync"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run full production gate
        run: npm run verify:all

      - name: Push verified candidate
        run: git push origin HEAD:fix/elk-public-router
