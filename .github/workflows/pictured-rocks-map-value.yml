name: Pictured Rocks map decision popups

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pictured-rocks-map-value.yml

permissions:
  contents: write

jobs:
  add-map-value:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply popup treatment
        run: python scripts/pictured-rocks-map-value-patch.py
      - name: Verify map value and preserve hard gates
        run: |
          node --test tests/pictured-rocks-carto-map.test.js tests/pictured-rocks-map-value.test.js
          grep -Fq "noWrap:true" public/assets/pictured-rocks-planner-v3.js
          grep -Fq "?key=" public/assets/pictured-rocks-planner-v3.js
      - name: Commit verified popup treatment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/pictured-rocks-planner-v3.js public/labs/pictured-rocks-planner/index.html tests/pictured-rocks-carto-map.test.js tests/pictured-rocks-map-value.test.js
          git commit -m "Add decision-rich Pictured Rocks map popups"
          git push origin HEAD:main
