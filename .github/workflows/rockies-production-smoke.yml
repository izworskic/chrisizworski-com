name: Rockies production smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rockies-production-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Rockies pages and directory
        shell: bash
        run: |
          set -euo pipefail
          fetch() { curl --retry 4 --retry-delay 2 --retry-all-errors -fLsS -H 'Cache-Control: no-cache' "$1"; }
          rockies=''
          for attempt in $(seq 1 48); do
            rockies="$(fetch 'https://chrisizworski.com/national-tools/rockies/?gate-smoke=20260916-rockies-v2' || true)"
            if grep -q 'Rocky Mountain Elk Rut Live' <<<"$rockies" && grep -q 'Trail Ridge Road Live' <<<"$rockies" && grep -q 'Yellowstone Geyser Timing' <<<"$rockies"; then break; fi
            sleep 5
          done
          grep -q 'Rocky Mountain Elk Rut Live' <<<"$rockies"
          grep -q 'Trail Ridge Road Live' <<<"$rockies"
          grep -q 'Yellowstone Geyser Timing' <<<"$rockies"
          grep -q 'numberOfItems":3' <<<"$rockies"

          directory="$(fetch 'https://chrisizworski.com/national-tools/?gate-smoke=20260916-rockies-v2')"
          grep -q 'data-tool-id="elk-rut"' <<<"$directory"
          grep -q 'data-tool-id="trail-ridge-road"' <<<"$directory"
          grep -q 'data-tool-id="yellowstone-geysers"' <<<"$directory"
          grep -q 'href="/national-tools/rockies/"' <<<"$directory"
          grep -q 'numberOfItems":34' <<<"$directory"

          trail="$(fetch 'https://chrisizworski.com/national-tools/trail-ridge-road/?gate-smoke=20260916-rockies-v2')"
          grep -q 'Road first. Weather second.' <<<"$trail"
          grep -qi 'official NPS road status comes first' <<<"$trail"

          geysers="$(fetch 'https://chrisizworski.com/national-tools/yellowstone-geysers/?gate-smoke=20260916-rockies-v2')"
          grep -q 'A window, not an appointment.' <<<"$geysers"
          grep -qi 'does not invent an eruption schedule' <<<"$geysers"

          css="$(fetch 'https://chrisizworski.com/national-tools/assets/mountain-tool.css?gate-smoke=20260916-rockies-v2')"
          grep -q '.decision-grid' <<<"$css"
          grep -q '.status' <<<"$css"

      - name: Verify Trail Ridge live API
        shell: bash
        run: |
          set -euo pipefail
          raw="$(curl --retry 8 --retry-delay 4 --retry-all-errors -fLsS -H 'Cache-Control: no-cache' 'https://chrisizworski.com/api/trail-ridge-road?gate-smoke=20260916-rockies-v2')"
          node - <<'NODE' "$raw"
          const d=JSON.parse(process.argv[2]);
          if(d.ok!==true||!d.road||!d.alpine?.weather?.assessment) process.exit(1);
          if(d.road.sourceTextMatched!==true) process.exit(1);
          if(!['open','closed'].includes(d.road.level)) process.exit(1);
          if(d.alpine.elevationFt!==11796) process.exit(1);
          if(!Array.isArray(d.sources)||!d.sources.some(s=>/Rocky Mountain National Park/i.test(s.name||''))||!d.sources.some(s=>/National Weather Service/i.test(s.name||''))) process.exit(1);
          const limits=(d.limits||[]).join(' ').toLowerCase();
          if(!limits.includes('authoritative')||!limits.includes('never overrides')) process.exit(1);
          console.log(JSON.stringify({road:{level:d.road.level,label:d.road.label,timedEntry:d.road.timedEntry||null},weather:d.alpine.weather.assessment.label,elevationFt:d.alpine.elevationFt}));
          NODE

      - name: Verify Yellowstone live API
        shell: bash
        run: |
          set -euo pipefail
          raw="$(curl --retry 8 --retry-delay 4 --retry-all-errors -fLsS -H 'Cache-Control: no-cache' 'https://chrisizworski.com/api/yellowstone-geysers?gate-smoke=20260916-rockies-v2')"
          node - <<'NODE' "$raw"
          const d=JSON.parse(process.argv[2]);
          if(d.ok!==true||!Array.isArray(d.predictions)||d.predictions.length!==6) process.exit(1);
          const expected=['Old Faithful','Castle','Daisy','Grand','Riverside','Great Fountain'];
          for(const name of expected) if(!d.predictions.some(p=>p.geyserName===name)) process.exit(1);
          for(const p of d.predictions){
            if(typeof p.available!=='boolean') process.exit(1);
            if(!p.available) continue;
            const pred=Date.parse(p.prediction), open=Date.parse(p.windowOpen), close=Date.parse(p.windowClose);
            if(!Number.isFinite(pred)||!Number.isFinite(open)||!Number.isFinite(close)||open>pred||pred>close||!p.source) process.exit(1);
          }
          if(d.next){
            const pred=Date.parse(d.next.prediction), open=Date.parse(d.next.windowOpen), close=Date.parse(d.next.windowClose);
            if(!expected.includes(d.next.geyserName)||!d.next.available||!Number.isFinite(pred)||!Number.isFinite(open)||!Number.isFinite(close)||open>pred||pred>close) process.exit(1);
          }
          if(d.source?.name!=='GeyserTimes'||!String(d.source.attribution||'').includes('Open Database License')) process.exit(1);
          if(!String(d.nps?.name||'').includes('Yellowstone National Park')) process.exit(1);
          const limits=(d.limits||[]).join(' ').toLowerCase();
          if(!limits.includes('window, not an appointment')||!limits.includes('does not calculate its own eruption model')) process.exit(1);
          console.log(JSON.stringify({predictionSlots:d.predictions.length,available:d.predictions.filter(p=>p.available).map(p=>p.geyserName),next:d.next?.geyserName||null,source:d.source.name}));
          NODE

      - name: Verify existing regional gates remain online
        shell: bash
        run: |
          set -euo pipefail
          fetch() { curl --retry 4 --retry-delay 3 --retry-all-errors -fLsS -H 'Cache-Control: no-cache' "$1"; }
          southeast="$(fetch 'https://chrisizworski.com/national-tools/southeast/?gate-smoke=20260916-rockies-regression')"
          grep -q 'Florida Red Tide Live' <<<"$southeast"
          grep -q 'Space Coast Launch Viewing' <<<"$southeast"
          northeast="$(fetch 'https://chrisizworski.com/national-tools/northeast-great-lakes/?gate-smoke=20260916-rockies-regression')"
          grep -q 'Great Lakes Levels' <<<"$northeast"
          grep -q 'Thunder Hole Live' <<<"$northeast"
          bird="$(fetch 'https://chrisizworski.com/national-tools/bird-migration/?gate-smoke=20260916-rockies-regression')"
          grep -q 'Where should you bird this morning?' <<<"$bird"
          columbia="$(fetch 'https://chrisizworski.com/national-tools/columbia-salmon-run/?gate-smoke=20260916-rockies-regression')"
          grep -q 'Columbia Salmon Run Live' <<<"$columbia"
