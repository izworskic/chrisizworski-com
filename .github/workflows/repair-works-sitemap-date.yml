name: Repair Works sitemap date
on:
  push:
    branches:
      - feat/owned-domain-network
permissions:
  contents: write
jobs:
  repair:
    if: "!contains(github.event.head_commit.message, '[works-date-repaired]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/owned-domain-network
      - name: Restore truthful Works sitemap dates
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['public/sitemap.xml','public/sitemap-reputation.xml']:
              p=Path(name)
              s=p.read_text()
              old='<loc>https://chrisizworski.com/chris-izworski-works/</loc>\n    <lastmod>2026-08-20</lastmod>'
              new='<loc>https://chrisizworski.com/chris-izworski-works/</loc>\n    <lastmod>2026-08-10</lastmod>'
              if s.count(old)!=1:
                  raise SystemExit(f'{name}: expected one Works 2026-08-20 entry, found {s.count(old)}')
              p.write_text(s.replace(old,new))
          PY
      - name: Commit sitemap repair
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/sitemap.xml public/sitemap-reputation.xml
          git commit -m "Restore Works sitemap freshness [works-date-repaired]"
          git push origin HEAD:feat/owned-domain-network
