name: Finalize owned-domain sitemap integrity
on:
  push:
    branches:
      - feat/owned-domain-network
permissions:
  contents: write
jobs:
  finalize:
    if: "!contains(github.event.head_commit.message, '[owned-domain-finalized]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/owned-domain-network
      - name: Pin the finished reputation sitemap and self-clean
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, re
          sitemap=Path('public/sitemap-reputation.xml').read_bytes()
          digest=hashlib.sha256(sitemap).hexdigest()
          p=Path('scripts/verify-source.mjs')
          s=p.read_text()
          pattern=r'(\["/sitemap-reputation\\.xml", ")[a-f0-9]{64}("\])'
          next_s,count=re.subn(pattern,lambda m:m.group(1)+digest+m.group(2),s)
          if count!=2:
              raise SystemExit(f'expected exactly two reputation sitemap pins, found {count}')
          p.write_text(next_s)
          PY
          git rm .github/workflows/repair-works-sitemap-date.yml
      - name: Commit final integrity state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-source.mjs
          git commit -m "Finalize owned-domain sitemap integrity [owned-domain-finalized]"
          git push origin HEAD:feat/owned-domain-network
