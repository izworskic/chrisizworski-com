name: Blue Ridge Google Maps handoff

on:
  push:
    branches:
      - feat/blue-ridge-google-maps-handoff

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/blue-ridge-google-maps-handoff
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply route handoff patch
        run: |
          python .github/blue-ridge-google-maps-patch.py
          sed -i 's/20260925-6/20260925-7/g' tests/blue-ridge-parkway-destination.test.js
      - name: Run Blue Ridge tests
        run: node --test tests/blue-ridge-google-maps.test.js tests/blue-ridge-parkway-destination.test.js tests/blue-ridge-parkway-ui.test.js tests/blue-ridge-parkway.test.js
      - name: Commit route handoff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/blue-ridge-parkway/engine.js lib/blue-ridge-parkway/point-to-point.js public/assets/blue-ridge-parkway.js public/blue-ridge-parkway/index.html tests/blue-ridge-google-maps.test.js tests/blue-ridge-parkway-destination.test.js
          git diff --cached --quiet && exit 0
          git commit -m "Wire full Blue Ridge route into Google Maps"
          git push origin HEAD:feat/blue-ridge-google-maps-handoff
