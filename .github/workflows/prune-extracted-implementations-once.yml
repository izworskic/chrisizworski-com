name: Prune extracted implementations once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prune-extracted-implementations-once.yml

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove extracted implementation trees
        shell: bash
        run: |
          set -euo pipefail

          git rm -r --ignore-unmatch             public/national-tools             public/isle-royale-map             public/white-christmas-probability-map             public/white-christmas-michigan             lib/isle-royale

          git rm --ignore-unmatch             api/national-aurora.js             api/national-coastal.js             api/national-fall-color.js             api/national-fall-observations.js             api/national-frost.js             api/national-geocode.js             api/national-river-context.js             api/national-rivers.js             api/national-snow.js             api/national-white-christmas.js             api/isle-royale.js             api/isle-royale-route-weather.js             api/isle-royale-water-intelligence.js             lib/national-outdoor.js             public/assets/national-tools.css             public/assets/national-tools.js             public/assets/national-dashboard.js             public/assets/national-hubs.js             public/assets/white-christmas.css             public/assets/isle-royale-map.js             public/assets/isle-royale-water-intelligence.js             public/data/national-usgs-streamflow-sites.json             public/data/national-planting-crops.json             scripts/benchmark-national-outdoor-tools.mjs             scripts/benchmark-national-search-hubs.mjs             scripts/benchmark-isle-royale-map.mjs             scripts/validate-national-production.mjs             scripts/generate-national-usgs-streamflow-index.mjs             scripts/build-isle-royale-context-layers.py             scripts/build-isle-royale-deep-layers.sh             scripts/build-isle-royale-water-geometry.mjs             scripts/derive-isle-royale-vegetation-overview.py             benchmarks/national-outdoor-tools.json             benchmarks/national-search-hubs.json             benchmarks/national-source-lifecycle.json             benchmarks/national-location-admission.json             benchmarks/national-intelligence-candidates-2026-09-02.json             benchmarks/isle-royale-map.json             docs/NATIONAL_OUTDOOR_TOOLS_MASTER_PROMPT.md             docs/isle-royale-map-master-prompt.md             docs/isle-royale-map-plan.md             .github/workflows/isle-royale-context-data.yml             .github/workflows/isle-royale-deep-data.yml

          git rm --ignore-unmatch tests/national-*.test.js tests/isle-royale-*.test.js

      - name: Update shell package and Vercel contracts
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');

          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          delete pkg.scripts['benchmark:isle-royale-map'];
          delete pkg.scripts['benchmark:national-tools'];
          delete pkg.scripts['benchmark:national-hubs'];
          pkg.scripts['benchmark:extracted-routing']='node scripts/verify-extracted-routing.mjs';

          const old='npm run benchmark:isle-royale-map && npm run benchmark:national-tools -- --check && npm run benchmark:national-hubs -- --check && ';
          if(!pkg.scripts['verify:all'].includes(old)) throw new Error('verify:all extracted benchmark segment not found');
          pkg.scripts['verify:all']=pkg.scripts['verify:all'].replace(old,'npm run benchmark:extracted-routing && ');
          fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');

          const vercel=JSON.parse(fs.readFileSync('vercel.json','utf8'));
          delete vercel.functions?.['api/national-rivers.js'];
          delete vercel.functions?.['api/isle-royale-water-intelligence.js'];
          fs.writeFileSync('vercel.json',JSON.stringify(vercel,null,2)+'\n');
          NODE

      - name: Run shell verification
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run verify
          npm run benchmark:extracted-routing
          npm run verify:all

      - name: Commit only if green
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove extracted National Tools and Isle Royale implementations"
          git push origin HEAD:main
