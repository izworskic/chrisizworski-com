# Temporary generation job. Removed from the PR after it commits generated ice artifacts.
name: Ice generator one-shot
on:
  push:
    branches:
      - feature/great-lakes-ice-cover-today-54-year
permissions:
  contents: write
jobs:
  build-ice:
    if: "!contains(github.event.head_commit.message, '[ice generated]')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin NOAA GLERL basin climatology source
        run: |
          mkdir -p scripts/ice/data
          curl --fail --silent --show-error --location --retry 2 --max-time 35 \
            "https://www.glerl.noaa.gov/data/ice/glicd/daily/bas.txt" \
            --output scripts/ice/data/noaa-basin-daily-1973-2026.txt
          wc -l scripts/ice/data/noaa-basin-daily-1973-2026.txt
      - name: Regenerate ice outputs and checksum manifest
        run: npm run generate:ice
      - name: Commit generated pages and source snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/ice/data/noaa-basin-daily-1973-2026.txt scripts/ice/generated.json public/michigan-ice/
          git commit -m "Generate NOAA record history and pinned data [ice generated]"
      - name: Run freshness stamping after commit, keeping only changed routes
        run: |
          node scripts/stamp-freshness.mjs
          git diff --name-only | while IFS= read -r file; do
            case "$file" in
              public/michigan-ice/ice-cover-history.html|public/michigan-ice/index.html|public/soo-locks/index.html|public/great-lakes/index.html|public/great-lakes-freighter-winter-layup/index.html)
                ;;
              *) git restore -- "$file" ;;
            esac
          done
          # Keep sitemap lastmods precise. Do not stamp unrelated entries in the
          # large evergreen/winter sitemaps merely because they share a file.
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const routes = {
            'public/sitemap.xml': ['/great-lakes/', '/soo-locks/', '/michigan-ice/',
              '/michigan-ice/ice-cover-history.html'],
            'public/sitemap-winter.xml': ['/michigan-ice/',
              '/michigan-ice/ice-cover-history.html', '/great-lakes-freighter-winter-layup/']
          };
          for(const [path, targets] of Object.entries(routes)) {
            let content = readFileSync(path, 'utf8');
            for(const route of targets) {
              const target = '<loc>https://chrisizworski.com' + route + '</loc>';
              const i = content.indexOf(target);
              if(i < 0 || content.indexOf(target, i+1) >= 0) throw Error('Missing/duplicate sitemap entry: '+route);
              const end = content.indexOf('</url>', i);
              if(end < 0) throw Error('Unclosed sitemap entry: '+route);
              const section = content.slice(i, end);
              if(!/<lastmod>\\d{4}-\\d{2}-\\d{2}<\\/lastmod>/.test(section))
                throw Error('Missing lastmod for '+route);
              content = content.slice(0, i) +
                section.replace(/<lastmod>\\d{4}-\\d{2}-\\d{2}<\\/lastmod>/,
                  '<lastmod>2026-11-23</lastmod>') + content.slice(end);
            }
            writeFileSync(path, content);
          }
          JS
          git add public/michigan-ice/ice-cover-history.html public/michigan-ice/index.html public/soo-locks/index.html public/great-lakes/index.html public/great-lakes-freighter-winter-layup/index.html public/sitemap.xml public/sitemap-winter.xml
          if ! git diff --cached --quiet; then
            git commit -m "Stamp exact changed ice routes and sitemap lastmods [ice generated]"
          fi
      - name: Push generated changes to review branch
        run: git push origin HEAD:feature/great-lakes-ice-cover-today-54-year
      - name: Install pinned dependencies
        run: npm ci
      - name: Full-history verification
        run: npm run verify:all
