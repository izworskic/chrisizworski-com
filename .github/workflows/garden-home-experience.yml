name: Garden homepage browser verification
on:
  pull_request:
    paths:
      - 'public/michigan-gardening/**'
      - 'public/michigan-garden-pest-watch/**'
      - 'public/assets/garden-pest-watch.*'
      - 'lib/garden-pest-watch.cjs'
      - 'lib/garden-pest-science.cjs'
      - 'lib/japanese-beetle-forecast.cjs'
      - 'api/japanese-beetle-forecast.js'
      - 'tests/japanese-beetle-forecast.test.js'
      - 'api/garden-pest-timing-lab.js'
      - 'tests/garden-pest-science.test.js'
      - 'api/michigan-garden-pest-watch.js'
      - 'scripts/verify-garden-pest-watch-browser.cjs'
      - 'public/leafcutter-bees/**'
      - 'api/leafcutter-release-weather.js'
      - 'lib/leafcutter-release.cjs'
      - 'scripts/verify-leafcutter-browser.cjs'
      - 'public/assets/garden-tools/**'
      - 'scripts/verify-garden-home-browser.cjs'
      - '.github/workflows/garden-home-experience.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser harness
        run: |
          npm install --prefix /tmp/garden-playwright --no-save --ignore-scripts playwright@1.58.2
          echo "NODE_PATH=/tmp/garden-playwright/node_modules" >> "$GITHUB_ENV"
          echo "CHROME_PATH=$(command -v google-chrome || command -v chromium-browser)" >> "$GITHUB_ENV"
      - name: Check selections and layout at phone, tablet and desktop widths
        run: node scripts/verify-garden-home-browser.cjs
      - name: Check leafcutter release forecast and mobile states
        run: node scripts/verify-leafcutter-browser.cjs
      - name: Check historical NASA model math, Daymet data QC and scientific vetoes
        run: node --test tests/garden-pest-science.test.js
      - name: Verify official Japanese beetle layers, calendar rollover, model states and evidence vetoes
        run: node --test tests/japanese-beetle-forecast.test.js
      - name: Check Garden Pest Watch crop, evidence, failure and responsive browser behavior
        run: node scripts/verify-garden-pest-watch-browser.cjs
      - name: Save screenshots for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: garden-home-browser-evidence
          path: |
            artifacts/garden-home-browser/
            artifacts/leafcutter-browser/
            artifacts/garden-pest-watch-browser/
          if-no-files-found: warn
          retention-days: 14
