name: One-time arrival-window development cohort remaining dates
on:
  pull_request:
    types: [opened]
    paths:
      - ".github/workflows/noaa-arrival-window-remaining.yml"
permissions:
  contents: read
jobs:
  probe:
    if: github.head_ref == 'research/noaa-arrival-window-remaining-20261124' && github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        day: ["2024-08-21","2024-08-23","2024-08-25","2024-08-27","2024-08-29","2024-08-31","2024-09-02","2024-09-03","2024-09-05","2024-09-06","2024-09-07","2024-09-08","2024-09-09","2024-09-11","2024-09-12","2024-09-13","2024-09-14","2024-09-16","2024-09-17","2024-09-18","2024-09-19"]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify research tests
        run: node --test tests/great-lakes-crossing-detection.test.js tests/great-lakes-crossing-references.test.js tests/great-lakes-reference-retrospect.test.js tests/great-lakes-passage-replay.test.js tests/great-lakes-route-progress-challenger.test.js tests/great-lakes-arrival-window-research.test.js tests/great-lakes-arrival-window-study.test.js
      - name: Install temporary pinned archive reader
        run: |
          python -m pip install --disable-pip-version-check --no-deps --only-binary=:all: pyarrow==21.0.0
      - name: Extract existing-model signed residuals
        shell: bash
        env:
          STUDY_DAY: ${{ matrix.day }}
        run: |
          set -euo pipefail
          umask 077
          private_dir="$(mktemp -d)"
          trap 'rm -rf "$private_dir"' EXIT
          export PRIVATE_INPUT="$private_dir/observations.json"
          export NOAA_REPORT="$private_dir/coverage.json"
          python scripts/noaa-public-only-reference-probe-20261124.py --self-test
          python scripts/noaa-public-only-reference-probe-20261124.py "$STUDY_DAY"
          node scripts/retrospect-great-lakes-reference.cjs "$PRIVATE_INPUT" "${RUNNER_TEMP}/proxy-aggregate.json" --arrival-residuals
          cp "$NOAA_REPORT" "${RUNNER_TEMP}/coverage-aggregate.json"
          cat "${RUNNER_TEMP}/proxy-aggregate.json"
      - uses: actions/upload-artifact@v4
        with:
          name: arrival-window-remaining-${{ matrix.day }}
          path: |
            ${{ runner.temp }}/proxy-aggregate.json
            ${{ runner.temp }}/coverage-aggregate.json
          if-no-files-found: error
          retention-days: 7
