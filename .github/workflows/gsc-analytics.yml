name: Native GSC Analytics

on:
  workflow_dispatch:
  schedule:
    - cron: '37 11 * * *'

permissions:
  contents: read
  id-token: write

concurrency:
  group: native-gsc-analytics
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mint repository-scoped OIDC token
        uses: actions/github-script@v7
        id: oidc
        with:
          script: |
            const token = await core.getIDToken('https://chrisizworski.com/api/gsc-analytics');
            core.setSecret(token);
            core.setOutput('token', token);
      - name: Collect finalized Search Console analytics
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-all-errors --max-time 45 \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            "https://chrisizworski.com/api/gsc-analytics?view=collect"
