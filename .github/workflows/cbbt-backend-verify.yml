name: CBBT backend verification

on:
  push:
    branches:
      - 'agent/cbbt-backend-engine-*'
      - main
    paths:
      - 'api/cbbt.js'
      - 'lib/cbbt/**'
      - 'tests/cbbt.test.js'
      - 'tests/fixtures/cbbt/**'
      - 'scripts/test-cbbt-live.mjs'
      - 'scripts/verify-cbbt-change-browser.cjs'
      - 'tests/cbbt-status-change.test.js'
      - 'public/assets/cbbt-live.js'
      - 'public/assets/cbbt-view.js'
      - 'public/chesapeake-bay-bridge-tunnel/**'
      - '.github/workflows/cbbt-backend-verify.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'api/cbbt.js'
      - 'lib/cbbt/**'
      - 'tests/cbbt.test.js'
      - 'tests/fixtures/cbbt/**'
      - 'scripts/test-cbbt-live.mjs'
      - 'scripts/verify-cbbt-change-browser.cjs'
      - 'tests/cbbt-status-change.test.js'
      - 'public/assets/cbbt-live.js'
      - 'public/assets/cbbt-view.js'
      - 'public/chesapeake-bay-bridge-tunnel/**'
      - '.github/workflows/cbbt-backend-verify.yml'

permissions:
  contents: read

jobs:
  verify-cbbt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm ci
      - name: Run deterministic CBBT tests
        run: node --test tests/cbbt.test.js tests/cbbt-frontend.test.js tests/cbbt-status-change.test.js
      - name: Run strict live-source smoke test
        run: node scripts/test-cbbt-live.mjs --strict
      - name: Install isolated Chromium harness
        run: |
          npm install --prefix "$RUNNER_TEMP/cbbt-playwright" --ignore-scripts --no-package-lock playwright@1.56.1
          "$RUNNER_TEMP/cbbt-playwright/node_modules/.bin/playwright" install --with-deps chromium
      - name: Replay observed status changes
        run: CBBT_PW_MODULE="$RUNNER_TEMP/cbbt-playwright/node_modules/playwright" node scripts/verify-cbbt-change-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cbbt-change-qa
          path: artifacts/cbbt-change-qa/
          if-no-files-found: ignore
          retention-days: 7
