name: CBBT backend verification

on:
  push:
    branches:
      - 'agent/cbbt-backend-engine-*'
      - main
    paths:
      - 'api/cbbt.js'
      - 'lib/cbbt/**'
      - 'tests/cbbt.test.js'
      - 'tests/fixtures/cbbt/**'
      - 'scripts/test-cbbt-live.mjs'
      - '.github/workflows/cbbt-backend-verify.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'api/cbbt.js'
      - 'lib/cbbt/**'
      - 'tests/cbbt.test.js'
      - 'tests/fixtures/cbbt/**'
      - 'scripts/test-cbbt-live.mjs'
      - '.github/workflows/cbbt-backend-verify.yml'

permissions:
  contents: read

jobs:
  verify-cbbt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm ci
      - name: Run deterministic CBBT tests
        run: node --test tests/cbbt.test.js
      - name: Inspect live CBBT status markup
        run: |
          node <<'NODE'
          const response = await fetch('https://www.cbbt.com/home/tunnel-traffic/');
          const html = await response.text();
          const lower = html.toLowerCase();
          const index = lower.indexOf('traffic delays');
          console.log('HTTP', response.status, 'traffic-delays-index', index);
          if (index >= 0) console.log(html.slice(Math.max(0, index - 1200), index + 700));
          const tags = [...html.matchAll(/<(?:img|div|span|p|section)[^>]*(?:open|status|traffic)[^>]*>/gi)].slice(0, 30).map((m) => m[0]);
          console.log('STATUS_TAGS', JSON.stringify(tags, null, 2));
          NODE
      - name: Run strict live-source smoke test
        run: node scripts/test-cbbt-live.mjs --strict
