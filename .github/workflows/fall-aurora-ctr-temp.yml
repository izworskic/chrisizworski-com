name: Temporary fall aurora CTR composer

on:
  push:
    branches:
      - feat/fall-aurora-ctr-2026-08-22

permissions:
  contents: write

jobs:
  compose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compose fall aurora CTR treatment
        run: node scripts/compose-fall-aurora-ctr.mjs
