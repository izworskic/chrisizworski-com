name: Ship Ballard live map layers

on:
  push:
    branches:
      - agent/ballard-map-live-layers-production
    paths:
      - '.github/workflows/ballard-live-map-production.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ballard-map-live-layers-production
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch production contracts
        run: python scripts/ballard-live-map-production.py
      - name: Install pinned Ballard package
        run: npm install --ignore-scripts
      - name: Sync authoritative Ballard files
        run: node scripts/sync-ballard-locks.mjs
      - name: Full repository gate
        run: npm run verify:all
      - name: Commit production integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json public/ballard-locks public/sitemap.xml api/ballard-locks.js tests/ballard-locks-extracted.test.js scripts/ballard-production-smoke.mjs
          git commit -m 'Ship Ballard fish AIS and camera map layers'
          git push
