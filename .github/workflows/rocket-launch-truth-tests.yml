name: Rocket Launch Truth source reconciliation regression

on:
  pull_request:
    paths:
      - 'lib/rocket-launch-truth.js'
      - 'lib/rocket-launch-slip.js'
      - 'scripts/rocket_launch_slip_lab.py'
      - 'tests/rocket-launch-slip.test.js'
      - 'lib/rocket-launch-national.js'
      - 'lib/space-coast-media.js'
      - 'lib/vandenberg-viewing.js'
      - 'scripts/vandenberg_viewing_oracle.py'
      - 'tests/vandenberg-viewing.test.js'
      - 'scripts/rocket_launch_visual_catalog.py'
      - 'tests/rocket-launch-visuals.test.js'
      - '.github/workflows/rocket-visual-nasa-catalog.yml'
      - 'api/rocket-launch-truth.js'
      - 'api/space-coast-ksc-watch.js'
      - 'api/rocket-launch-refresh.js'
      - 'tests/rocket-launch-refresh-cron.test.js'
      - '.github/workflows/space-coast-ksc-watch.yml'
      - '.github/workflows/rocket-launch-truth-tests.yml'
      - 'public/synced-national-tools/assets/launch-truth-desk.*'
      - 'public/synced-national-tools/rocket-launch-live/**'
      - 'public/vandenberg-rocket-launch-viewing/**'
      - 'tests/vandenberg-guide-seo.test.js'
      - 'tests/vandenberg-guide-map.test.js'
      - 'scripts/export-vandenberg-guide-map.js'
      - 'public/synced-national-tools/space-coast-launch/**'
      - 'tests/rocket-launch-truth.test.js'
      - 'tests/rocket-launch-national-v2.test.js'
      - 'api/rocket-launch-usa.js'
      - 'api/space-coast-launch.js'
      - 'vercel.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout source with no persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify full national mission coverage, collector budget and viewer safety
        run: node --test tests/rocket-launch-national-v2.test.js
      - name: Verify independent authenticated Vercel Cron source refresh
        run: node --test tests/rocket-launch-refresh-cron.test.js
      - name: Verify publisher source boundaries and launch truth state machine
        run: node --test tests/rocket-launch-truth.test.js
      - name: Verify existing Florida launch and KSC watch are preserved
        run: node --test tests/space-coast-launch-day.test.js tests/space-coast-ksc-watch.test.js
      - name: Verify independent Python launch-slip model and safety boundaries
        run: python3 scripts/rocket_launch_slip_lab.py --test
      - name: Verify JavaScript weather scenarios against Python model
        run: node --test tests/rocket-launch-slip.test.js
      - name: Confirm Python NASA imagery provenance and strict source matching
        run: python3 scripts/rocket_launch_visual_catalog.py --test
      - name: Verify NASA media catalog, image rights and official webcast fallbacks
        run: node --test tests/rocket-launch-visuals.test.js tests/space-coast-media.test.js
      - name: Independently verify Vandenberg geodesic, solar, legal-hour and DST models
        run: python3 scripts/vandenberg_viewing_oracle.py --test
      - name: Check all California site decisions against Python and browser release contracts
        run: node --test tests/vandenberg-viewing.test.js
      - name: Verify the server-rendered Vandenberg guide, search discovery and planner engagement
        run: node --test tests/vandenberg-guide-seo.test.js
      - name: Verify visitor and independent editorial source regressions
        run: node --test tests/rocket-launch-usa.test.js tests/space-coast-live.test.js tests/spaceflight-now-editorial.test.js
