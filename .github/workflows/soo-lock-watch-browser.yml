name: Soo Locks Lock Watch browser QA
on:
  pull_request:
    paths:
      - 'public/soo-locks/index.html'
      - 'public/assets/soo-ais.js'
      - 'public/assets/soo-lock-watch.*'
      - 'public/assets/soo-lock-sim.*'
      - 'tests/soo-lock-watch*'
      - 'tests/great-lakes-rolling-forecast-audit.test.js'
      - 'tests/soo-predictive-study.test.js'
      - 'tests/soo-independent-validation.test.js'
      - 'scripts/soo-independent-validation.cjs'
      - 'lib/soo-predictive-study.cjs'
      - 'tests/corridor-intelligence.test.js'
      - 'tests/great-lakes-historical-library.test.js'
      - 'data/freighter-history/**'
      - '.github/workflows/soo-lock-watch-browser.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1 @axe-core/playwright@4.10.2
      - name: Verify consolidated offline intelligence
        run: node --test tests/great-lakes-historical-library.test.js tests/corridor-intelligence.test.js tests/soo-predictive-study.test.js tests/great-lakes-rolling-forecast-audit.test.js tests/soo-independent-validation.test.js
      - run: node tests/soo-lock-watch-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soo-lock-watch-browser
          path: artifacts/soo-lock-watch/*.png
          if-no-files-found: ignore
          retention-days: 3
