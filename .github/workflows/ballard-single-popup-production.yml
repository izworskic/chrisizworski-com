name: Ship Ballard single popup

on:
  push:
    branches:
      - agent/ballard-single-popup-production
    paths:
      - '.github/workflows/ballard-single-popup-production.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ballard-single-popup-production
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pin Ballard release and strengthen smoke
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          release = 'ddfc9ad5a0e75977286922eacbb9e12fe14f1ff8'
          previous = '87c99c77cc0ed6a265ff9ae4fdffafa632ae6b50'

          p = Path('package.json')
          data = json.loads(p.read_text())
          data['dependencies']['national-ballard-locks'] = f'github:izworskic/national-ballard-locks#{release}'
          p.write_text(json.dumps(data, indent=2) + '\n')

          contract = Path('tests/ballard-locks-extracted.test.js')
          c = contract.read_text()
          if previous not in c:
              raise SystemExit('old Ballard test pin not found')
          contract.write_text(c.replace(previous, release))

          smoke = Path('scripts/ballard-production-smoke.mjs')
          s = smoke.read_text()
          anchor = "        && last.text.includes('/api/ballard-locks');"
          replacement = "        && last.text.includes('/api/ballard-locks')\n        && last.text.includes('activePopup=null')\n        && last.text.includes('if(activePopup&&activePopup!==popup)activePopup.remove()');"
          if anchor not in s:
              raise SystemExit('tour smoke anchor not found')
          smoke.write_text(s.replace(anchor, replacement, 1))
          PY
      - name: Install pinned Ballard package
        run: npm install --ignore-scripts
      - name: Sync Ballard mirror
        run: node scripts/sync-ballard-locks.mjs
      - name: Verify Ballard integration
        run: |
          node --test tests/ballard-locks-extracted.test.js
          npm test
      - name: Commit production integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json public/ballard-locks api/ballard-locks.js scripts/ballard-production-smoke.mjs tests/ballard-locks-extracted.test.js
          git commit -m 'Ship single-popup Ballard tour behavior'
          git push
