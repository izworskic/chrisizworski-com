name: Verify diagnostic once

on:
  push:
    branches:
      - agent/seo-mackinac-fall-cleanup-20260902

permissions:
  contents: write

jobs:
  diagnostic:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/seo-mackinac-fall-cleanup-20260902
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm run verify:all > verify-diagnostic.txt 2>&1 || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verify-diagnostic.txt
          git commit -m "Capture verify diagnostic" || exit 0
          git push origin HEAD:agent/seo-mackinac-fall-cleanup-20260902
