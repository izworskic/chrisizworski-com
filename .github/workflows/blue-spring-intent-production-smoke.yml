name: Blue Spring intent production smoke
on:
  push:
    paths:
      - 'public/national-tools/blue-spring-live/**'
      - 'api/blue-spring-live.js'
      - 'api/blue-spring-manatee.js'
      - 'public/sitemap-blue-spring.xml'
      - '.github/workflows/blue-spring-intent-production-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Verify Blue Spring live intent pages
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://chrisizworski.com'
          probe(){
            name="$1"; url="$2"
            for n in $(seq 1 24); do
              code=$(curl -L -sS --max-time 30 -o /tmp/out -w '%{http_code}' "$url" || true)
              if [ "$code" = '200' ]; then echo "$name OK"; return 0; fi
              echo "$name returned $code on attempt $n"; sleep 10
            done
            return 1
          }
          probe_expect(){
            name="$1"; url="$2"; expected="$3"
            for n in $(seq 1 24); do
              code=$(curl -L -sS --max-time 30 -o /tmp/out -w '%{http_code}' "$url" || true)
              if [ "$code" = '200' ] && grep -Fq "$expected" /tmp/out; then echo "$name OK"; return 0; fi
              echo "$name waiting for deployed content on attempt $n"; sleep 10
            done
            return 1
          }
          probe live-api "$BASE/api/blue-spring-live?smoke=$GITHUB_SHA"
          python -c "import json; d=json.load(open('/tmp/out')); assert 'retrievedAt' in d"
          probe manatee-api "$BASE/api/blue-spring-manatee?smoke=$GITHUB_SHA"
          python -c "import json; d=json.load(open('/tmp/out')); assert d.get('source') == 'Save the Manatee Club'; assert d.get('latestReport',{}).get('observedDate'); assert 'freshness' in d and 'retrievedAt' in d"
          probe_expect main "$BASE/national-tools/blue-spring-live/?smoke=$GITHUB_SHA" 'Blue Spring Manatees Today | Count & Conditions'
          grep -Fq 'loading="eager"' /tmp/out
          grep -Fq "Save the Manatee Club's dated morning roll call" /tmp/out
          for slug in manatee-conditions-today best-time-to-visit water-temperature; do
            probe "$slug" "$BASE/national-tools/blue-spring-live/$slug/?smoke=$GITHUB_SHA"
            grep -Fq "rel=\"canonical\" href=\"$BASE/national-tools/blue-spring-live/$slug/\"" /tmp/out
            grep -Fq 'FAQPage' /tmp/out
          done
          probe sitemap "$BASE/sitemap-blue-spring.xml?smoke=$GITHUB_SHA"
          test "$(grep -o '<url>' /tmp/out | wc -l | tr -d ' ')" = '4'
