name: Secure Vercel deployment verification

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/secure-vercel-verify.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish ephemeral encryption key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p migration
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out "$RUNNER_TEMP/vercel-verify-private.pem" >/dev/null 2>&1
          openssl pkey -in "$RUNNER_TEMP/vercel-verify-private.pem" -pubout -out migration/vercel-verify-token-public.pem >/dev/null 2>&1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add migration/vercel-verify-token-public.pem
          git commit -m "Publish ephemeral Vercel verification key" || true
          git push origin HEAD:main

      - name: Wait for encrypted token
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for i in $(seq 1 180); do
            git fetch origin main --quiet
            if git show origin/main:migration/vercel-verify-token.enc > "$RUNNER_TEMP/token.enc.b64" 2>/dev/null; then
              found=1
              break
            fi
            sleep 5
          done
          test "$found" = "1"
          base64 -d "$RUNNER_TEMP/token.enc.b64" > "$RUNNER_TEMP/token.enc"
          openssl pkeyutl -decrypt             -inkey "$RUNNER_TEMP/vercel-verify-private.pem"             -in "$RUNNER_TEMP/token.enc"             -pkeyopt rsa_padding_mode:oaep             -pkeyopt rsa_oaep_md:sha256             -out "$RUNNER_TEMP/vercel-token.txt"
          chmod 600 "$RUNNER_TEMP/vercel-token.txt"

      - name: Verify deployment readiness
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(cat "$RUNNER_TEMP/vercel-token.txt")"
          echo "::add-mask::$TOKEN"
          TEAM_ID="team_SibGYOKdlEddaSrq3xHqX8z0"
          OUT="$RUNNER_TEMP/vercel-verify-result.txt"
          : > "$OUT"

          api() {
            curl -sS --fail-with-body               -H "Authorization: Bearer $TOKEN"               -H "Content-Type: application/json"               "$@"
          }

          verify_one() {
            local name="$1" id="$2"
            local body state url aliases
            for i in $(seq 1 120); do
              body="$(api "https://api.vercel.com/v13/deployments/$id?teamId=$TEAM_ID&withGitRepoInfo=true")"
              state="$(jq -r '.readyState // .status // empty' <<<"$body")"
              url="$(jq -r '.url // empty' <<<"$body")"
              aliases="$(jq -r '[(.alias // [])[]?] | join(",")' <<<"$body")"
              case "$state" in
                READY)
                  echo "READY $name $id $url $aliases" | tee -a "$OUT"
                  return 0
                  ;;
                ERROR|CANCELED)
                  echo "$state $name $id $url" | tee -a "$OUT"
                  api "https://api.vercel.com/v3/deployments/$id/events?teamId=$TEAM_ID&direction=backward&limit=80"                     | jq -r '.[]? | select(.type=="stderr" or .type=="error" or .type=="fatal" or .type=="exit") | [.type,.text] | @tsv'                     | tail -30                     | sed "s/^/BUILDLOG $name /"                     | tee -a "$OUT" || true
                  return 1
                  ;;
              esac
              sleep 3
            done
            echo "TIMEOUT $name $id $state $url" | tee -a "$OUT"
            return 1
          }

          failures=0
          verify_one national-outdoor-core dpl_FbA1eQTaZhELDJtW5uuFtPxfUX9c || failures=$((failures+1))
          verify_one national-outdoor-tools-hub dpl_E1aNLD5Sv7VGYPjBJHFZd7t2MyWT || failures=$((failures+1))
          verify_one national-aurora dpl_7TDmFUJM84vrT6aUkuNUw7e2TtuK || failures=$((failures+1))
          verify_one national-rivers dpl_mrFK9PqQRBgdY6p3QCMpKeLydbmW || failures=$((failures+1))
          verify_one national-frost dpl_A9heAb85SCbquFmKYJ2ubSQVwed7 || failures=$((failures+1))
          verify_one national-planting dpl_8dHXbfQPJ7vLQXCAGDsaSHCEiCcv || failures=$((failures+1))
          verify_one national-fall-color dpl_4QiuD5F2KaBfH2sfn3pS3ThCcQic || failures=$((failures+1))
          verify_one national-coastal-water dpl_BP7hah6EnoWHqSAjrWGvXJmk6qSP || failures=$((failures+1))
          verify_one national-snowpack-melt dpl_HGKS9R1W3AMS4Fda54FbxD3ZWgja || failures=$((failures+1))
          verify_one national-white-christmas dpl_AXuzEvpCTZNtfyZPJpt6ZyKjyhaR || failures=$((failures+1))
          verify_one isle-royale-outdoors dpl_8kRr83Q1FajAWGT39sPo2HaGKpNX || failures=$((failures+1))
          echo "FAILURES $failures" | tee -a "$OUT"

      - name: Record result and remove handoff
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          git reset --hard origin/main
          mkdir -p migration
          if [ -f "$RUNNER_TEMP/vercel-verify-result.txt" ]; then
            cp "$RUNNER_TEMP/vercel-verify-result.txt" migration/vercel-verify-result.txt
          else
            echo "Verification did not reach result stage." > migration/vercel-verify-result.txt
          fi
          rm -f migration/vercel-verify-token-public.pem migration/vercel-verify-token.enc
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A migration
          git commit -m "Record Vercel deployment verification result" || true
          git push origin HEAD:main
