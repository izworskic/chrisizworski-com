name: Ice-out public discovery smoke

on:
  push:
    branches: [main]
    paths:
      - 'public/national-tools/ice-out/**'
      - 'public/sitemap-ice-out.xml'
      - 'public/robots.txt'
      - 'vercel.json'
      - 'scripts/generate-ice-out-location-pages.mjs'
      - 'benchmarks/ice-out-content-dates.json'
      - 'scripts/stamp-freshness.mjs'
      - 'scripts/benchmark-ice-out-discovery.mjs'
      - 'scripts/smoke-ice-out-discovery.mjs'
      - '.github/workflows/ice-out-discovery-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ice-out-public-discovery
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify all public lake pages and the advertised sitemap
        run: node scripts/smoke-ice-out-discovery.mjs --wait
