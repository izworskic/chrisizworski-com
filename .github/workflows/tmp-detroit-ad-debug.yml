name: Temporary Detroit ad diagnostic
on:
  push:
    branches:
      - fix/detroit-ad-seam-retry
permissions:
  contents: write
jobs:
  sync-freshness:
    if: github.event.head_commit.message != 'Sync Mackinac freshness metadata'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/detroit-ad-seam-retry
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sync derived freshness metadata
        shell: bash
        run: |
          node scripts/stamp-freshness.mjs
          git diff -- public/mackinac-island/index.html public/sitemap.xml
          git add public/mackinac-island/index.html public/sitemap.xml
          if git diff --cached --quiet; then
            echo 'No Mackinac freshness changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sync Mackinac freshness metadata'
          git push origin HEAD:fix/detroit-ad-seam-retry
