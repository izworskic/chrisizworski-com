name: Temporary Detroit ad diagnostic
on:
  push:
    branches:
      - fix/detroit-ad-seam-retry
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run ad tests and capture output
        shell: bash
        run: |
          set +e
          node --test tests/adsense-eligibility.test.js > adtest.log 2>&1
          code=$?
          cat adtest.log
          echo "$code" > adtest.exit
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: detroit-ad-debug
          path: |
            adtest.log
            adtest.exit
          retention-days: 1
