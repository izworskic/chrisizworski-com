name: Temporary Detroit ad diagnostic
on:
  push:
    branches:
      - fix/detroit-ad-seam-retry
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run full gate and capture output
        shell: bash
        run: |
          set +e
          npm run verify:all > verify-all.log 2>&1
          code=$?
          cat verify-all.log
          echo "$code" > verify-all.exit
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: detroit-ad-full-gate-debug
          path: |
            verify-all.log
            verify-all.exit
          retention-days: 1
