name: National tools production smoke

on:
  push:
    branches:
      - 'main'
      - 'agent/national-*'
    paths:
      - 'vercel.json'
      - 'scripts/smoke-national-composition.mjs'
      - 'api/national-*.js'
      - 'public/national-tools/**'
      - '.github/workflows/national-tools-production-smoke.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * *'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate live national routing and planting composition
        run: node scripts/smoke-national-composition.mjs
