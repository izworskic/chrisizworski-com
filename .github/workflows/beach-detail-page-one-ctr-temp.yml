name: Beach detail page-one CTR composer

on:
  push:
    branches:
      - feat/beach-detail-page-one-ctr-2026-08-22

permissions:
  contents: write

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/beach-detail-page-one-ctr-2026-08-22
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compose durable generator-owned treatment
        run: node scripts/compose-beach-detail-page-one-ctr.mjs
      - name: Verify focused treatment
        run: node scripts/benchmark-beach-detail-page-one-ctr.mjs --check
      - name: Commit production changes and self-clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Optimize page-one beach detail CTR"
          git push origin HEAD:feat/beach-detail-page-one-ctr-2026-08-22
