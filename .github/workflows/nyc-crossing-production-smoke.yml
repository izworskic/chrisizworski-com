name: NYC crossing production smoke

on:
  push:
    branches:
      - main
    paths:
      - 'api/nyc-crossing.js'
      - 'lib/nyc-crossing/**'
      - 'lib/tool-state.js'
      - 'public/nyc-crossing/**'
      - 'public/assets/nyc-crossing.js'
      - 'public/assets/nyc-crossing.css'
      - 'scripts/smoke-nyc-crossing-production.mjs'
      - '.github/workflows/nyc-crossing-production-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nyc-crossing-production-smoke
  cancel-in-progress: true

jobs:
  public-origin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for this commit's production deployment
        run: |
          for attempt in $(seq 1 80); do
            if EXPECTED_SHA="${GITHUB_SHA}" node --input-type=module -e '
              const response = await fetch("https://chrisizworski.com/api/nyc-crossing?deployment_smoke=" + process.env.EXPECTED_SHA, {
                method: "HEAD", redirect: "error", signal: AbortSignal.timeout(15000)
              });
              if (response.status !== 204 || response.headers.get("x-deployment-sha") !== process.env.EXPECTED_SHA) process.exit(1);
            '; then
              echo "The canonical NYC API is serving this commit."
              exit 0
            fi
            echo "Waiting for the exact production commit ($attempt/80)."
            sleep 15
          done
          echo "The canonical NYC API did not serve this commit within the release window."
          exit 1
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify public NYC crossing release
        run: node scripts/smoke-nyc-crossing-production.mjs
