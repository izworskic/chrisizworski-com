name: Four CTR candidates production audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify normal production URLs and record upstream states
        run: node scripts/audit-ctr-production.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ctr-production-audit
          path: artifacts/ctr-production-audit.json
          retention-days: 14
