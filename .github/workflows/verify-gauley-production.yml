name: Verify Gauley Production

on:
  push:
    branches: [main]
    paths:
      - 'vercel.json'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/*gauley*'
      - 'public/sitemap.xml'
      - '.github/workflows/verify-gauley-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public Gauley persona tool through custom domain
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://chrisizworski.com/national-tools/gauley-release-live/'
          ok=0
          for attempt in $(seq 1 30); do
            code=$(curl -L -sS --max-time 25 -o /tmp/page.html -w '%{http_code}' "$BASE" || true)
            if [ "$code" = '200' ] \
              && grep -q 'Private paddle' /tmp/page.html \
              && grep -q 'Raft guest' /tmp/page.html \
              && grep -q 'data-persona="watch"' /tmp/page.html \
              && grep -q 'data-persona="photo"' /tmp/page.html \
              && grep -q 'Since your last check' /tmp/page.html \
              && grep -q 'ENVIRONMENTAL CONTEXT INDEX' /tmp/page.html \
              && grep -q 'https://chrisizworski.com/national-tools/gauley-release-live/' /tmp/page.html; then
              ok=1
              break
            fi
            echo "Attempt $attempt: public Gauley page HTTP $code"
            sleep 5
          done
          test "$ok" = '1'

          curl -fsSL --max-time 30 "${BASE}api/live" -o /tmp/live.json
          curl -fsSL --max-time 30 "${BASE}api/history" -o /tmp/history.json
          python - <<'PY'
          import json
          live=json.load(open('/tmp/live.json'))
          hist=json.load(open('/tmp/history.json'))
          assert 'release' in live and 'river' in live and 'conditions' in live and 'sources' in live
          assert live.get('generatedAt')
          personas=live.get('personas') or {}
          for key in ('planning','paddler','raft','watch','photo'):
              assert key in personas, key
          assert personas['watch']['facts'][0]['value']=='Summersville Dam tailwaters'
          assert 'outfitter' in json.dumps(personas['raft']).lower()
          assert 'safe to paddle' not in json.dumps(personas).lower()
          assert hist.get('sampleCount',0)>0
          print('Public Gauley persona proxy OK:',live['release'].get('status'),hist.get('sampleCount'))
          PY

          curl -fsSL --max-time 20 'https://chrisizworski.com/sitemap.xml' -o /tmp/sitemap.xml
          grep -q '<loc>https://chrisizworski.com/national-tools/gauley-release-live/</loc>' /tmp/sitemap.xml
          echo 'Public Gauley sitemap discovery OK'
