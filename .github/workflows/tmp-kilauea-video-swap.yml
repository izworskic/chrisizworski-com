name: Temporary Kilauea video swap

on:
  push:
    branches:
      - 'agent/kilauea-video-feed-2026-09-28'

permissions:
  contents: write

jobs:
  swap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kilauea-video-feed-2026-09-28
      - name: Replace Kilauea live feed and self-remove
        run: |
          set -euo pipefail
          OLD='tk0tfYDxrUA'
          NEW='gXKuUyKt8mc'
          for f in api/kilauea-live.js public/labs/kilauea-live/index.html tests/kilauea-live.test.js; do
            grep -q "$OLD" "$f"
            sed -i "s/$OLD/$NEW/g" "$f"
          done
          grep -R "$NEW" -n api/kilauea-live.js public/labs/kilauea-live/index.html tests/kilauea-live.test.js
          ! grep -R "$OLD" -n api/kilauea-live.js public/labs/kilauea-live/index.html tests/kilauea-live.test.js
          rm .github/workflows/tmp-kilauea-video-swap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/kilauea-live.js public/labs/kilauea-live/index.html tests/kilauea-live.test.js .github/workflows/tmp-kilauea-video-swap.yml
          git commit -m 'Update Kilauea live video feed'
          git push origin HEAD:agent/kilauea-video-feed-2026-09-28
