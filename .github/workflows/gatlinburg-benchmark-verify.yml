name: Gatlinburg benchmark verification

on:
  push:
    branches:
      - agent/gatlinburg-benchmark-ux
  workflow_dispatch:

jobs:
  gatlinburg-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check public/assets/gatlinburg-winter.js
          node --check tests/gatlinburg-winter-benchmark.test.js
      - name: Gatlinburg regression and benchmark suite
        run: node --test tests/gatlinburg-winter.test.js tests/gatlinburg-winter-v2.test.js tests/gatlinburg-winter-v3.test.js tests/gatlinburg-winter-v4.test.js tests/gatlinburg-winter-v5.test.js tests/gatlinburg-winter-v6.test.js tests/gatlinburg-winter-benchmark.test.js
