name: Temporary freshness stamp repair

on:
  push:
    branches:
      - agent/national-ice-out-smoke

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/national-ice-out-smoke
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Stamp repository freshness from commit history
        run: node scripts/stamp-freshness.mjs
      - name: Commit generated freshness corrections
        run: |
          rm .github/workflows/temporary-freshness-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Repair stale sitemap freshness stamps'
          git push origin HEAD:agent/national-ice-out-smoke
