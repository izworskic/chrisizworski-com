name: One-time public-only retrospective model-reference probe
on:
  pull_request:
    types: [opened]
    paths:
      - ".github/workflows/noaa-public-only-reference-probe-20261124.yml"
permissions:
  contents: read
jobs:
  probe:
    if: github.head_ref == 'research/noaa-public-only-reference-probe-20261124' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run geographic and proxy tests
        run: node --test tests/great-lakes-crossing-detection.test.js tests/great-lakes-crossing-references.test.js tests/great-lakes-reference-retrospect.test.js tests/great-lakes-passage-replay.test.js
      - name: Install pinned temporary research reader
        run: |
          python -m pip install --disable-pip-version-check --no-deps --only-binary=:all: pyarrow==21.0.0
      - name: Run development-only observation-time proxy
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          private_dir="$(mktemp -d)"
          trap 'rm -rf "$private_dir"' EXIT
          export PRIVATE_INPUT="$private_dir/observations.json"
          export NOAA_REPORT="$private_dir/coverage.json"
          python scripts/noaa-public-only-reference-probe-20261124.py --self-test
          python scripts/noaa-public-only-reference-probe-20261124.py 2024-09-04
          node scripts/retrospect-great-lakes-reference.cjs "$PRIVATE_INPUT" "${RUNNER_TEMP}/proxy-aggregate.json"
          cat "${RUNNER_TEMP}/proxy-aggregate.json"
      - uses: actions/upload-artifact@v4
        with:
          name: public-only-proxy-aggregate
          path: ${{ runner.temp }}/proxy-aggregate.json
          if-no-files-found: error
          retention-days: 7
