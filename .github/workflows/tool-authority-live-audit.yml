name: Tool authority public HTML audit

on:
  workflow_call:
    inputs:
      build-artifact:
        description: Verified public output from this workflow run and checkout SHA
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Automatic audits consume only the successful build from this same run.
      # Manual audits deliberately build their selected revision once.
      - name: Download verified public output
        if: inputs.build-artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.build-artifact }}
      - name: Restore verified public output
        if: inputs.build-artifact != ''
        run: |
          rm -rf public
          tar -xzf verified-site-output.tar.gz
      - name: Install pinned dependencies for a manual build
        if: inputs.build-artifact == ''
        run: npm ci
      - name: Build production output for a manual audit
        if: inputs.build-artifact == ''
        run: npm run build:site
      - name: Audit actual public HTML for every published tool canonical
        if: always()
        run: node scripts/audit-tool-authority.mjs --live > tool-authority-live.json
      - name: Upload public audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tool-authority-public-html
          path: tool-authority-live.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Wait for the main deployment to propagate
        if: github.ref == 'refs/heads/main'
        run: node -e "setTimeout(() => process.exit(0), 180000)"
      - name: Verify changed public outputs after promotion
        if: github.ref == 'refs/heads/main'
        run: node scripts/audit-tool-authority.mjs --live-release --check > tool-authority-release.json
      - name: Upload changed-route release report
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: tool-authority-release-html
          path: tool-authority-release.json
          if-no-files-found: ignore
          retention-days: 7
