name: U.P. waterfall browser smoke
on:
  push:
    branches:
      - waterfalls-1258-inventory-ledger-batch-01
    paths:
      - 'data/up-waterfalls.json'
      - 'data/up-waterfall-*.json'
      - 'public/upper-peninsula-waterfalls/**'
      - 'public/assets/up-waterfalls*'
      - 'public/assets/up-waterfall-*'
      - 'public/sitemap-up-waterfalls.xml'
      - 'tests/up-waterfall*.test.js'
      - 'tests/up-waterfalls-browser-smoke.mjs'
      - '.github/workflows/up-waterfalls-browser-smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - 'data/up-waterfalls.json'
      - 'data/up-waterfall-*.json'
      - 'public/upper-peninsula-waterfalls/**'
      - 'public/assets/up-waterfalls*'
      - 'public/assets/up-waterfall-*'
      - 'public/sitemap-up-waterfalls.xml'
      - 'tests/up-waterfall*.test.js'
      - 'tests/up-waterfalls-browser-smoke.mjs'
      - '.github/workflows/up-waterfalls-browser-smoke.yml'
  workflow_dispatch:
concurrency:
  group: up-waterfalls-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  mobile-and-map:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate GIS crosswalk, access source gates and visitor schemas
        run: |
          node --test tests/up-waterfalls-issue1258-*.test.js tests/up-waterfall-reconciliation.test.js tests/up-waterfalls.test.js
      - name: Install Playwright driver and select a browser
        run: |
          npm install --prefix /tmp/up-waterfalls-playwright --no-save --package-lock=false playwright@1.56.1
          if command -v google-chrome >/dev/null 2>&1; then
            echo "UP_WATERFALL_CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null 2>&1; then
            echo "UP_WATERFALL_CHROME=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            /tmp/up-waterfalls-playwright/node_modules/.bin/playwright install --with-deps chromium
          fi
      - name: Serve the built-in HTML-first waterfall experience
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory public >/tmp/up-waterfalls-smoke-http.log 2>&1 &
          echo $! > /tmp/up-waterfalls-smoke-http.pid
      - name: Mobile, map, filters, access and sitemap smoke
        run: node tests/up-waterfalls-browser-smoke.mjs
      - name: Preserve full-page screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: up-waterfalls-mobile-map-screenshots
          path: /tmp/up-waterfalls-smoke-screens/*.png
          if-no-files-found: ignore
          retention-days: 7
