name: Fall color writer end-to-end test

on:
  workflow_call:
    inputs:
      seed_daily:
        description: "Run the one-time October 10 daily writers using GitHub OIDC"
        type: boolean
        required: false
        default: false
      publish_github:
        description: "Write dated fall-color editions to the independent GitHub data branch"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: fall-color-writer-end-to-end
  cancel-in-progress: false

jobs:
  write-and-read-report:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Wait for production, run the writer, and read back its report
        if: ${{ !inputs.seed_daily && !inputs.publish_github }}
        shell: bash
        env:
          OIDC_AUDIENCE: "https://chrisizworski.com/api/fall-color-writer-test"
          WRITER_URL: "https://chrisizworski.com/api/fall-color?view=cron&test=1"
          REPORT_URL: "https://chrisizworski.com/api/fall-color-report"
        run: |
          set -euo pipefail
          response_file="$RUNNER_TEMP/fall-color-writer-response.json"
          report_file="$RUNNER_TEMP/fall-color-report.json"

          for attempt in $(seq 1 24); do
            token_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}"
            oidc_token="$(curl --fail --silent --show-error \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "$token_url" | jq --exit-status --raw-output '.value')"

            status="$(curl --silent --show-error --max-time 70 \
              --output "$response_file" --write-out '%{http_code}' \
              -H "Authorization: Bearer ${oidc_token}" \
              "$WRITER_URL")"
            unset oidc_token

            if [[ "$status" == "200" ]]; then
              jq --exit-status '((.ok == true and (.chars > 0)) or .skipped == "already-generated") and (.date | type == "string")' "$response_file"
              writer_date="$(jq --exit-status --raw-output '.date' "$response_file")"

              curl --fail --silent --show-error --max-time 30 \
                --output "$report_file" "${REPORT_URL}?verification=${GITHUB_SHA}"
              jq --exit-status --arg date "$writer_date" \
                '.date == $date and (.updated | type == "string") and (.body | type == "string") and (.body | length > 0)' \
                "$report_file"

              chars="$(jq --raw-output '.chars // 0' "$response_file")"
              {
                echo "### Fall color writer verified"
                echo ""
                echo "Production generated or reused the ${writer_date} cached model report (${chars} newly written characters)."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            if [[ "$status" != "401" && "$status" != "404" ]]; then
              echo "Writer failed with HTTP ${status}." >&2
              jq . "$response_file" >&2 2>/dev/null || true
              exit 1
            fi

            echo "Production has not reached this commit yet (HTTP ${status}); attempt ${attempt}/24."
            sleep 15
          done

          echo "Production did not accept this workflow identity before the retry window closed." >&2
          jq . "$response_file" >&2 2>/dev/null || true
          exit 1

      - name: One-time authenticated October 10 seed (Michigan + 15 national regions)
        if: ${{ inputs.seed_daily }}
        shell: bash
        env:
          OIDC_AUDIENCE: "https://chrisizworski.com/api/fall-color-writer-test"
          MI_URL: "https://chrisizworski.com/api/fall-color?view=cron&seed=2026-10-10"
          NATIONAL_URL: "https://chrisizworski.com/api/fall-color?view=national-briefings-cron&seed=2026-10-10"
          REPORT_URL: "https://chrisizworski.com/api/fall-color-report"
          NATIONAL_READ_URL: "https://chrisizworski.com/api/fall-color?view=national-briefings&region=new-england"
          NATIONAL_SOURCE_URL: "https://chrisizworski.com/api/national-fall-region?region=new-england"
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/fall-color-seed-response.json"
          doc="$RUNNER_TEMP/fall-color-seed-read.json"

          # Preflight before spending any tokens: make sure the national source is reachable.
          curl --fail --silent --show-error --max-time 20 "$NATIONAL_SOURCE_URL" \
            | jq --exit-status -e '.region.id == "new-england" and (.today | type == "object")' > /dev/null

          for attempt in $(seq 1 32); do
            token_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}"
            oidc_token="$(curl --fail --silent --show-error \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "$token_url" | jq --exit-status --raw-output '.value')"

            status="$(curl --silent --show-error --max-time 70 \
              --output "$body" --write-out '%{http_code}' \
              -H "Authorization: Bearer ${oidc_token}" "$MI_URL")"
            unset oidc_token

            if [[ "$status" == "200" ]]; then
              jq --exit-status -e '(.date == "2026-10-10") and (.ok == true or .skipped == "already-generated" or .skipped == "daily-attempt-already-claimed")' "$body"
              break
            elif [[ "$status" == "401" || "$status" == "404" ]]; then
              echo "Production commit not active yet (HTTP $status, attempt $attempt/32)."
              sleep 15
            else
              echo "Michigan cron failed (HTTP $status)." >&2
              jq . "$body" >&2 2>/dev/null || true
              exit 1
            fi
            if [[ "$attempt" == "32" ]]; then echo "Michigan did not authorize after retries." >&2; exit 1; fi
          done

          # Authenticate separately: each job token is short-lived and the SHA
          # must match the production deployment. The region batch is one model call.
          token_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}"
          oidc_token="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "$token_url" | jq --exit-status --raw-output '.value')"
          status="$(curl --silent --show-error --max-time 70 \
            --output "$body" --write-out '%{http_code}' \
            -H "Authorization: Bearer ${oidc_token}" "$NATIONAL_URL")"
          unset oidc_token
          if [[ "$status" != "200" ]]; then
            echo "National writer failed: HTTP $status." >&2
            jq . "$body" >&2 2>/dev/null || true
            exit 1
          fi
          jq --exit-status -e '(.date == "2026-10-10") and ((.ok == true and .regions >= 1) or .skipped == "already-published" or .skipped == "daily-attempt-already-claimed")' "$body"

          curl --fail --silent --show-error --max-time 25 \
            "${REPORT_URL}?seed_verify=${GITHUB_SHA}" -o "$doc"
          jq --exit-status -e '.date == "2026-10-10" and (.body | type=="string" and length > 0)' "$doc"

          curl --fail --silent --show-error --max-time 25 \
            "${NATIONAL_READ_URL}&seed_verify=${GITHUB_SHA}" -o "$doc"
          jq --exit-status -e '.date == "2026-10-10" and (.briefing | type=="string" and length > 30)' "$doc"

          {
            echo "### Daily fall-color seed verified"
            echo ""
            echo "Michigan report and national New England briefing are both available for October 10, 2026."
            echo ""
            echo "All Anthropic writes still require the existing daily Redis NX locks."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout separate data branch
        if: ${{ inputs.publish_github }}
        uses: actions/checkout@v4
        with:
          ref: fall-color-data
          path: archive
          persist-credentials: true

      - name: Archive daily Michigan and national fall-color editions
        if: ${{ inputs.publish_github }}
        shell: bash
        env:
          OIDC_AUDIENCE: "https://chrisizworski.com/api/fall-color-writer-test"
          WRITER_URL: "https://chrisizworski.com/api/fall-color?view=github-publish"
        run: |
          set -euo pipefail
          today="$(TZ=America/Detroit date +%F)"
          root="archive/data/fall-color"

          # This is a read-only preflight: wait for the exact GitHub commit to be
          # live on Vercel BEFORE recording the daily paid-attempt sentinel.
          for attempt in $(seq 1 78); do
            oidc_token="$(curl --fail --silent --show-error \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}" | jq -er '.value')"
            status="$(curl --silent --show-error --max-time 15 \
              -o "$RUNNER_TEMP/fall-check.json" -w '%{http_code}' \
              -H "Authorization: Bearer ${oidc_token}" \
              "${WRITER_URL}&kind=mi&check=1")"
            unset oidc_token
            if [[ "$status" == "200" ]]; then
              jq -e --arg date "$today" '.ok == true and .authenticated == true and .date == $date' "$RUNNER_TEMP/fall-check.json"
              echo "Identity and production SHA verified."
              break
            fi
            if [[ "$status" != "401" && "$status" != "404" ]]; then
              echo "::error::Production writer unavailable: HTTP $status"
              exit 1
            fi
            if [[ "$attempt" == "78" ]]; then
              echo "::error::No matching production commit after preflight retries."
              exit 1
            fi
            sleep 10
          done

          cd archive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for kind in mi national; do
            if [[ -f "data/fall-color/${kind}/${today}.json" ]]; then
              echo "Edition $kind $today already exists; no paid model call."
              continue
            fi
            sentinel="data/fall-color/attempts/${kind}-${today}.json"
            if [[ -f "$sentinel" ]]; then
              echo "Daily $kind paid attempt already reserved; refusing any second spend."
              continue
            fi
            mkdir -p data/fall-color/attempts "data/fall-color/$kind"
            # This commit makes paid generation at most once per model/day,
            # even across workflow retries, server failures or redeploys.
            printf '{"date":"%s","kind":"%s","attempted":true}\n' "$today" "$kind" > "$sentinel"
            git add "$sentinel"
            git commit -m "Reserve one daily $kind model attempt for $today"
            git push origin HEAD:fall-color-data

            oidc_token="$(curl --fail --silent --show-error \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}" | jq -er '.value')"
            response="$RUNNER_TEMP/fall-${kind}-edition.json"
            code="$(curl --silent --show-error --max-time 65 \
              -o "$response" -w '%{http_code}' \
              -H "Authorization: Bearer ${oidc_token}" \
              "${WRITER_URL}&kind=${kind}")"
            unset oidc_token
            if [[ "$code" != "200" ]]; then
              echo "::error::Fall $kind generation failed (HTTP $code); daily attempt stays reserved."
              jq '{error,date}' "$response" 2>/dev/null || true
              exit 1
            fi
            jq --exit-status -e --arg date "$today" --arg kind "$kind" \
              '.ok == true and .kind == $kind and .date == $date and .edition.date == $date' \
              "$response" > /dev/null
            jq --exit-status '.edition' "$response" > "data/fall-color/$kind/$today.json"
            cp "data/fall-color/$kind/$today.json" "data/fall-color/$kind/latest.json"
            if [[ "$kind" == "mi" ]]; then
              jq --arg date "$today" \
                '.dates = ((.dates // []) + [$date] | unique | sort | reverse)' \
                data/fall-color/mi/index.json > "$RUNNER_TEMP/fall-index.json"
              cp "$RUNNER_TEMP/fall-index.json" data/fall-color/mi/index.json
            fi
            git add data/fall-color
            git commit -m "Publish $kind foliage edition for $today"
            git push origin HEAD:fall-color-data
            echo "Verified dated $kind edition archived for $today."
          done

          # Read-back from GitHub's public JSON origin, no Redis commands.
          for kind in mi national; do
            if [[ ! -f "data/fall-color/$kind/$today.json" ]]; then
              echo "::error::Missing $kind daily edition: see reserved sentinel"
              exit 1
            fi
            jq --exit-status -e --arg date "$today" '.date == $date' "data/fall-color/$kind/$today.json"
          done
