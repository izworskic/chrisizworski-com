name: Garden pest photo evidence
on:
  push:
    paths:
      - 'data/garden-pest-visual-catalog.json'
      - 'data/garden-earworm-msu-2026.csv'
      - 'public/assets/garden-earworm-trap*'
      - 'public/assets/garden-earworm-2027.js'
      - 'scripts/build_garden_earworm_traps.py'
      - 'scripts/ingest_msu_earworm_2027.py'
      - 'tests/test_msu_earworm_2027_ingest.py'
      - 'scripts/verify-garden-earworm-2027.cjs'
      - 'scripts/verify-garden-earworm-2027-browser.cjs'
      - '.github/workflows/msu-earworm-2027-source-review.yml'
      - 'scripts/verify-garden-earworm-traps.cjs'
      - 'public/assets/garden-pest-visual*'
      - 'public/assets/garden-pest-watch.*'
      - 'public/assets/garden-pest-field-observations.js'
      - 'lib/garden-pest-field-observations.cjs'
      - 'api/garden-pest-field-observations.js'
      - 'tests/garden-pest-field-observations.test.js'
      - 'public/michigan-garden-pest-watch/index.html'
      - 'scripts/build_garden_pest_visuals.py'
      - 'scripts/verify-garden-pest-visuals.cjs'
      - '.github/workflows/garden-pest-visuals.yml'
  pull_request:
    paths:
      - 'data/garden-pest-visual-catalog.json'
      - 'data/garden-earworm-msu-2026.csv'
      - 'public/assets/garden-earworm-trap*'
      - 'public/assets/garden-earworm-2027.js'
      - 'scripts/build_garden_earworm_traps.py'
      - 'scripts/ingest_msu_earworm_2027.py'
      - 'tests/test_msu_earworm_2027_ingest.py'
      - 'scripts/verify-garden-earworm-2027.cjs'
      - 'scripts/verify-garden-earworm-2027-browser.cjs'
      - '.github/workflows/msu-earworm-2027-source-review.yml'
      - 'scripts/verify-garden-earworm-traps.cjs'
      - 'public/assets/garden-pest-visual*'
      - 'public/assets/garden-pest-watch.*'
      - 'public/assets/garden-pest-field-observations.js'
      - 'lib/garden-pest-field-observations.cjs'
      - 'api/garden-pest-field-observations.js'
      - 'tests/garden-pest-field-observations.test.js'
      - 'public/michigan-garden-pest-watch/index.html'
      - 'scripts/build_garden_pest_visuals.py'
      - 'scripts/verify-garden-pest-visuals.cjs'
      - '.github/workflows/garden-pest-visuals.yml'
jobs:
  evidence-and-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate curated photos and Python matching rules
        run: python3 scripts/build_garden_pest_visuals.py --check
      - name: Verify audited MSU corn earworm trap archive
        run: |
          python3 scripts/build_garden_earworm_traps.py --check
          python3 -m unittest discover -s tests -p test_msu_earworm_2027_ingest.py -v
          python3 scripts/ingest_msu_earworm_2027.py --mode check-window
      - name: Verify JavaScript syntax and page integration
        run: |
          node --check public/assets/garden-pest-visual-data.js
          node --check public/assets/garden-pest-visuals.js
          node --check public/assets/garden-pest-watch.js
          node --check public/assets/garden-earworm-trap-data.js
          node --check public/assets/garden-earworm-trap-desk.js
          node --check public/assets/garden-earworm-trap-2027-data.js
          node --check public/assets/garden-earworm-2027.js
          node --check scripts/verify-garden-earworm-2027-browser.cjs
          node scripts/verify-garden-earworm-2027.cjs
          node scripts/verify-garden-earworm-traps.cjs
          node --check public/assets/garden-pest-field-observations.js
          node --check lib/garden-pest-field-observations.cjs
          node --check api/garden-pest-field-observations.js
          node scripts/verify-garden-pest-visuals.cjs
          node --test tests/garden-pest-field-observations.test.js
