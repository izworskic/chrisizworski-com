name: Temporary Ontario SERP metadata fix

on:
  push:
    branches:
      - agent/national-ice-out-smoke

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/national-ice-out-smoke
      - name: Correct over-limit metadata without changing the app
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/ontario-fishing-lake-finder/index.html')
          s=p.read_text()
          old_title='<title>Ontario Fishing Lake Finder | Lakes, Fish, Access & Conditions</title>'
          new_title='<title>Ontario Fishing Lake Finder | Fish, Access & Conditions</title>'
          old_desc='<meta name="description" content="Explore Ontario lakes from the provincial waterbody registry, then refine by fish species, fisheries zone, depth and water type and check access, roads, fire and weather context.">'
          new_desc='<meta name="description" content="Explore Ontario lakes by fish species, fisheries zone, depth and water type, then check access, roads, fire and weather context.">'
          if old_title not in s or old_desc not in s:
              raise SystemExit('Expected Ontario metadata not found; refusing broad edit')
          s=s.replace(old_title,new_title,1).replace(old_desc,new_desc,1)
          p.write_text(s)
          PY
          rm .github/workflows/temporary-ontario-serp-fix.yml
      - name: Commit exact metadata-only correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/ontario-fishing-lake-finder/index.html .github/workflows/temporary-ontario-serp-fix.yml
          git diff --cached --check
          git commit -m 'Fit Ontario lake finder metadata within SERP gate'
          git push origin HEAD:agent/national-ice-out-smoke
