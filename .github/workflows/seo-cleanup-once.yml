name: SEO cleanup once

on:
  push:
    branches:
      - agent/seo-mackinac-fall-cleanup-20260902

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/seo-mackinac-fall-cleanup-20260902
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/close-search-experiments-once.js
      - name: Commit generated cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Close stale search experiments and ship CTR learnings"
          git push origin HEAD:agent/seo-mackinac-fall-cleanup-20260902
