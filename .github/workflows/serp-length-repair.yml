name: One-shot SERP length repair

on:
  push:
    branches:
      - fix/repository-gate-baseline-2026-09-24

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/repository-gate-baseline-2026-09-24
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Shorten overlength SERP snippets
        shell: python
        run: |
          from pathlib import Path

          replacements = {
            'public/detroit-birding-today/index.html': [
              ('Find the strongest Detroit-area birding window today using weather, hazards and seasonal migration context, then check live Michigan bird sightings before you go.',
               'Find Detroit’s best birding window today using weather and migration context, then check live Michigan sightings before you go.'),
            ],
            'public/detroit-outdoors/index.html': [
              ('See what’s worth doing outdoors around Detroit today: bird migration, Detroit River freighters, Lake St. Clair water, sunset, fall color and unusually good park windows.',
               'See what’s worth doing outdoors around Detroit today: birding, freighters, Lake St. Clair, sunset, fall color and unusually good park windows.'),
            ],
            'public/detroit-river-freighters/index.html': [
              ('See whether a fresh moving commercial-vessel AIS report creates a Detroit River freighter-watching window now, then verify the live Great Lakes ship map before leaving.',
               'See whether fresh commercial-vessel AIS reports create a Detroit River freighter-watching window now, then verify the live ship map before leaving.'),
            ],
            'public/gatlinburg-winter/index.html': [
              ('Gatlinburg Winter Planner 2026-27 | Live Itinerary, Weather & Winter Magic',
               'Gatlinburg Winter Planner 2026-27 | Weather & Winter Magic'),
              ('Plan a Gatlinburg winter visit around your exact date, available time, live weather when verifiable, Winter Magic, park conditions, parking, trolley hours and attraction status.',
               'Plan Gatlinburg winter around your date, available time, live weather, Winter Magic, park conditions, parking, trolleys and attraction status.'),
            ],
            'public/synced-national-tools/trail-ridge-road/index.html': [
              ('Trail Ridge Road Status Today | RMNP Drive Planner + Alpine Weather',
               'Trail Ridge Road Status Today | RMNP Drive Planner'),
              ("Check Trail Ridge Road's current RMNP status, then plan the 48-mile cross-park drive with alpine weather, timed-entry context, stops, elevation guidance and practical trip decisions.",
               'Check Trail Ridge Road’s current RMNP status, then plan the cross-park drive with alpine weather, timed-entry context, stops and elevation guidance.'),
            ],
            'public/tools/index.html': [
              ('Free Michigan and Great Lakes live tools for Soo Locks ships, Mackinac Bridge, beaches, aurora, rivers, ice, border waits, fishing, gardening and trip planning.',
               'Live Michigan and Great Lakes tools for weather, outdoors, travel, water, ships, fall color, winter conditions and trip decisions by Chris Izworski.'),
            ],
          }

          for filename, pairs in replacements.items():
            path = Path(filename)
            text = path.read_text()
            for old, new in pairs:
              if old not in text:
                raise SystemExit(f'expected snippet missing in {filename}: {old}')
              text = text.replace(old, new, 1)
            path.write_text(text)

          verifier = Path('scripts/verify-source.mjs')
          text = verifier.read_text()
          before, sep, after = text.partition('// These files were already committed')
          if not sep:
            raise SystemExit('verify-source committed drift marker missing')
          routes = [
            '/detroit-birding-today/',
            '/detroit-outdoors/',
            '/detroit-river-freighters/',
            '/gatlinburg-winter/',
            '/synced-national-tools/trail-ridge-road/',
            '/tools/',
          ]
          marker = 'const intentionalChanges = new Set([\n'
          additions = []
          for route in routes:
            if f'  "{route}",' not in before:
              additions.append(f'  "{route}",\n')
          if additions:
            note = (
              '  // Sep 24 2026: bring live SERP titles/descriptions back inside repository length limits.\n'
              '  // These are intentional snippet-quality edits; re-crawl after production release.\n'
              + ''.join(additions)
            )
            before = before.replace(marker, marker + note, 1)
            verifier.write_text(before + sep + after)
      - name: Validate snippet and source contracts
        run: |
          npm run benchmark:serp-length
          npm run verify
      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/serp-length-repair.yml
          git add public/detroit-birding-today/index.html public/detroit-outdoors/index.html public/detroit-river-freighters/index.html public/gatlinburg-winter/index.html public/synced-national-tools/trail-ridge-road/index.html public/tools/index.html scripts/verify-source.mjs
          git commit -m "Bring overlength SERP snippets back inside limits"
          git push origin HEAD:fix/repository-gate-baseline-2026-09-24
