name: One-shot repository metadata repair

on:
  push:
    branches:
      - fix/repository-gate-baseline-2026-09-24

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'izworskic/chrisizworski-com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/repository-gate-baseline-2026-09-24
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch exact verifier and sitemap drift
        shell: python
        run: |
          from pathlib import Path
          import re

          verifier = Path('scripts/verify-source.mjs')
          text = verifier.read_text()
          route = '  "/fall-color/mackinac-island-fall-color/",\n'
          if route not in text.split('// These files were already committed', 1)[0]:
              marker = 'const intentionalChanges = new Set([\n'
              addition = (
                  '  // Sep 23 2026: Mackinac discovery resync added the existing live planner handoff.\n'
                  '  // Re-crawl after production release, then remove this declaration.\n'
                  + route
              )
              if marker not in text:
                  raise SystemExit('intentionalChanges marker missing')
              text = text.replace(marker, marker + addition, 1)
              verifier.write_text(text)

          sitemap = Path('public/sitemap.xml')
          xml = sitemap.read_text()
          wanted = {
              'https://chrisizworski.com/detroit-outdoors/': '2026-09-24',
              'https://chrisizworski.com/detroit-river-freighters/': '2026-09-24',
              'https://chrisizworski.com/detroit-birding-today/': '2026-09-22',
              'https://chrisizworski.com/lake-st-clair-outdoors/': '2026-09-22',
              'https://chrisizworski.com/detroit-sunset-tonight/': '2026-09-22',
          }
          for url, date in wanted.items():
              pattern = rf'(<loc>{re.escape(url)}</loc>\s*<lastmod>)([^<]+)(</lastmod>)'
              xml, count = re.subn(pattern, rf'\g<1>{date}\g<3>', xml, count=1)
              if count != 1:
                  raise SystemExit(f'expected one sitemap entry for {url}, found {count}')
          sitemap.write_text(xml)
      - name: Validate targeted repairs
        run: npm run verify
      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/baseline-metadata-repair.yml
          git add scripts/verify-source.mjs public/sitemap.xml
          git commit -m "Repair source-audit and sitemap metadata drift"
          git push origin HEAD:fix/repository-gate-baseline-2026-09-24
