name: Materialize Mackinac pages

on:
  push:
    branches:
      - fix/mackinac-materialized-pages

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate Mackinac static pages
        run: |
          node scripts/generate-mackinac-hub-pages.mjs
          node scripts/generate-mackinac-intent-pages.mjs
          node scripts/add-mackinac-island-discovery.mjs
      - name: Commit generated routes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/mackinac-island public/sitemap.xml
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Materialize Mackinac static routes"
          git push
