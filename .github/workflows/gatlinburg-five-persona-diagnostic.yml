name: Gatlinburg persona diagnostic
on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/gatlinburg-winter/**'
      - 'public/gatlinburg-winter/**'
      - 'public/assets/gatlinburg-winter*'
      - 'tests/gatlinburg-winter*'
      - '.github/workflows/gatlinburg-five-persona-diagnostic.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture full verify output
        shell: bash
        run: |
          set +e
          npm run verify:all > gatlinburg-five-persona-verify.log 2>&1
          code=$?
          echo "exit_code=$code" >> gatlinburg-five-persona-verify.log
          exit 0
      - name: Upload verify log
        uses: actions/upload-artifact@v4
        with:
          name: gatlinburg-five-persona-verify
          path: gatlinburg-five-persona-verify.log
          if-no-files-found: error
