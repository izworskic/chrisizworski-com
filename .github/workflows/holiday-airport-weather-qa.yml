name: Holiday airport weather board QA
on:
  pull_request:
    paths:
      - 'api/holiday-airport-weather.js'
      - 'lib/holiday-travel/**'
      - 'public/assets/holiday-airport-weather-board.js'
      - 'public/assets/holiday-airport-search.js'
      - 'public/assets/holiday-travel-engine.js'
      - 'public/holiday-travel/index.html'
      - 'scripts/holiday-travel/**'
      - 'tests/holiday-airport-weather.test.js'
      - 'tests/holiday-airport-search.test.js'
      - '.github/workflows/holiday-airport-weather-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-gate-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned repository dependencies
        run: npm ci
      - name: Check BTS airport data independently with Python and Rust
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/holiday-travel/verify_airport_catalog.py
          rustc --edition=2021 -O scripts/holiday-travel/verify_airport_catalog.rs -o "$RUNNER_TEMP/holiday-airport-rust-check"
          python3 scripts/holiday-travel/verify_airport_catalog.py --tsv | "$RUNNER_TEMP/holiday-airport-rust-check"
      - name: Inventory remaining dropdown-heavy pages (nonblocking triage)
        run: python3 scripts/audit-selection-surfaces.py --top 12
      - name: Run complete repository gate
        run: npm run verify:all
      - name: Install browser-only Playwright
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/holiday-airport-browser" --no-save --ignore-scripts --package-lock=false playwright@1.58.2
          echo "NODE_PATH=$RUNNER_TEMP/holiday-airport-browser/node_modules" >> "$GITHUB_ENV"
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null 2>&1; then
            echo "CHROME_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            "$RUNNER_TEMP/holiday-airport-browser/node_modules/.bin/playwright" install --with-deps chromium
            node -e "console.log('CHROME_PATH='+require(process.env.RUNNER_TEMP+'/holiday-airport-browser/node_modules/playwright').chromium.executablePath())" >> "$GITHUB_ENV"
          fi
      - name: Run 360px and 1440px NWS-outage browser acceptance
        run: node scripts/holiday-travel/verify-airport-weather-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: holiday-airport-weather-browser
          path: artifacts/holiday-airport-weather/
          retention-days: 7
          if-no-files-found: warn
