name: Vandenberg Rust WebAssembly contract
on:
  pull_request:
    paths:
      - 'rust/vandenberg-viewing/**'
      - 'public/vandenberg-rocket-launch-viewing/**'
      - 'scripts/verify-vandenberg-rust-wasm.cjs'
      - 'tests/vandenberg-rust-wasm.test.js'
      - '.github/workflows/vandenberg-rust-wasm.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain and browser target
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain 1.90.0
      - name: Run native Rust unit tests
        run: |
          rustc +1.90.0 --edition=2021 --test rust/vandenberg-viewing/src/lib.rs -o /tmp/vg-rust-tests
          /tmp/vg-rust-tests
      - name: Compile the actual Rust decision engine to WebAssembly
        run: |
          rustc +1.90.0 --edition=2021 \
            --crate-type cdylib \
            --target wasm32-unknown-unknown \
            -C opt-level=z -C codegen-units=1 -C lto=fat \
            -C panic=abort -C strip=symbols \
            -o /tmp/vandenberg_viewing.wasm rust/vandenberg-viewing/src/lib.rs
          base64 -w0 /tmp/vandenberg_viewing.wasm > /tmp/viewpoint-engine.wasm.b64
          printf '\n' >> /tmp/viewpoint-engine.wasm.b64
      - name: Verify exported functions and source parity with Vandenberg inventory
        run: node scripts/verify-vandenberg-rust-wasm.cjs --wasm=/tmp/vandenberg_viewing.wasm
      - name: Upload build output for initial commit and source verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vandenberg-rust-wasm-compiled
          path: /tmp/viewpoint-engine.wasm.b64
          if-no-files-found: error
          retention-days: 7
