name: Haleakala sunrise validation capture

on:
  schedule:
    # Run once after even the latest Haleakala sunrise +20 minute truth window.
    # The collector recovers the exact -30/+20 sequence from LCO's rolling archive,
    # so GitHub scheduler jitter no longer determines whether a case is usable.
    - cron: '15 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: haleakala-sunrise-validation-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture complete OGG sunrise validation case
        run: node scripts/capture-haleakala-validation.mjs
      - name: Commit immutable evidence
        if: always()
        run: |
          if git diff --quiet -- data/haleakala-validation 2>/dev/null && [ -z "$(git status --porcelain data/haleakala-validation 2>/dev/null)" ]; then
            echo "No evidence captured in this run."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/haleakala-validation
          git commit -m "data: capture Haleakala sunrise validation evidence"
          git pull --rebase origin main
          git push origin HEAD:main
