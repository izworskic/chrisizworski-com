          new = '<div class="model-label">${p.weather?.checkpointCount>1?`NWS hourly forecast across ${esc(p.weather.checkpointCount)} corridor checkpoints${p.weather.partial?" · partial":""}`:"NWS hourly forecast near high terrain"}</div>`'
          assert old in s, 'weather model label missing'
          s = s.replace(old,new,1)
          ui.write_text(s)

          html = Path('public/blue-ridge-parkway/index.html')
          s = html.read_text()
          s = s.replace('<h2>What you picked—and what to do there</h2></div><p>This is the useful part of the plan: why each stop matches your interests, when you reach it and how much time it deserves.</p>', '<h2>Stops chosen for this drive</h2></div><p>These are the stops the planner selected from your interests and time budget. It also tells you which interests did not make the cut.</p>', 1)
          s = s.replace('/assets/blue-ridge-parkway.js?v=20260925-5','/assets/blue-ridge-parkway.js?v=20260925-6',1)
          html.write_text(s)

          # 4) Regression tests for the devil's-advocate failures.
          test = Path('tests/blue-ridge-parkway-destination.test.js')
