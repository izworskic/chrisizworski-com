  const stops=stopsForRoute(route),served=servedInterestSet(stops,input),coverage=input.interests.length?served.size/input.interests.length:0,duration=modeledDuration(route),margin=input.hours-duration,gap=maxGapMiles(stops,input),miles=routeMiles(route);
  let score=60+Math.min(30,served.size*6)+Math.min(10,stops.length*2)+Math.round(coverage*10);
  if(miles>140){if(gap>100)score-=10;else if(gap>70)score-=5;else if(stops.length>1)score+=4;}
  if(route.variant==="direct")score-=4;if(route.variant==="deep"&&margin<.5)score-=9;if(margin>=.5&&margin<=2)score+=6;if(margin<0)score-=80;
  if(road.blocked)return-1000;score-=Math.min(15,(road.cautions||[]).length*5);
  if(weather?.ok){if(Number(weather.precipMax)>=70)score-=10;else if(Number(weather.precipMax)>=40)score-=5;if(Number(weather.windMax)>=30)score-=7;}
  if(input.interests.includes("fall-color")&&foliage?.active&&/Peak-window|Building/.test(foliage.label))score+=5;
  return round(score,0);
}
'''
          assert old in s, 'routeScore block missing'
          s = s.replace(old,new,1)

          old = 'function evidence(item,input){return{id:item.route.id,name:item.route.name,durationHours:item.durationHours,routeMiles:routeMiles(item.route),stopCount:item.stops.length,stops:item.stops.map(s=>s.name),interestMatches:item.stops.flatMap(s=>(s.tags||[]).filter(t=>input.interests.includes(t))),roadBlocked:item.road.blocked,roadCautions:item.road.cautions.length,weather:item.weather?.ok?{precipMax:item.weather.precipMax,windMax:item.weather.windMax,tempMin:item.weather.tempMin,tempMax:item.weather.tempMax,forecast:item.weather.forecast}:"unavailable",foliage:item.foliage?.active?item.foliage.label:"not active"};}'
          new = 'function evidence(item,input){const served=servedInterestSet(item.stops,input),unserved=input.interests.filter(x=>!served.has(x));return{id:item.route.id,name:item.route.name,durationHours:item.durationHours,routeMiles:routeMiles(item.route),stopCount:item.stops.length,stops:item.stops.map(s=>s.name),interestCoverage:{served:[...served],unserved,servedCount:served.size,selectedCount:input.interests.length},maxGapMiles:maxGapMiles(item.stops,input),roadBlocked:item.road.blocked,roadCautions:item.road.cautions.length,weather:item.weather?.ok?{precipMax:item.weather.precipMax,windMax:item.weather.windMax,tempMin:item.weather.tempMin,tempMax:item.weather.tempMax,forecast:item.weather.forecast,checkpointCount:item.weather.checkpointCount||1}:"unavailable",foliage:item.foliage?.active?item.foliage.label:"not active"};}'
          assert old in s, 'evidence function missing'
          s = s.replace(old,new,1)

          old = 'function routeTimeline(route,stops,input,durationHours){let elapsed=0,previous=route.startMile;const items=[];for(const stop of stops){elapsed+=Math.abs(stop.milepost-previous)/MODELED_PARKWAY_MPH*60;items.push({name:stop.name,milepost:stop.milepost,arrival:clock(input.startMinutes+elapsed),elapsedMinutes:Math.round(elapsed),dwellMinutes:stop.dwellMinutes,elevationFt:stop.elevationFt,practical:stop.practical,tags:stop.tags});elapsed+=Number(stop.dwellMinutes)||0;previous=stop.milepost;}return{start:clock(input.startMinutes),arrivalBy:clock(input.startMinutes+durationHours*60),returnBy:clock(input.startMinutes+durationHours*60),items};}'
          new = 'function routeTimeline(route,stops,input,durationHours){let elapsed=0,previous=route.startMile;const items=[];for(const stop of stops){elapsed+=Math.abs(stop.milepost-previous)/MODELED_PARKWAY_MPH*60;items.push({name:stop.name,milepost:stop.milepost,arrival:clock(input.startMinutes+elapsed),elapsedMinutes:Math.round(elapsed),dwellMinutes:stop.dwellMinutes,elevationFt:stop.elevationFt,practical:stop.practical,tags:stop.tags,source:stop.source||null});elapsed+=stopCostMinutes(stop);previous=stop.milepost;}return{start:clock(input.startMinutes),arrivalBy:clock(input.startMinutes+durationHours*60),returnBy:clock(input.startMinutes+durationHours*60),items};}'
          assert old in s, 'routeTimeline function missing'
          s = s.replace(old,new,1)

          weather_insert = '''function weatherCheckpointPoints(input,pool){
  const start=GATEWAYS[input.gateway],finish=GATEWAYS[input.finish],mid=(start.milepost+finish.milepost)/2,middle=(pool||[]).slice().sort((a,b)=>Math.abs(a.milepost-mid)-Math.abs(b.milepost-mid))[0];
  const raw=[{...start,name:start.label},middle,{...finish,name:finish.label}].filter(Boolean),seen=new Set();
  return raw.filter(p=>{const key=`${Number(p.lat).toFixed(4)},${Number(p.lon).toFixed(4)}`;if(seen.has(key))return false;seen.add(key);return true;});
}
async function fetchCorridorWeather(input,pool){
  const points=weatherCheckpointPoints(input,pool),results=await Promise.all(points.map(async p=>({...await fetchWeather(p.lat,p.lon,input),checkpoint:p.name||p.label||`MP ${p.milepost}`}))),usable=results.filter(x=>x.ok);
  if(!usable.length)return{...(results[0]||{ok:false,error:"No corridor weather checkpoints available"}),checkpointCount:0,checkpointRequested:points.length,checkpoints:results.map(x=>({name:x.checkpoint,ok:false}))};
  const nums=(key)=>usable.map(x=>Number(x[key])).filter(Number.isFinite),mins=nums("tempMin"),maxs=nums("tempMax"),pops=nums("precipMax"),winds=nums("windMax"),forecast=[...new Set(usable.flatMap(x=>x.forecast||[]))].slice(0,6),updates=usable.map(x=>x.updatedAt).filter(Boolean).sort();
  return{ok:true,source:usable[0].source,sources:usable.map(x=>x.source).filter(Boolean),updatedAt:updates.at(-1)||null,tempMin:mins.length?Math.min(...mins):null,tempMax:maxs.length?Math.max(...maxs):null,precipMax:pops.length?Math.max(...pops):null,windMax:winds.length?Math.max(...winds):null,forecast,periodCount:usable.reduce((n,x)=>n+(Number(x.periodCount)||0),0),checkpointCount:usable.length,checkpointRequested:points.length,partial:usable.length<points.length,checkpoints:results.map(x=>({name:x.checkpoint,ok:x.ok,tempMin:x.tempMin??null,tempMax:x.tempMax??null,precipMax:x.precipMax??null,windMax:x.windMax??null,source:x.source||null}))};
}

'''
          marker = 'function corridorStops(startId,finishId){\n'
          assert marker in s, 'corridorStops marker missing'
          if 'function fetchCorridorWeather' not in s:
              s = s.replace(marker, weather_insert + marker, 1)

          old = '''  const highest=Object.values(STOPS).filter(s=>s.milepost>=Math.min(GATEWAYS[input.gateway].milepost,GATEWAYS[input.finish].milepost)&&s.milepost<=Math.max(GATEWAYS[input.gateway].milepost,GATEWAYS[input.finish].milepost)).sort((a,b)=>(b.elevationFt||0)-(a.elevationFt||0))[0]||GATEWAYS[input.finish];
  const weather=await fetchWeather(highest.lat,highest.lon,input);
'''
          new = '  const weather=await fetchCorridorWeather(input,corridorStops(input.gateway,input.finish));\n'
          assert old in s, 'single-point weather block missing'
          s = s.replace(old,new,1)

          old = 'stops:item.stops.map(s=>({id:s.id,name:s.name,milepost:s.milepost,lat:s.lat,lon:s.lon,elevationFt:s.elevationFt,dwellMinutes:s.dwellMinutes,practical:s.practical,tags:s.tags}))'
          new = 'stops:item.stops.map(s=>({id:s.id,name:s.name,milepost:s.milepost,lat:s.lat,lon:s.lon,elevationFt:s.elevationFt,dwellMinutes:s.dwellMinutes,practical:s.practical,tags:s.tags,source:s.source||null}))'
          assert old in s, 'serialized stop shape missing'
          s = s.replace(old,new,1)

          s = s.replace('Favor the visitor\'s interests while protecting arrival-time margin and respecting supplied road and weather tradeoffs.', 'Favor distinct coverage of the visitor\'s interests, useful stop distribution across long corridors, arrival-time margin, and supplied road and weather tradeoffs.', 1)
          s = s.replace('Hourly forecast sampled near representative high terrain on this corridor.', 'Hourly forecast aggregated conservatively across multiple corridor checkpoints when available.', 1)
          s = s.replace('Point-to-point route time is a planning estimate using one-way Parkway mileage, conservative mountain-road pace, selected stop time and buffer—not turn-by-turn traffic time.', 'Point-to-point route time is a planning estimate using one-way Parkway mileage, conservative mountain-road pace, selected stop time, a small parking/re-entry allowance per stop, and buffer—not turn-by-turn traffic time.', 1)
          s = s.replace('Weather is an NWS hourly forecast near representative high terrain on the corridor, not an observation at every overlook.', 'Weather is an NWS hourly forecast aggregated across start, middle and finish corridor checkpoints when available. It is still a forecast, not an observation at every overlook.', 1)
          s = s.replace('module.exports._test={normalizeInput,corridorStops,stopValue,chooseStops,corridorRoute,routeMiles,modeledDuration,nonstopMinutes,buildCandidates,routeScore,fitLabel};', 'module.exports._test={normalizeInput,corridorStops,matchedInterests,stopCostMinutes,servedInterestSet,maxGapMiles,stopValue,chooseStops,corridorRoute,routeMiles,modeledDuration,nonstopMinutes,buildCandidates,routeScore,fitLabel,weatherCheckpointPoints,fetchCorridorWeather};', 1)
          p.write_text(s)

          # 3) Make the result page accountable for served and unserved interests.
          ui = Path('public/assets/blue-ridge-parkway.js')
          s = ui.read_text()
          old = '    const items=plan.timeline?.items||[];\n    if(summary)summary.innerHTML=`<strong>${items.length} selected stop${items.length===1?"":"s"}</strong><span>Your selections: ${esc(chosenLabels.join(" · ")||"Scenic drive")}</span>`;'
          new = '    const items=plan.timeline?.items||[],servedIds=[...new Set(items.flatMap(item=>(item.tags||[]).filter(tag=>chosen.has(tag))))],unservedIds=[...chosen].filter(tag=>!servedIds.includes(tag)),servedLabels=servedIds.map(x=>interestLabels[x]||x),unservedLabels=unservedIds.map(x=>interestLabels[x]||x);\n    if(summary)summary.innerHTML=`<strong>${items.length} recommended stop${items.length===1?"":"s"}</strong><span>Serves ${servedIds.length} of ${chosen.size} selected interests${servedLabels.length?`: ${esc(servedLabels.join(" · "))}`:""}</span>${unservedLabels.length?`<span><b>Not covered:</b> ${esc(unservedLabels.join(" · "))}</span>`:""}`;'
          assert old in s, 'selected stop summary block missing'
          s = s.replace(old,new,1)

          old = '<div class="stop-detail-block"><span>What to do here</span><p>${esc(item.practical||"Use this as a focused Parkway stop and keep the rest of the itinerary on schedule.")}</p></div></article>`;'
          new = '<div class="stop-detail-block"><span>What to do here</span><p>${esc(item.practical||"Use this as a focused Parkway stop and keep the rest of the itinerary on schedule.")}</p></div>${item.source?`<div class="stop-detail-block"><span>Official details</span><p><a href="${esc(safeUrl(item.source))}" target="_blank" rel="noopener">NPS stop information ↗</a></p></div>`:""}</article>`;'
          assert old in s, 'stop detail card tail missing'
          s = s.replace(old,new,1)

