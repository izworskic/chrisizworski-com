name: Blue Ridge devil advocate improvements

on:
  push:
    branches:
      - improve/blue-ridge-devils-advocate

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/blue-ridge-devils-advocate
          fetch-depth: 0
      - name: Apply hostile-review improvements
        run: python .github/blue-ridge-devils-advocate.py
      - name: Run Blue Ridge tests
        run: node --test tests/blue-ridge-parkway-destination.test.js tests/blue-ridge-parkway-ui.test.js tests/blue-ridge-parkway.test.js
      - name: Commit improvements
        run: |
          if git diff --quiet; then
            echo "No product changes to commit"
            exit 0
          fi
          git config user.name "Chris Izworski"
          git config user.email "46615230+izworskic@users.noreply.github.com"
          git add lib/blue-ridge-parkway/catalog.js lib/blue-ridge-parkway/point-to-point.js public/assets/blue-ridge-parkway.js public/blue-ridge-parkway/index.html tests/blue-ridge-parkway-destination.test.js
          git commit -m "Strengthen Blue Ridge long-corridor planning"
          git push origin HEAD:improve/blue-ridge-devils-advocate
