name: Temporary Kilauea punctuation polish
on:
  push:
    branches:
      - agent/kilauea-no-em-dashes-2026-09-28
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kilauea-no-em-dashes-2026-09-28
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Polish punctuation and test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/kilauea-decision.js')
          s = p.read_text()
          old = 'Once there, look across Kaluapele before narrowing in on the vent, the scale is part of the story.'
          new = 'Once there, look across Kaluapele before narrowing in on the vent. The scale is part of the story.'
          if old not in s:
              raise SystemExit('punctuation target not found')
          p.write_text(s.replace(old, new, 1))
          PY
          if grep -n $'\u2014' public/labs/kilauea-live/index.html lib/kilauea-decision.js; then exit 1; fi
          node --test tests/kilauea-live.test.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/kilauea-decision.js
          git commit -m 'Polish Kilauea punctuation after em dash removal'
          git push origin HEAD:agent/kilauea-no-em-dashes-2026-09-28
