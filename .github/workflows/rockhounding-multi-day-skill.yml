name: Rockhounding multi-day offshore NOAA skill research

on:
  workflow_dispatch:
  push:
    branches:
      - research/rockhounding-multi-day-skill-20261015
    paths:
      - .github/workflows/rockhounding-multi-day-skill.yml

permissions:
  contents: write

jobs:
  verify-code:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exercise every rockhounding engine and offshore error-bin regression
        run: node --test tests/rockhounding*.test.js
      - name: Test Python sample coordinate and source-mask constraints
        run: |
          python3 -m unittest discover -s tests -p 'test_rockhounding_*.py' -v
          python3 -m py_compile scripts/rockhounding/*.py

  recent-previous-day-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout independent wave-data archive
        uses: actions/checkout@v4
        with:
          ref: research/rockhounding-wave-data
          path: wave-history
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GRIB decoder
        run: python -m pip install -r scripts/rockhounding/requirements.txt
      - name: Determine previous UTC date
        shell: bash
        run: |
          echo "PREVIOUS_DATE=$(date -u -d '1 day ago' +%Y%m%d)" >> "$GITHUB_ENV"
          echo "Previous-day research issue: $(date -u -d '1 day ago' +%Y-%m-%d) 12:00Z"
      - name: Attempt one authentic previous-day NOAA GLWU buoy-colocated 12Z model issue
        id: capture
        continue-on-error: true
        run: |
          mkdir -p artifacts
          python scripts/rockhounding/capture-buoy45004-model.py \
            --date "$PREVIOUS_DATE" --cycle 12 \
            --output artifacts/ndbc45004-previous-day-model.json
      - name: Record a truthful unavailable-source outcome rather than fabricate a model
        if: steps.capture.outcome != 'success'
        run: |
          echo 'NOAA_ARCHIVED_ISSUE_UNAVAILABLE: previous-day operational model file could not be decoded. No dates or forecast heights were substituted.'
      - name: Retrieve actual NOAA 45004 wave-height readings
        if: steps.capture.outcome == 'success'
        run: |
          curl --fail --silent --show-error --location --max-time 35 --retry 2 \
            'https://www.ndbc.noaa.gov/data/realtime2/45004.txt' \
            --output artifacts/ndbc45004-actual-wave-measurements.txt
          head -n 1 artifacts/ndbc45004-actual-wave-measurements.txt | grep -q WVHT
      - uses: actions/setup-node@v4
        if: steps.capture.outcome == 'success'
        with:
          node-version: '22'
      - name: Compare prior day's actually issued forecast with time-matched actual buoy readings
        if: steps.capture.outcome == 'success'
        run: |
          node scripts/rockhounding/verify-buoy45004-model.cjs \
            --model artifacts/ndbc45004-previous-day-model.json \
            --buoy-text artifacts/ndbc45004-actual-wave-measurements.txt \
            --ledger wave-history/data/rockhounding/buoy45004-issued-model-ledger.json \
            --report wave-history/data/rockhounding/buoy45004-verified-offshore-report.json \
            --now "$(date -u '+%Y-%m-%dT%H:%M:%S.000Z')"
      - name: Persist previous-day evidence only on separate research archive branch
        if: steps.capture.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git -C wave-history config user.name 'Rockhounding Research Bot'
          git -C wave-history config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C wave-history add data/rockhounding/buoy45004-issued-model-ledger.json data/rockhounding/buoy45004-verified-offshore-report.json
          if ! git -C wave-history diff --cached --quiet; then
            git -C wave-history commit -m "data(rockhounding): backfill actual earlier NOAA wave issue $PREVIOUS_DATE"
            git -C wave-history push origin HEAD:research/rockhounding-wave-data
          fi
      - name: Save original source and detailed research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: previous-day-offshore-noaa-verification
          retention-days: 14
          if-no-files-found: warn
          path: |
            artifacts/ndbc45004-previous-day-model.json
            artifacts/ndbc45004-actual-wave-measurements.txt
            wave-history/data/rockhounding/buoy45004-verified-offshore-report.json
