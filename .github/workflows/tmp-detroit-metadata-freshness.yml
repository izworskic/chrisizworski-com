name: Temporary Detroit metadata freshness
on:
  push:
    branches:
      - seo/detroit-outdoors-metadata
permissions:
  contents: write
jobs:
  sync-freshness:
    if: github.event.head_commit.message != 'Sync Detroit metadata freshness'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: seo/detroit-outdoors-metadata
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sync derived freshness metadata
        shell: bash
        run: |
          node scripts/stamp-freshness.mjs
          git diff -- public/detroit-outdoors/index.html public/sitemap.xml
          git add public/detroit-outdoors/index.html public/sitemap.xml
          if git diff --cached --quiet; then
            echo 'No Detroit freshness changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sync Detroit metadata freshness'
          git push origin HEAD:seo/detroit-outdoors-metadata
