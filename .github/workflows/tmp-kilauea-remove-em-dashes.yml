name: Temporary Kilauea remove em dashes
on:
  push:
    branches:
      - agent/kilauea-no-em-dashes-2026-09-28
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kilauea-no-em-dashes-2026-09-28
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove em dashes and test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          targets = [
              Path('public/labs/kilauea-live/index.html'),
              Path('lib/kilauea-decision.js'),
          ]
          for p in targets:
              s = p.read_text()
              s = s.replace(' — ', ': ')
              s = s.replace('—', ', ')
              p.write_text(s)

          t = Path('tests/kilauea-live.test.js')
          ts = t.read_text()
          needle = "  for (const phrase of ['breathtaking','hidden gem','must-see','adventure awaits','nature’s raw power','immerse yourself']) {\n    assert.doesNotMatch(combined, new RegExp(phrase, 'i'));\n  }"
          insert = needle + "\n  assert.doesNotMatch(combined, /\\u2014/);"
          if needle not in ts:
              raise SystemExit('voice guard insertion target not found')
          ts = ts.replace(needle, insert, 1)
          t.write_text(ts)
          PY
          if grep -n $'\u2014' public/labs/kilauea-live/index.html lib/kilauea-decision.js; then
            echo 'Em dash remains in Kilauea product copy'
            exit 1
          fi
          node --test tests/kilauea-live.test.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/labs/kilauea-live/index.html lib/kilauea-decision.js tests/kilauea-live.test.js
          git commit -m 'Remove em dashes from Kilauea copy'
          git push origin HEAD:agent/kilauea-no-em-dashes-2026-09-28
