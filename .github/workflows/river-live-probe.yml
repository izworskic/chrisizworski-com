name: River live probe
on:
  push:
    branches:
      - debug/river-live-probe
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe West Branch production and USGS
        shell: bash
        run: |
          node <<'NODE'
          const targets=[];
          async function probe(label,url){
            const start=Date.now();
            try{
              const r=await fetch(url,{headers:{'user-agent':'ChrisIzworskiRiverProbe/1.0','accept':'application/json'}});
              const text=await r.text();
              console.log('\n### '+label);
              console.log('URL',url);
              console.log('STATUS',r.status);
              console.log('CTYPE',r.headers.get('content-type'));
              console.log('ELAPSED_MS',Date.now()-start);
              console.log('BODY',text.slice(0,4000));
              return {r,text};
            }catch(e){
              console.log('\n### '+label+' ERROR');
              console.log('URL',url);
              console.log('ELAPSED_MS',Date.now()-start);
              console.log(String(e?.stack||e));
              return null;
            }
          }
          const geo=await probe('PRODUCTION GEOCODE','https://chrisizworski.com/api/national-geocode?q=West%20Branch%2C%20MI');
          let lat=44.2764,lon=-84.2386;
          try{
            const j=JSON.parse(geo.text);
            lat=Number(j.latitude); lon=Number(j.longitude);
          }catch{}
          console.log('\nRESOLVED',JSON.stringify({lat,lon}));
          await probe('PRODUCTION RIVERS',`https://chrisizworski.com/api/national-rivers?lat=${lat}&lon=${lon}&probe=${Date.now()}`);
          const round7=n=>Math.round(n*1e7)/1e7;
          for(const span of [0.6,1.5,2.4]){
            const west=round7(Math.max(-180,lon-span)),east=round7(Math.min(180,lon+span)),south=round7(Math.max(-90,lat-span)),north=round7(Math.min(90,lat+span));
            const site=new URL('https://waterservices.usgs.gov/nwis/site/');
            site.searchParams.set('format','rdb');
            site.searchParams.set('bBox',`${west},${south},${east},${north}`);
            site.searchParams.set('siteType','ST');
            site.searchParams.set('siteStatus','active');
            site.searchParams.set('hasDataTypeCd','iv');
            site.searchParams.set('parameterCd','00060');
            await probe('USGS SITE span '+span,site.toString());
          }
          NODE
# production verification after PR 207
