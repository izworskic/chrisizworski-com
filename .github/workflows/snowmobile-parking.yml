name: Snowmobile DNR parking-source gate
on:
  pull_request:
    paths:
      - api/snowmobile-parking.js
      - lib/snowmobile/parking.cjs
      - public/assets/snowmobile-parking.js
      - public/assets/snowmobile-region.js
      - public/assets/snowmobile.css
      - public/snowmobile/regions/**
      - scripts/generate-snowmobile-region-pages.mjs
      - tests/snowmobile-parking.test.js
      - .github/workflows/snowmobile-parking.yml
permissions:
  contents: read
jobs:
  verified-parking:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse client, DNR normalization and API
        run: |
          node --check api/snowmobile-parking.js
          node --check lib/snowmobile/parking.cjs
          node --check public/assets/snowmobile-parking.js
          node --check public/assets/snowmobile-region.js
      - name: Verify DNR provenance, parking ownership, geometry and route separation
        run: node --test tests/snowmobile-parking.test.js tests/snowmobile-route-ui.test.js tests/snowmobile-route-ux.test.js tests/snowmobile-routing.test.js tests/snowmobile-rust.test.js
      - name: Regenerate regional pages from single source of truth
        run: |
          node scripts/generate-snowmobile-region-pages.mjs
          git diff --exit-code -- public/snowmobile/regions/
      - name: Existing snowmobile safety and performance guard
        run: |
          node scripts/benchmark-snowmobile-routing.mjs --check
          node scripts/benchmark-snowmobile.mjs --check
