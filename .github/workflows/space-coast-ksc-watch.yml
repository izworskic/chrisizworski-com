name: Space Coast KSC official announcement watch

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/space-coast-ksc-watch.yml'
      - 'api/space-coast-ksc-watch.js'
      - 'lib/space-coast-ksc-watch.js'
      - 'lib/space-coast-ksc-watch-auth.js'
      - 'lib/space-coast-ksc-viewing.js'
  schedule:
    # UTC, staggered off the top of the hour. Nominal 15-minute cadence.
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read
  id-token: write

concurrency:
  group: space-coast-ksc-watch
  cancel-in-progress: false

jobs:
  check-official-ksc:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify production is serving the monitoring endpoint on initial release
        if: github.event_name == 'push'
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --max-time 8 \
              "https://chrisizworski.com/api/space-coast-ksc-watch" >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "The KSC watch API has not reached production."
          exit 1
      - name: Mint short-lived repository-scoped GitHub OIDC token
        uses: actions/github-script@v7
        id: oidc
        with:
          script: |
            const token = await core.getIDToken('https://chrisizworski.com/api/space-coast-ksc-watch');
            core.setSecret(token);
            core.setOutput('token', token);
      - name: Inspect official KSC announcements and save verified changes
        env:
          KSC_MONITOR_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 1 --retry-all-errors --max-time 65 \
            -X POST \
            -H "Authorization: Bearer ${KSC_MONITOR_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://chrisizworski.com/api/space-coast-ksc-watch"
