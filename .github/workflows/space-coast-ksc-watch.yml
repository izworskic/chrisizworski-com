name: Space Coast KSC official announcement watch

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/space-coast-ksc-watch.yml'
      - 'api/space-coast-ksc-watch.js'
      - 'lib/space-coast-ksc-watch.js'
      - 'lib/space-coast-ksc-watch-auth.js'
      - 'lib/space-coast-ksc-viewing.js'
      - 'lib/rocket-launch-truth.js'
      - 'lib/rocket-launch-national.js'
      - 'api/rocket-launch-truth.js'
      - 'public/synced-national-tools/assets/launch-truth-desk.js'
      - 'tests/rocket-launch-truth.test.js'
  schedule:
    # UTC, re-registered after observing 3h without a cron-triggered refresh.
    # GitHub's scheduled runs are best effort; the public API reports stale data.
    - cron: '11,26,41,56 * * * *'

permissions:
  contents: read
  id-token: write

concurrency:
  group: space-coast-ksc-watch
  cancel-in-progress: false

jobs:
  check-official-ksc:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify production is serving the monitoring endpoint on initial release
        if: github.event_name == 'push'
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --max-time 8 \
              "https://chrisizworski.com/api/rocket-launch-truth?launchId=54d471e8-695c-4fa7-a3cf-dbd8b389e8ae" |
              jq -e '.ok == true and .engineVersion == 2 and (.provenance | contains("RocketLaunch.Live"))' >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "The KSC watch API has not reached production."
          exit 1
      - name: Mint short-lived repository-scoped GitHub OIDC token
        uses: actions/github-script@v7
        id: oidc
        with:
          script: |
            const token = await core.getIDToken('https://chrisizworski.com/api/space-coast-ksc-watch');
            core.setSecret(token);
            core.setOutput('token', token);
      - name: Inspect official KSC announcements and save verified changes
        env:
          KSC_MONITOR_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          result="$(curl --fail-with-body --silent --show-error \
            --retry 1 --retry-all-errors --max-time 65 \
            -X POST \
            -H "Authorization: Bearer ${KSC_MONITOR_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://chrisizworski.com/api/space-coast-ksc-watch")"
          # An HTTP 200 from the KSC collector is insufficient if the
          # independent LL2 schedule observation failed. Surface a failed
          # scheduled run instead of silently claiming 24/7 coverage.
          if ! printf '%s' "$result" | jq -e '
            .ok == true and
            (.scheduleMonitor.ok == true or
             .scheduleMonitor.skipped == "another-launch-schedule-check-active")
          ' >/dev/null; then
            echo "Official KSC and/or launch-day schedule monitoring was incomplete."
            exit 1
          fi
          if ! printf '%s' "$result" | jq -e '
            (.nationalMonitor.ok == true and
             (.nationalMonitor.checkedAt | type == "string") and
             (.nationalMonitor.providerGroups | length == 2))
          ' >/dev/null; then
            echo "Shared national LL2 snapshot was not confirmed in the signed watch."
            printf '%s' "$result" | jq '{nationalMonitor}'
            exit 1
          fi
          if ! printf '%s' "$result" | jq -e '
            (.truthMonitor.ok == true or
             .truthMonitor.skipped == "hourly-evidence-cadence" or
             .truthMonitor.skipped == "newer-evidence-already-recorded" or
             .truthMonitor.skipped == "another-evidence-run-active")
          ' >/dev/null; then
            echo "The Launch Truth collector failed; scheduled coverage is not established."
            printf '%s' "$result" | jq '{truthMonitor}'
            exit 1
          fi
          printf '%s' "$result" | jq '{nationalMonitor,scheduleMonitor,truthMonitor}'
          echo "KSC, shared national schedule, Florida history and Launch Truth v2 verified."
