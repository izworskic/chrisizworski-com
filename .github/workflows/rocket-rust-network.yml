name: Rocket viewing Rust network
on:
  pull_request:
    paths:
      - 'rust/rocket-viewing-network/**'
      - 'public/assets/rocket-rust-viewing*'
      - 'public/wallops-rocket-launch-viewing/**'
      - 'public/starbase-rocket-launch-viewing/**'
      - 'scripts/verify-rocket-rust-network.cjs'
      - '.github/workflows/rocket-rust-network.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust and WebAssembly target
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain 1.90.0
      - name: Run native Rust correctness and access-safety tests
        run: |
          rustc +1.90.0 --edition=2021 --test rust/rocket-viewing-network/src/lib.rs -o /tmp/rv-tests
          /tmp/rv-tests
      - name: Build actual Rust WebAssembly decision engine
        run: |
          rustc +1.90.0 --edition=2021 --crate-type cdylib \
            --target wasm32-unknown-unknown -C opt-level=z \
            -C codegen-units=1 -C lto=fat -C panic=abort -C strip=symbols \
            -o /tmp/rocket-viewing-network.wasm rust/rocket-viewing-network/src/lib.rs
          echo ROCKET_RUST_WASM_B64_BEGIN
          base64 -w0 /tmp/rocket-viewing-network.wasm
          printf '\nROCKET_RUST_WASM_B64_END\n'
      - name: Verify six site identities, Rust ranking and published asset
        run: node scripts/verify-rocket-rust-network.cjs --wasm=/tmp/rocket-viewing-network.wasm
      - name: Verify region source integrity and WebAssembly UI contract
        run: |
          node --test tests/rocket-rust-network.test.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rocket-viewing-network-wasm
          path: /tmp/rocket-viewing-network.wasm
          if-no-files-found: error
          retention-days: 7
