name: Great Lakes one-time NOAA historical library pilot
# Bounded branch-only research. Never scheduled; no production deployment or writes.
on:
  push:
    branches: [agent/great-lakes-historical-passage-library-20261124]
    paths: [.github/workflows/great-lakes-noaa-library-pilot.yml]
permissions:
  contents: read
jobs:
  historical-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify offline collector
        run: node --test tests/great-lakes-historical-library.test.js
      - name: Download each planned NOAA archive once and scan all regions
        shell: bash
        run: |
          set -euo pipefail
          command -v zstd
          mkdir -p research-output
          for day in 2025-06-15 2025-08-15 2025-10-15; do
            archive="$RUNNER_TEMP/ais-$day.csv.zst"
            curl --fail --location --silent --show-error --connect-timeout 15 --max-time 350 --max-filesize 600000000 \
              "https://noaaocm.blob.core.windows.net/ais/csv2/csv2025/ais-$day.csv.zst" -o "$archive"
            test -s "$archive"
            sha=$(sha256sum "$archive" | cut -d ' ' -f 1)
            echo "$sha  ais-$day.csv.zst" > "research-output/$day.sha256"
            zstd -dc -- "$archive" | node scripts/great-lakes-historical-library.mjs collect "$day" "$sha" "research-output/$day.json"
            rm -f "$archive"
          done
      - name: Summarize completed archive dates without inferring passages
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(research-output/2025-*.json)
          if (( ${#files[@]} == 0 )); then echo 'No completed NOAA archive dates' >> "$GITHUB_STEP_SUMMARY"; exit 1; fi
          node scripts/great-lakes-historical-library.mjs summary research-output/coverage.json "${files[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: great-lakes-noaa-historical-library-pilot
          path: research-output/
          retention-days: 5
          if-no-files-found: error
