name: Rockhounding photo-free Lake Superior NOAA level context
on:
  workflow_dispatch:
  push:
    branches:
      - research/rockhounding-photo-free-noaa-lake-level-20261016
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify original Marquette, MI NOAA gauge identity and photo-free integration
        run: |
          node --test tests/rockhounding-noaa-marquette-water-level.test.js tests/rockhounding-noaa-remote-level-integration.test.js
          node --test tests/rockhounding-live-photo-free*.test.js
      - name: All rockhounding regressions unchanged
        run: node --test tests/rockhounding*.test.js
