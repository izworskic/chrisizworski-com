name: Execute readable Kilauea source repair
on:
  push:
    branches: ['agent/kilauea-source-health-2026-09-28']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply and test source repair
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/tmp-kilauea-source-repair.py')
          s=p.read_text()
          s=s.replace(", nps + '\\nasync function loadWeather', s, count=1)", ", lambda _: nps + '\\nasync function loadWeather', s, count=1)")
          s=s.replace(", air + '\\nfunction profileFromQuery', s, count=1)", ", lambda _: air + '\\nfunction profileFromQuery', s, count=1)")
          s=s.replace(", install + \"\\ntest('live API synthesizes\", t, count=1)", ", lambda _: install + \"\\ntest('live API synthesizes\", t, count=1)")
          p.write_text(s)
          PY
          python scripts/tmp-kilauea-source-repair.py
          node --test tests/kilauea-live.test.js
          rm -f .github/workflows/tmp-kilauea-source-probe.yml
          rm -f .github/workflows/tmp-kilauea-source-repair-v2.yml
          rm -f .github/workflows/tmp-kilauea-source-repair-v3.yml
          rm -f scripts/tmp-kilauea-source-repair.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Kilauea NPS and SO2 source health'
          git push origin HEAD:agent/kilauea-source-health-2026-09-28
