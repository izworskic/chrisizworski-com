name: Michigan Snow Totals visual pilot QA
on:
  push:
    branches: [visual-v1-michigan-snow-totals-pilot]
    paths:
      - 'scripts/snow-visual-pilot-qa.cjs'
      - '.github/workflows/snow-visual-pilot-qa.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser driver
        run: |
          npm install --prefix /tmp/snow-visual --no-save --package-lock=false playwright@1.56.1
          if command -v google-chrome >/dev/null 2>&1; then
            echo "SNOW_CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null 2>&1; then
            echo "SNOW_CHROME=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            /tmp/snow-visual/node_modules/.bin/playwright install --with-deps chromium
          fi
      - name: Test all viewports and capture visual evidence
        run: node scripts/snow-visual-pilot-qa.cjs
      - name: Commit visual evidence to pilot branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/visual-pilots/michigan-snow-totals/after-*.png docs/visual-pilots/michigan-snow-totals/browser-qa.json
          git commit -m "Capture snow visual pilot browser evidence"
          git push origin "HEAD:${{ github.ref_name }}"
      - name: Preserve QA screenshots even on a rejected push
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snow-totals-visual-pilot
          path: docs/visual-pilots/michigan-snow-totals/after-*.png
          retention-days: 14
