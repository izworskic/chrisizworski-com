name: Pictured Rocks subdomain cutover

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pictured-rocks-subdomain-cutover.yml

permissions:
  contents: write

jobs:
  cutover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch routing and add regression test
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const cfg = JSON.parse(fs.readFileSync('vercel.json', 'utf8'));
          const hostRule = [{ type: 'host', value: 'picturedrocks.chrisizworski.com' }];
          const additions = [
            { source: '/', has: hostRule, destination: '/api/pictured-rocks-production' },
            { source: '/index.html', has: hostRule, destination: '/api/pictured-rocks-production' }
          ];
          cfg.functions = cfg.functions || {};
          cfg.functions['api/pictured-rocks-production.js'] = {
            maxDuration: 10,
            includeFiles: ['public/labs/pictured-rocks-planner/index.html']
          };
          cfg.rewrites = cfg.rewrites || [];
          const same = (a,b) => a.source === b.source && a.destination === b.destination && JSON.stringify(a.has || []) === JSON.stringify(b.has || []);
          cfg.rewrites = [...additions.filter(a => !cfg.rewrites.some(b => same(a,b))), ...cfg.rewrites];
          fs.writeFileSync('vercel.json', JSON.stringify(cfg, null, 2) + '\n');

          fs.writeFileSync('tests/pictured-rocks-subdomain-cutover.test.js', `const test = require('node:test');
const assert = require('node:assert/strict');
const fs = require('node:fs');
const path = require('node:path');
const root = path.join(__dirname, '..');
const config = JSON.parse(fs.readFileSync(path.join(root, 'vercel.json'), 'utf8'));
const renderer = require('../api/pictured-rocks-production.js');
const host = 'picturedrocks.chrisizworski.com';

test('subdomain root routes to rebuilt Pictured Rocks renderer', () => {
  const routes = (config.rewrites || []).filter(r => r.destination === '/api/pictured-rocks-production');
  assert.deepEqual(routes.map(r => r.source).sort(), ['/', '/index.html']);
  for (const route of routes) assert.deepEqual(route.has, [{ type: 'host', value: host }]);
});

test('renderer bundles current rebuilt page and makes only production copy indexable', () => {
  const fc = config.functions['api/pictured-rocks-production.js'];
  assert.ok(fc.includeFiles.includes('public/labs/pictured-rocks-planner/index.html'));
  const html = renderer._test.productionHtml();
  assert.match(html, /index,follow,max-image-preview:large/);
  assert.doesNotMatch(html, /noindex,nofollow/);
  assert.match(html, /Should you go by water, trail, or road today\\?/);
  assert.match(html, /https:\\/\\/picturedrocks\\.chrisizworski\\.com\\//);
});

test('host parsing recognizes the canonical subdomain', () => {
  assert.equal(renderer._test.requestHost({headers:{host: host + ':443'}}), host);
  assert.equal(renderer._test.requestHost({headers:{'x-forwarded-host': host + ', proxy.internal'}}), host);
});
`);
          NODE
          rm .github/workflows/pictured-rocks-subdomain-cutover.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vercel.json tests/pictured-rocks-subdomain-cutover.test.js .github/workflows/pictured-rocks-subdomain-cutover.yml
          git commit -m "Route rebuilt Pictured Rocks on canonical subdomain"
          git push origin HEAD:main
