name: Pictured Rocks subdomain cutover patch

on:
  push:
    branches:
      - agent/pictured-rocks-subdomain-cutover-2026-09-27
    paths:
      - .github/workflows/pictured-rocks-subdomain-cutover.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch existing Vercel config safely
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const cfgPath = 'vercel.json';
          const cfg = JSON.parse(fs.readFileSync(cfgPath, 'utf8'));
          const host = 'picturedrocks.chrisizworski.com';
          const hostMatch = [{ type: 'host', value: host }];
          const additions = [
            { source: '/', has: hostMatch, destination: '/api/pictured-rocks-production' },
            { source: '/index.html', has: hostMatch, destination: '/api/pictured-rocks-production' }
          ];
          const current = Array.isArray(cfg.rewrites) ? cfg.rewrites : [];
          const exists = (route) => current.some((item) => item.source === route.source && item.destination === route.destination && JSON.stringify(item.has || []) === JSON.stringify(route.has || []));
          cfg.rewrites = [...additions.filter((route) => !exists(route)), ...current];
          cfg.functions = cfg.functions || {};
          cfg.functions['api/pictured-rocks-production.js'] = {
            maxDuration: 10,
            includeFiles: ['public/labs/pictured-rocks-planner/index.html']
          };
          fs.writeFileSync(cfgPath, JSON.stringify(cfg, null, 2) + '\n');

          const test = String.raw`const test = require('node:test');
const assert = require('node:assert/strict');
const fs = require('node:fs');
const path = require('node:path');

const root = path.join(__dirname, '..');
const config = JSON.parse(fs.readFileSync(path.join(root, 'vercel.json'), 'utf8'));
const renderer = require('../api/pictured-rocks-production.js');
const host = 'picturedrocks.chrisizworski.com';

test('Pictured Rocks subdomain root routes to production renderer', () => {
  const routes = (config.rewrites || []).filter((route) => route.destination === '/api/pictured-rocks-production');
  assert.equal(routes.length, 2);
  assert.deepEqual(routes.map((route) => route.source).sort(), ['/', '/index.html']);
  for (const route of routes) {
    assert.deepEqual(route.has, [{ type: 'host', value: host }]);
  }
});

test('production renderer bundles the current rebuilt page', () => {
  const functionConfig = config.functions && config.functions['api/pictured-rocks-production.js'];
  assert.ok(functionConfig);
  assert.ok(functionConfig.includeFiles.includes('public/labs/pictured-rocks-planner/index.html'));
  assert.equal(renderer._test.TARGET_HOST, host);
  const html = renderer._test.productionHtml();
  assert.match(html, /index,follow,max-image-preview:large/);
  assert.doesNotMatch(html, /noindex,nofollow/);
  assert.match(html, /https:\/\/picturedrocks\.chrisizworski\.com\//);
  assert.match(html, /Should you go by water, trail, or road today\?/);
});

test('renderer keeps direct non-subdomain access out of search', () => {
  assert.equal(renderer._test.requestHost({ headers: { host: 'picturedrocks.chrisizworski.com:443' } }), host);
  assert.equal(renderer._test.requestHost({ headers: { 'x-forwarded-host': 'picturedrocks.chrisizworski.com, proxy.internal' } }), host);
});
`;
          fs.writeFileSync('tests/pictured-rocks-subdomain-cutover.test.js', test);
          NODE
          rm .github/workflows/pictured-rocks-subdomain-cutover.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vercel.json tests/pictured-rocks-subdomain-cutover.test.js .github/workflows/pictured-rocks-subdomain-cutover.yml
          git commit -m "Route rebuilt Pictured Rocks on its subdomain"
          git push
