name: Freighter action desk browser QA
on:
  pull_request:
    paths:
      - 'public/great-lakes-freighter-tracking/**'
      - 'public/assets/freighter-tracker.*'
      - 'public/assets/freighter-card-stories.json'
      - 'tests/freighter-card-stories.test.js'
      - 'tests/freighter-action-*'
      - '.github/workflows/freighter-action-browser.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: node tests/freighter-action-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: freighter-action-browser
          path: artifacts/freighter-action/*.png
          if-no-files-found: ignore
          retention-days: 3
