name: Temporary Kilauea source probe
on:
  push:
    branches: ['agent/kilauea-source-health-2026-09-28']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect live source schemas
        run: |
          python - <<'PY'
          import json, re, urllib.request
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 KilaueaSourceProbe','Accept':'*/*'})
              with urllib.request.urlopen(req,timeout=20) as r:
                  print('FETCH',url,'status',r.status,'type',r.headers.get('content-type'))
                  return r.read().decode('utf-8','ignore')
          alerts=json.loads(get('https://www.nps.gov/havo/park-alerts-havo.json'))
          print('=== NPS alert JSON ===')
          print('type=',type(alerts).__name__,'count=',len(alerts) if isinstance(alerts,list) else None)
          for a in (alerts[:10] if isinstance(alerts,list) else []):
              print(json.dumps(a,ensure_ascii=False)[:5000])
          so2=get('https://air.doh.hawaii.gov/HawaiiSO2/')
          m=re.search(r'var\s+Data\s*=\s*(\[.*?\]);',so2,re.S)
          data=json.loads(m.group(1)) if m else []
          print('=== DOH first rows complete ===')
          for row in data[:3]: print(json.dumps(row,ensure_ascii=False)[:9000])
          PY
