name: Temporary Kilauea source probe
on:
  push:
    branches: ['agent/kilauea-source-health-2026-09-28']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect NPS alert transport and DOH payload
        run: |
          set -euo pipefail
          curl -fsSL 'https://www.nps.gov/havo/planyourvisit/conditions.htm' -o /tmp/nps.html
          echo '=== NPS endpoint/url candidates ==='
          grep -Eino '(https?:[^"'"' ]+|/[A-Za-z0-9_./?=&%-]+)' /tmp/nps.html | grep -Ei '(alert|condition|api|parkCode|road)' | head -n 120 || true
          echo '=== NPS ajax/fetch context ==='
          grep -Ein -C 6 '(ajax|fetch\(|getJSON|alerts|parkCode|activeRoadClosuresAlerts)' /tmp/nps.html | head -n 260 || true
          echo '=== script sources that mention alerts/park data ==='
          grep -Eio '<script[^>]+src="[^"]+"' /tmp/nps.html | sed -E 's/.*src="([^"]+)".*/\1/' | head -n 120
          echo '=== DOH embedded Data declaration ==='
          curl -fsSL 'https://air.doh.hawaii.gov/HawaiiSO2/' -o /tmp/so2.html
          python - <<'PY'
          import re
          s=open('/tmp/so2.html',encoding='utf-8',errors='ignore').read()
          m=re.search(r'var\s+Data\s*=\s*(\[.*?\]);',s,re.S)
          print('data_found=',bool(m),'chars=',len(m.group(1)) if m else 0)
          print((m.group(1)[:5000] if m else ''))
          PY
