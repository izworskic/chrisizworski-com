name: Temporary Manistee page-one composer

on:
  push:
    branches:
      - feat/manistee-page-one-push-2026-08-22

permissions:
  contents: write

jobs:
  compose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compose Manistee page-one treatment
        run: node scripts/run-manistee-composer.mjs
