name: Agent branch verification

on:
  push:
    branches:
      - 'agent/**'
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm ci
      - name: Diagnostic beaches
        run: npm run benchmark:beaches
      - name: Diagnostic beach CTR
        run: npm run benchmark:beach-ctr
      - name: Diagnostic border CTR
        run: npm run benchmark:border-ctr
      - name: Diagnostic growth
        run: npm run benchmark:growth
      - name: Diagnostic SEO
        run: npm run benchmark:seo
      - name: Diagnostic SERP length
        run: npm run benchmark:serp-length
      - name: Diagnostic CTR
        run: npm run benchmark:ctr -- --check
      - name: Diagnostic search growth
        run: npm run benchmark:search-growth -- --check
      - name: Diagnostic search strategy
        run: npm run benchmark:search-strategy -- --check
      - name: Diagnostic search authority
        run: npm run benchmark:search-authority -- --check
      - name: Diagnostic outdoors growth
        run: npm run benchmark:outdoors-now-growth -- --check
      - name: Run full repository gate
        run: npm run verify:all
      - name: Upload boat launch source audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boat-launch-source-audit
          path: artifacts/boat-launch-source-audit.json
          if-no-files-found: ignore
          retention-days: 7
