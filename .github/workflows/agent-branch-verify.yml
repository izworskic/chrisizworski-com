name: Agent branch verification

on:
  push:
    branches:
      - 'agent/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  source-diagnostic:
    name: Diagnose source verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run source verifier and expose failure
        shell: bash
        run: |
          set +e
          npm run verify > /tmp/source-verify.log 2>&1
          code=$?
          while IFS= read -r line; do
            safe=${line//'%'/'%25'}
            safe=${safe//$'\r'/'%0D'}
            safe=${safe//$'\n'/'%0A'}
            echo "::error title=source-verify::$safe"
          done < <(tail -n 45 /tmp/source-verify.log)
          exit "$code"
