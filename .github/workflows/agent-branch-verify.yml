name: Agent branch verification

on:
  push:
    branches:
      - 'agent/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Core source and tests
        run: npm test && npm run verify
      - name: Search and growth gates
        run: npm run benchmark:beaches && npm run benchmark:beach-ctr && npm run benchmark:border-ctr && npm run benchmark:growth && npm run benchmark:seo && npm run benchmark:serp-length && npm run benchmark:ctr -- --check && npm run benchmark:search-growth -- --check && npm run benchmark:search-strategy -- --check && npm run benchmark:search-authority -- --check && npm run benchmark:outdoors-now-growth -- --check && npm run benchmark:mackinac-toll-ctr && npm run benchmark:trip-stack -- --check && npm run benchmark:tool-network -- --check
      - name: Seasonal and citation gates
        run: npm run benchmark:circle-tour && npm run benchmark:entity -- --check && npm run benchmark:winter -- --check && npm run benchmark:winter-flow -- --check && npm run benchmark:winter-final -- --check && npm run freshness -- --check && npm run benchmark:citation -- --check
      - name: Decision and map gates
        run: npm run benchmark:decision-network && npm run benchmark:map-insights && npm run benchmark:boat-launches && npm run audit:boat-launch-source && npm run benchmark:boat-launches-v3 && npm run benchmark:boat-launch-search && npm run benchmark:manistee && npm run benchmark:manistee-parity && npm run benchmark:manistee-popups && npm run benchmark:manistee-ux && npm run benchmark:au-sable-search
      - name: Rank gates A
        run: npm run benchmark:manistee-page-one -- --check && npm run benchmark:fall-aurora-ctr -- --check && npm run benchmark:up-fall-rank -- --check
      - name: Rank gates B
        run: npm run benchmark:fall-weekend-planner-ctr -- --check && npm run benchmark:beach-detail-ctr -- --check && npm run benchmark:garden-page-one-ctr -- --check
      - name: Entity and circle routing gates
        run: npm run benchmark:entity-discovery-ctr -- --check && npm run benchmark:circle-tour-rank -- --check && npm run benchmark:extracted-routing
      - name: National routing and indexing gates
        run: npm run benchmark:gauley-routing && npm run benchmark:tool-entities && npm run benchmark:white-christmas-indexing
      - name: Upload boat launch source audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boat-launch-source-audit
          path: artifacts/boat-launch-source-audit.json
          if-no-files-found: ignore
          retention-days: 7
