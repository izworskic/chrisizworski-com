name: Agent branch verification

on:
  push:
    branches:
      - 'agent/**'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply winter persona routing
        run: node scripts/apply-winter-persona-flow.mjs
      - name: Synchronize freshness
        run: node scripts/stamp-freshness.mjs
      - name: Remove migration helper and restore normal workflow
        run: |
          rm scripts/apply-winter-persona-flow.mjs
          git show origin/main:.github/workflows/agent-branch-verify.yml > .github/workflows/agent-branch-verify.yml
      - name: Run full repository gate
        run: npm run verify:all
      - name: Commit finished routing layer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Tie winter tools together around visitor intent"
          git push origin HEAD:agent/winter-persona-flow
