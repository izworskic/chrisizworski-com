name: Agent branch verification

on:
  push:
    branches:
      - 'agent/**'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    if: "!contains(github.event.head_commit.message, '[fall-search-lift-applied]')"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fall-search-lift-2026-08-21
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply deterministic Fall search patch
        run: node scripts/apply-fall-search-lift.mjs
      - name: Respect active Fall snippet measurement lock
        run: node scripts/repair-fall-search-lift-lock.mjs
      - name: Verify intended diff is clean
        run: git diff --check
      - name: Run full repository gate
        run: npm run verify:all
      - name: Commit tested Fall search lift and restore normal verification
        run: |
          git show 90ba873066e6d75f0d022922a9b127f084672295:.github/workflows/agent-branch-verify.yml > .github/workflows/agent-branch-verify.yml
          rm scripts/apply-fall-search-lift.mjs scripts/repair-fall-search-lift-lock.mjs .github/workflows/apply-fall-search-lift.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/fall-color/index.html public/sitemap.xml benchmarks/ctr-surface-baseline.json scripts/benchmark-ctr-surface.mjs tests/fall-search-lift.test.js .github/workflows/agent-branch-verify.yml
          git add -u scripts/apply-fall-search-lift.mjs scripts/repair-fall-search-lift-lock.mjs .github/workflows/apply-fall-search-lift.yml
          git diff --cached --check
          git commit -m "Lift Fall Color search capture [fall-search-lift-applied]"
          git push origin HEAD:${GITHUB_REF_NAME}
