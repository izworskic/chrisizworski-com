name: Agent branch verification

on:
  push:
    branches:
      - 'agent/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run full repository gate
        shell: bash
        run: |
          set -o pipefail
          npm run verify:all 2>&1 | tee verify-all.log
          exit ${PIPESTATUS[0]}
      - name: Upload verify output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-all-output
          path: verify-all.log
          if-no-files-found: error
          retention-days: 1
      - name: Upload boat launch source audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boat-launch-source-audit
          path: artifacts/boat-launch-source-audit.json
          if-no-files-found: ignore
          retention-days: 7
