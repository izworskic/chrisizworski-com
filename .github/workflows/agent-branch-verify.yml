name: Agent branch verification

on:
  push:
    branches:
      - 'agent/winter-persona-flow'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/winter-persona-flow
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Synchronize page and sitemap freshness
        run: node scripts/stamp-freshness.mjs
      - name: Restore normal verification workflow
        run: git show origin/main:.github/workflows/agent-branch-verify.yml > .github/workflows/agent-branch-verify.yml
      - name: Run full repository gate
        run: npm run verify:all
      - name: Commit freshness repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Align winter persona flow freshness signals"
          git pull --rebase origin agent/winter-persona-flow
          git push origin HEAD:agent/winter-persona-flow
