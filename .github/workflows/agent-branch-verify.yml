name: Agent branch verification

on:
  push:
    branches:
      - 'agent/**'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/winter-persona-flow
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repin intended reputation sitemap freshness change
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/verify-source.mjs')
          s = p.read_text()
          old = '["/sitemap-reputation.xml", "be4c8974c0ee20a15468fa9104c1878e45ef247b05b29167e23b9683026dfcaa"]'
          new = '["/sitemap-reputation.xml", "0f0a50000acf94905459dc22752b260b1b11ca8005eb18e7c2215834a6e640d9"]'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one old pin, found {s.count(old)}')
          p.write_text(s.replace(old, new))
          PY
      - name: Restore standard workflow
        run: git show origin/main:.github/workflows/agent-branch-verify.yml > .github/workflows/agent-branch-verify.yml
      - name: Run full repository gate
        run: npm run verify:all
      - name: Commit exact repin
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-source.mjs .github/workflows/agent-branch-verify.yml
          git commit -m "Repin reputation sitemap after homepage freshness update"
          git pull --rebase origin agent/winter-persona-flow
          git push origin HEAD:agent/winter-persona-flow
