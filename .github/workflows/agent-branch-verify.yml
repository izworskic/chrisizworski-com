name: Agent branch verification

on:
  push:
    branches:
      - 'agent/**'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Kilauea gate fixes and restore workflow
        env:
          PATCH_B64: 