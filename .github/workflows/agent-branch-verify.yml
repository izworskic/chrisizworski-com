name: Agent branch verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

  workflow_dispatch:

# A branch push and its pull request must not build the same revision twice.
# Cancel obsolete runs when another commit reaches the same branch.
concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Report baseline tool network
        run: npm run report:tool-network
      - name: Run full repository gate
        run: npm run verify:all
      - name: Build production output and audit emitted tool pages
        run: npm run profile:build -- build-profile.json
      - name: Retain per-stage build timing
        uses: actions/upload-artifact@v4
        with:
          name: build-profile
          path: build-profile.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload boat launch source audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boat-launch-source-audit
          path: artifacts/boat-launch-source-audit.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Package verified site output for the public audit
        run: tar -czf verified-site-output.tar.gz public benchmarks/tool-network-registry.json
      - uses: actions/upload-artifact@v4
        with:
          name: verified-site-output
          path: verified-site-output.tar.gz
          if-no-files-found: error
          retention-days: 1

  public-audit:
    needs: verify
    uses: ./.github/workflows/tool-authority-live-audit.yml
    with:
      build-artifact: verified-site-output


  michigan-ski-browser-qa:
    needs: verify
    if: github.event_name == 'pull_request' && (github.head_ref == 'feat/michigan-ski-official-open-today' || github.head_ref == 'fix/michigan-ski-evidence-first-status' || github.head_ref == 'experience/michigan-ski-decision-and-quality-20261124' || github.head_ref == 'experience/michigan-ski-map-carousel-dedup-20261124' || github.head_ref == 'fix/ski-operator-status-evidence')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Playwright runtime
        run: |
          mkdir -p /tmp/michigan-ski-playwright
          npm install --prefix /tmp/michigan-ski-playwright --no-save --ignore-scripts playwright@1.58.2
          echo "NODE_PATH=/tmp/michigan-ski-playwright/node_modules" >> "$GITHUB_ENV"
          echo "CHROME_PATH=$(command -v google-chrome || command -v chromium-browser || command -v chromium)" >> "$GITHUB_ENV"
      - name: Generate Michigan ski pages and run 360px/1440px browser acceptance
        run: |
          node scripts/generate-michigan-ski-pages.mjs
          node scripts/verify-michigan-ski-browser.cjs
      - name: Retain ski viewport, operator failure, and no-JS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: michigan-ski-browser-qa
          path: artifacts/michigan-ski/
          retention-days: 7
          if-no-files-found: warn

  lspp-browser-qa:
    needs: verify
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/lake-superior-provincial-park-explorer-20261026'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Playwright
        run: |
          mkdir -p /tmp/lspp-playwright
          npm install --prefix /tmp/lspp-playwright --no-save --ignore-scripts playwright@1.58.2
          echo "NODE_PATH=/tmp/lspp-playwright/node_modules" >> "$GITHUB_ENV"
          echo "CHROME_PATH=$(command -v google-chrome || command -v chromium-browser)" >> "$GITHUB_ENV"
      - name: Verify Lake Superior Provincial Park map, photos and planner in Chromium
        run: node scripts/verify-lspp-browser.cjs
      - name: Save viewport and map screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lake-superior-park-qa
          path: artifacts/lspp/
          retention-days: 7
          if-no-files-found: warn

  duluth-product-pilot-qa:
    if: github.event_name == 'pull_request' && (github.head_ref == 'experience/duluth-product-engineering-pilot-20261124' || github.head_ref == 'fix/duluth-watch-failed-refresh-evidence' || github.head_ref == 'agent/great-lakes-historical-passage-library-20261124')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test dependencies
        run: |
          npm install --prefix /tmp/duluth-pilot-qa --no-save --ignore-scripts --package-lock=false playwright@1.58.2 leaflet@1.9.4
          echo "NODE_PATH=/tmp/duluth-pilot-qa/node_modules" >> "$GITHUB_ENV"
          echo "CHROME_PATH=$(command -v google-chrome || command -v chromium-browser || command -v chromium)" >> "$GITHUB_ENV"
      - name: Verify shared change engine and Duluth adapter
        run: node --test tests/soo-changing-conditions.test.js tests/soo-visit-memory.test.js tests/duluth-canal.test.js tests/duluth-changing-conditions.test.js
      - name: Verify actual Duluth map with deterministic vessel fixtures
        run: node scripts/verify-duluth-product-pilot.cjs
      - name: Retain map screenshots and acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duluth-product-pilot-qa
          path: artifacts/duluth-pilot/
          retention-days: 7
          if-no-files-found: warn

  aurora-recovery-browser-qa:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/aurora-independent-source-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Playwright runtime
        run: |
          npm install --prefix /tmp/aurora-recovery-qa --no-save --ignore-scripts --package-lock=false playwright@1.58.2
          echo "NODE_PATH=/tmp/aurora-recovery-qa/node_modules" >> "$GITHUB_ENV"
          echo "CHROME_PATH=$(command -v google-chrome || command -v chromium-browser || command -v chromium)" >> "$GITHUB_ENV"
      - name: Replay actual Aurora page with source outage and recovery fixtures
        run: node scripts/verify-aurora-recovery-browser.cjs
      - name: Retain viewport screenshots and recovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurora-recovery-browser-qa
          path: artifacts/aurora-recovery/
          retention-days: 7
          if-no-files-found: warn
