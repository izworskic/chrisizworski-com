name: Agent branch verification

on:
  push:
    branches:
      - 'agent/**'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/winter-engine-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Align XC wording with the anti-claim guardrail
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const files = [
            ['public/michigan-cross-country-skiing/index.html', 'It does not claim any trail is groomed today.', "It does not report today's grooming status."],
            ['tests/winter-engine-v2.test.js', '/does not claim any trail is groomed today/i', "/does not report today's grooming status/i"],
          ];
          for (const [file, before, after] of files) {
            const source = readFileSync(file, 'utf8');
            if (!source.includes(before)) throw new Error(`missing exact marker in ${file}`);
            writeFileSync(file, source.replace(before, after));
          }
          NODE
      - name: Synchronize page and sitemap freshness
        run: node scripts/stamp-freshness.mjs
      - name: Restore normal agent verification workflow
        run: git show origin/main:.github/workflows/agent-branch-verify.yml > .github/workflows/agent-branch-verify.yml
      - name: Commit the consistency repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Align winter freshness and claim guardrails"
          git push origin HEAD:agent/winter-engine-v2
