name: Agent branch verification

on:
  push:
    branches:
      - 'agent/**'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/winter-engine-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply winter source migration
        run: node scripts/apply-winter-engine-v2.mjs
      - name: Regenerate Michigan Ice
        run: npm run generate:ice
      - name: Restore normal workflow and remove one-shot files
        run: |
          git show origin/main:.github/workflows/agent-branch-verify.yml > .github/workflows/agent-branch-verify.yml
          rm -f .github/workflows/winter-engine-regenerate.yml scripts/apply-winter-engine-v2.mjs
      - name: Commit generated winter build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Build winter Ice and XC decision upgrades"
          git push origin HEAD:agent/winter-engine-v2
