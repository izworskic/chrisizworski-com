# Temporary freshness repair + diagnostic capture for repository-gate repair; remove before merge.
name: Agent branch verification

on:
  push:
    branches:
      - 'agent/**'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconcile page and sitemap freshness
        shell: bash
        run: |
          node scripts/stamp-freshness.mjs
          if ! git diff --quiet -- public; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public
            git commit -m "Reconcile page and sitemap freshness"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi
      - name: Run full repository gate
        shell: bash
        run: |
          mkdir -p artifacts
          set -o pipefail
          npm run verify:all 2>&1 | tee artifacts/verify-all.log
      - name: Upload full verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-all-log
          path: artifacts/verify-all.log
          if-no-files-found: error
          retention-days: 1
      - name: Upload boat launch source audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boat-launch-source-audit
          path: artifacts/boat-launch-source-audit.json
          if-no-files-found: ignore
          retention-days: 7
