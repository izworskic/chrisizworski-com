name: Agent branch verification

on:
  push:
    branches:
      - 'agent/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Diagnose 1 - Node tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test

  source:
    name: Diagnose 2 - Source verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run verify

  discovery:
    name: Diagnose 3 - Discovery benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm run benchmark:beaches
          npm run benchmark:beach-ctr
          npm run benchmark:border-ctr
          npm run benchmark:growth
          npm run benchmark:seo
          npm run benchmark:serp-length
          npm run benchmark:ctr -- --check

  search:
    name: Diagnose 4 - Search benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm run benchmark:search-growth -- --check
          npm run benchmark:search-strategy -- --check
          npm run benchmark:search-authority -- --check
          npm run benchmark:outdoors-now-growth -- --check
          npm run benchmark:mackinac-toll-ctr
          npm run benchmark:trip-stack -- --check
          npm run benchmark:tool-network -- --check
          npm run benchmark:circle-tour
          npm run benchmark:entity -- --check

  seasonal:
    name: Diagnose 5 - Seasonal and citation benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm run benchmark:winter -- --check
          npm run benchmark:winter-flow -- --check
          npm run benchmark:winter-final -- --check
          npm run freshness -- --check
          npm run benchmark:citation -- --check
          npm run benchmark:decision-network
          npm run benchmark:map-insights

  water:
    name: Diagnose 6 - Water and map benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm run benchmark:boat-launches
          npm run audit:boat-launch-source
          npm run benchmark:boat-launches-v3
          npm run benchmark:boat-launch-search
          npm run benchmark:manistee
          npm run benchmark:manistee-parity
          npm run benchmark:manistee-popups
          npm run benchmark:manistee-ux
          npm run benchmark:au-sable-search
          npm run benchmark:manistee-page-one -- --check
      - name: Upload boat launch source audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boat-launch-source-audit
          path: artifacts/boat-launch-source-audit.json
          if-no-files-found: ignore
          retention-days: 7

  seo-routing:
    name: Diagnose 7 - SEO and routing benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm run benchmark:fall-aurora-ctr -- --check
          npm run benchmark:up-fall-rank -- --check
          npm run benchmark:fall-weekend-planner-ctr -- --check
          npm run benchmark:beach-detail-ctr -- --check
          npm run benchmark:garden-page-one-ctr -- --check
          npm run benchmark:entity-discovery-ctr -- --check
          npm run benchmark:circle-tour-rank -- --check
          npm run benchmark:extracted-routing
          npm run benchmark:gauley-routing
          npm run benchmark:tool-entities
          npm run benchmark:white-christmas-indexing

  platform:
    name: Diagnose 8 - Platform benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm run benchmark:mackinac-hub
          npm run benchmark:mackinac-platform
          npm run benchmark:snowmobile
