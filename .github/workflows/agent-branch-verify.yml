name: Agent branch verification

on:
  push:
    branches:
      - 'agent/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  source-diagnostic:
    name: Diagnose source verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run source verifier
        id: verify_source
        shell: bash
        run: |
          set +e
          npm run verify > source-verify.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload source verifier output
        uses: actions/upload-artifact@v4
        with:
          name: source-verify-log
          path: source-verify.log
          retention-days: 1
      - name: Preserve verifier result
        shell: bash
        run: exit "${{ steps.verify_source.outputs.exit_code }}"
