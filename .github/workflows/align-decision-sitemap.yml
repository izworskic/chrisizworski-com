name: Align decision page sitemap freshness
on:
  push:
    branches: [agent/decision-network-boat-shipwreck]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/decision-network-boat-shipwreck
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/align-decision-sitemap.mjs
      - run: rm scripts/align-decision-sitemap.mjs .github/workflows/align-decision-sitemap.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Align sitemap freshness for growth pages"
          git push origin HEAD:agent/decision-network-boat-shipwreck
