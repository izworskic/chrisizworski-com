name: Validate Mackinac JEV platform

on:
  push:
    branches:
      - 'feature/mackinac-jev-platform-v2'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: npm run vercel-build
