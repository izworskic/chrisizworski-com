name: Build national USGS river index
on:
  push:
    branches:
      - fix/national-rivers-local-index
    paths:
      - .github/workflows/build-national-river-index.yml
permissions:
  contents: write
jobs:
  build-index:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/national-rivers-local-index
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate active USGS streamflow index
        run: node scripts/generate-national-usgs-streamflow-index.mjs
      - name: Commit generated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/national-usgs-streamflow-sites.json
          git commit -m "Generate national USGS streamflow site index"
          git push origin HEAD:fix/national-rivers-local-index
# retry after empty-state handling
