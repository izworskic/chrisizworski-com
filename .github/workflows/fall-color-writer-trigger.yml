name: Trigger fall color writer end-to-end test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fall-color-writer-test.yml"
      - ".github/workflows/fall-color-writer-trigger.yml"
      - "lib/fall-color/github-actions-oidc.js"
      - "lib/fall-color/routes/cron.js"

permissions:
  contents: read
  id-token: write

jobs:
  test-production-writer:
    # Do not race today's paid seed with the legacy deterministic test writer.
    if: ${{ !contains(github.event.head_commit.message, '[fall-color-one-time-seed]') }}
    uses: ./.github/workflows/fall-color-writer-test.yml
    permissions:
      contents: read
      id-token: write
