# Old Redis writer smoke workflow: keep an explicit manual repair/retry control,
# but no longer auto-run the retired Redis path on push.
name: Manual fall color GitHub publisher

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: fall-color-github-daily-writer
  cancel-in-progress: false

jobs:
  publish:
    uses: ./.github/workflows/fall-color-writer-test.yml
    with:
      publish_github: true
    permissions:
      contents: write
      id-token: write
