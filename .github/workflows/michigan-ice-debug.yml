name: Michigan Ice branch diagnostics

on:
  push:
    branches:
      - 'agent/michigan-ice-breakout-20260930'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'agent/michigan-ice-breakout-20260930' || github.ref_name == 'agent/michigan-ice-breakout-20260930'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm ci
      - name: Michigan ice regression contract
        run: node --test tests/michigan-ice-breakout.test.js
      - name: Existing API contract
        continue-on-error: true
        run: node --test tests/api-contract.test.js
      - name: Existing factual integrity contract
        continue-on-error: true
        run: node --test tests/factual-growth-integrity.test.js
      - name: Test shard 1
        continue-on-error: true
        shell: bash
        run: |
          files=(tests/*.test.js)
          (( ${#files[@]} > 0 )) && node --test "${files[@]:0:30}"
      - name: Test shard 2
        continue-on-error: true
        shell: bash
        run: |
          files=(tests/*.test.js)
          (( ${#files[@]} > 30 )) && node --test "${files[@]:30:30}" || true
      - name: Test shard 3
        continue-on-error: true
        shell: bash
        run: |
          files=(tests/*.test.js)
          (( ${#files[@]} > 60 )) && node --test "${files[@]:60:30}" || true
      - name: Test shard 4
        continue-on-error: true
        shell: bash
        run: |
          files=(tests/*.test.js)
          (( ${#files[@]} > 90 )) && node --test "${files[@]:90:30}" || true
      - name: Test shard 5
        continue-on-error: true
        shell: bash
        run: |
          files=(tests/*.test.js)
          (( ${#files[@]} > 120 )) && node --test "${files[@]:120}" || true
      - name: Source parity verification
        continue-on-error: true
        run: npm run verify
