name: NYC Python historical departure evidence
on:
  schedule:
    - cron: '19 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: nyc-python-departure-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Audit dated official toll fixtures against production math
        run: python3 scripts/nyc_departure_intelligence.py audit-tolls

      - name: Record actual source health and independent holdout metrics
        run: |
          mkdir -p /tmp/nyc-science
          python3 scripts/nyc_departure_intelligence.py audit-live --report /tmp/nyc-science/latest.json

      - name: Retain scientific evidence when the model is unavailable
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nyc-source-health-and-holdout
          path: /tmp/nyc-science/*.json
          retention-days: 30
          if-no-files-found: warn

      - name: Fetch official NYC DOT daily-hourly aggregates and backtest
        run: python3 scripts/nyc_departure_intelligence.py fetch-build

      - name: Verify scientific integrity and runtime stale states
        run: |
          python3 -m unittest scripts/test_nyc_departure_intelligence.py -v
          node --test tests/nyc-departure-intelligence.test.js

      - name: Check for a validated model change
        id: change
        run: |
          if git diff --quiet -- lib/nyc-crossing/departure-intelligence.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the full repository gate before proposing an update
        if: steps.change.outputs.changed == 'true'
        run: |
          npm ci --ignore-scripts
          npm run verify:all

      - name: Create or refresh reviewable evidence PR; never push raw data straight to main
        if: steps.change.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="automation/nyc-departure-evidence"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add lib/nyc-crossing/departure-intelligence.json
          git commit -m "data: refresh backtested NYC DOT segment timing evidence"
          git push --force-with-lease origin "$branch"
          existing="$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            gh pr create --base main --head "$branch" \
              --title "data: fresh NYC DOT historical timing evidence" \
              --body "Official NYC DOT daily-hourly aggregates; 70-day training / independent 14-day holdout, sample/freshness gates. Full repo tests passed before PR creation. Review source age and CI before merging. No direct push to main."
          else
            echo "Updated existing NYC data PR #$existing"
          fi
