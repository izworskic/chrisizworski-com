name: One-time bias-corrected October holdout evaluation
on:
  pull_request:
    types: [opened]
    paths:
      - ".github/workflows/noaa-bias-corrected-october.yml"
permissions:
  contents: read
jobs:
  probe:
    if: github.head_ref == 'research/noaa-bias-corrected-october-evaluation-20261124' && github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        day: ["2024-10-01","2024-10-02","2024-10-03","2024-10-04","2024-10-05","2024-10-06","2024-10-07","2024-10-08","2024-10-09","2024-10-10"]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify fixed model and freeze before archive acquisition
        run: |
          node --test tests/great-lakes-crossing-detection.test.js tests/great-lakes-crossing-references.test.js tests/great-lakes-reference-retrospect.test.js tests/great-lakes-passage-replay.test.js tests/great-lakes-route-progress-challenger.test.js tests/great-lakes-arrival-window-research.test.js tests/great-lakes-arrival-window-study.test.js tests/great-lakes-arrival-window-holdout.test.js tests/great-lakes-bias-corrected-window.test.js
          node scripts/great-lakes-bias-corrected-window.cjs freeze docs/research/great-lakes-existing-model-development-evidence.json docs/research/great-lakes-arrival-window-frozen.json "${RUNNER_TEMP}/bias-frozen.json"
          cat "${RUNNER_TEMP}/bias-frozen.json"
      - name: Install temporary pinned archive reader
        run: |
          python -m pip install --disable-pip-version-check --no-deps --only-binary=:all: pyarrow==21.0.0
      - name: Evaluate fixed midpoint correction on reserved date
        shell: bash
        env:
          STUDY_DAY: ${{ matrix.day }}
        run: |
          set -euo pipefail
          umask 077
          private_dir="$(mktemp -d)"
          trap 'rm -rf "$private_dir"' EXIT
          export PRIVATE_INPUT="$private_dir/observations.json"
          export NOAA_REPORT="$private_dir/coverage.json"
          python scripts/noaa-public-only-reference-probe-20261124.py --self-test
          python scripts/noaa-public-only-reference-probe-20261124.py "$STUDY_DAY"
          node scripts/great-lakes-bias-corrected-window.cjs evaluate docs/research/great-lakes-existing-model-development-evidence.json docs/research/great-lakes-arrival-window-frozen.json "${RUNNER_TEMP}/bias-frozen.json" "$PRIVATE_INPUT" "${RUNNER_TEMP}/bias-day.json"
          cp "$NOAA_REPORT" "${RUNNER_TEMP}/bias-coverage.json"
          cat "${RUNNER_TEMP}/bias-day.json"
      - uses: actions/upload-artifact@v4
        with:
          name: bias-corrected-october-${{ matrix.day }}
          path: |
            ${{ runner.temp }}/bias-day.json
            ${{ runner.temp }}/bias-coverage.json
            ${{ runner.temp }}/bias-frozen.json
          if-no-files-found: error
          retention-days: 7
