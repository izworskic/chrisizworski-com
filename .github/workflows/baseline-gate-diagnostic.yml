name: Baseline gate diagnostic

on:
  push:
    branches:
      - fix/repository-gate-baseline-2026-09-24

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture verify-all output
        id: gate
        shell: bash
        run: |
          set +e
          npm run verify:all > verify-all.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: baseline-verify-all-log
          path: verify-all.log
          retention-days: 1
      - name: Preserve gate result
        run: exit "${{ steps.gate.outputs.exit_code }}"
