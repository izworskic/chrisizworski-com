name: Temporary fall weekend planner CTR composer

on:
  push:
    branches:
      - feat/fall-weekend-planner-ctr-2026-08-22

permissions:
  contents: write

jobs:
  compose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compose fall weekend planner CTR treatment
        run: node scripts/compose-fall-weekend-planner-ctr.mjs
