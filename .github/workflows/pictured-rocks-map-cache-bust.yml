name: Pictured Rocks map projection repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pictured-rocks-map-cache-bust.yml

permissions:
  contents: write

jobs:
  fix-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair CARTO map wrapping and regional bounds
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          js_path = Path('public/assets/pictured-rocks-planner-v3.js')
          js = js_path.read_text()

          old_map = "map=L.map(target,{scrollWheelZoom:false,zoomControl:true}).setView([46.54,-86.31],9);"
          new_map = "const parkBounds=L.latLngBounds([[45.75,-87.20],[47.15,-85.20]]);\n  map=L.map(target,{scrollWheelZoom:false,zoomControl:true,minZoom:8,maxBounds:parkBounds,maxBoundsViscosity:1,worldCopyJump:false}).setView([46.54,-86.31],9);"
          if old_map not in js:
              raise SystemExit('Expected Leaflet map initializer not found')
          js = js.replace(old_map, new_map, 1)

          old_tile = "const cartoLayer=L.tileLayer('https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png?key=cb1_2y8f_1_1ee5e3a872c91d0ebf5d7b88',{tileSize:256,zoomOffset:0,maxNativeZoom:20,maxZoom:20,updateWhenZooming:false,keepBuffer:3,attribution:'&copy; OpenStreetMap contributors &copy; CARTO'}).addTo(map);"
          new_tile = "const cartoLayer=L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png',{subdomains:'abcd',tileSize:256,zoomOffset:0,minZoom:8,maxNativeZoom:20,maxZoom:20,noWrap:true,bounds:parkBounds,updateWhenZooming:false,keepBuffer:3,attribution:'&copy; OpenStreetMap contributors &copy; CARTO'}).addTo(map);"
          if old_tile not in js:
              raise SystemExit('Expected current CARTO tile configuration not found')
          js = js.replace(old_tile, new_tile, 1)

          old_fallback = "L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);"
          new_fallback = "L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{minZoom:8,maxZoom:19,noWrap:true,bounds:parkBounds,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);"
          if old_fallback not in js:
              raise SystemExit('Expected OSM fallback configuration not found')
          js = js.replace(old_fallback, new_fallback, 1)

          old_fit = "if(all.length)map.fitBounds(all,{padding:[18,18]});"
          new_fit = "if(all.length){map.fitBounds(all,{padding:[18,18],maxZoom:10});setTimeout(()=>map.invalidateSize({pan:false}),0);}"
          if old_fit not in js:
              raise SystemExit('Expected map fitBounds line not found')
          js = js.replace(old_fit, new_fit, 1)

          js_path.write_text(js)

          html_path = Path('public/labs/pictured-rocks-planner/index.html')
          html = html_path.read_text()
          old_version = 'src="/assets/pictured-rocks-planner-v3.js?v=20260927-3"'
          new_version = 'src="/assets/pictured-rocks-planner-v3.js?v=20260927-4"'
          if old_version not in html:
              raise SystemExit('Expected current map runtime version not found')
          html = html.replace(old_version, new_version, 1)
          html_path.write_text(html)
          PY
      - name: Verify projection repair
        shell: bash
        run: |
          grep -Fq "noWrap:true" public/assets/pictured-rocks-planner-v3.js
          grep -Fq "maxBounds:parkBounds" public/assets/pictured-rocks-planner-v3.js
          grep -Fq "minZoom:8" public/assets/pictured-rocks-planner-v3.js
          grep -Fq "https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png" public/assets/pictured-rocks-planner-v3.js
          ! grep -Fq "cb1_2y8f_1_1ee5e3a872c91d0ebf5d7b88" public/assets/pictured-rocks-planner-v3.js
          grep -Fq 'pictured-rocks-planner-v3.js?v=20260927-4' public/labs/pictured-rocks-planner/index.html
      - name: Commit projection repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/pictured-rocks-planner-v3.js public/labs/pictured-rocks-planner/index.html
          git commit -m "Repair Pictured Rocks map wrapping and bounds"
          git push origin HEAD:main
