name: Pictured Rocks map cache bust

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pictured-rocks-map-cache-bust.yml

permissions:
  contents: write

jobs:
  cache-bust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version Pictured Rocks map runtime
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/labs/pictured-rocks-planner/index.html')
          s=p.read_text()
          old='src="/assets/pictured-rocks-planner-v3.js"'
          new='src="/assets/pictured-rocks-planner-v3.js?v=20260927-2"'
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('Expected Pictured Rocks runtime script tag not found')
          p.write_text(s)
          PY
      - name: Commit cache bust
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/labs/pictured-rocks-planner/index.html
          if git diff --cached --quiet; then
            echo "Already versioned"
            exit 0
          fi
          git commit -m "Bust Pictured Rocks map runtime cache"
          git push origin HEAD:main
