name: Pictured Rocks map final render fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pictured-rocks-map-cache-bust.yml

permissions:
  contents: write

jobs:
  fix-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix CARTO tiles and expose park locations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          js_path = Path('public/assets/pictured-rocks-planner-v3.js')
          js = js_path.read_text()

          old_tile = "const cartoLayer=L.tileLayer('https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png?key=cb1_2y8f_1_1ee5e3a872c91d0ebf5d7b88',{maxZoom:20,attribution:'&copy; OpenStreetMap contributors &copy; CARTO'}).addTo(map);"
          new_tile = "const cartoLayer=L.tileLayer('https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png?key=cb1_2y8f_1_1ee5e3a872c91d0ebf5d7b88',{tileSize:256,zoomOffset:0,maxNativeZoom:20,maxZoom:20,updateWhenZooming:false,keepBuffer:3,attribution:'&copy; OpenStreetMap contributors &copy; CARTO'}).addTo(map);"
          if old_tile not in js:
              raise SystemExit('Expected CARTO tile configuration not found')
          js = js.replace(old_tile, new_tile, 1)

          old_map = "map=L.map(target,{scrollWheelZoom:false,zoomControl:true}).setView([46.54,-86.31],9);"
          new_map = "map=L.map(target,{scrollWheelZoom:false,zoomControl:true}).setView([46.54,-86.31],9);\n  if(!document.getElementById('parkMapLabelStyles')){const st=document.createElement('style');st.id='parkMapLabelStyles';st.textContent='.leaflet-tooltip.park-place-label{background:rgba(255,255,255,.96);border:1px solid rgba(22,39,42,.22);border-radius:5px;box-shadow:0 1px 4px rgba(0,0,0,.15);color:#173236;font:700 11px/1.2 Inter,system-ui,sans-serif;padding:4px 6px;white-space:nowrap}.leaflet-tooltip-top.park-place-label:before{border-top-color:rgba(255,255,255,.96)}';document.head.appendChild(st);}"
          if old_map not in js:
              raise SystemExit('Expected Leaflet map initializer not found')
          js = js.replace(old_map, new_map, 1)

          old_marker_style = "return {radius:selected?9:6,color:'#fff',weight:2,fillColor:colors[side]||'#536568',fillOpacity:selected?1:.86};"
          new_marker_style = "return {radius:selected?10:7,color:'#fff',weight:3,fillColor:colors[side]||'#536568',fillOpacity:selected?1:.92};"
          if old_marker_style not in js:
              raise SystemExit('Expected marker style not found')
          js = js.replace(old_marker_style, new_marker_style, 1)

          old_marker = "m.bindPopup(`<strong>${esc(p.title)}</strong><br>${esc(p.effort)}<br><span>${esc(p.why)}</span>`);\n    markers[id]=m;"
          new_marker = "m.bindPopup(`<strong>${esc(p.title)}</strong><br>${esc(p.effort)}<br><span>${esc(p.why)}</span>`);\n    m.bindTooltip(esc(p.title),{permanent:true,direction:'top',offset:[0,-8],opacity:.96,className:'park-place-label'});\n    markers[id]=m;"
          if old_marker not in js:
              raise SystemExit('Expected marker block not found')
          js = js.replace(old_marker, new_marker, 1)
          js_path.write_text(js)

          html_path = Path('public/labs/pictured-rocks-planner/index.html')
          html = html_path.read_text()
          old_version = 'src="/assets/pictured-rocks-planner-v3.js?v=20260927-2"'
          new_version = 'src="/assets/pictured-rocks-planner-v3.js?v=20260927-3"'
          if old_version not in html:
              raise SystemExit('Expected map runtime version not found')
          html = html.replace(old_version, new_version, 1)
          html_path.write_text(html)
          PY
      - name: Verify map patch
        shell: bash
        run: |
          grep -Fq '/voyager/{z}/{x}/{y}.png?key=' public/assets/pictured-rocks-planner-v3.js
          grep -Fq "bindTooltip(esc(p.title)" public/assets/pictured-rocks-planner-v3.js
          grep -Fq 'pictured-rocks-planner-v3.js?v=20260927-3' public/labs/pictured-rocks-planner/index.html
      - name: Commit final map fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/pictured-rocks-planner-v3.js public/labs/pictured-rocks-planner/index.html
          git commit -m "Fix Pictured Rocks map tiles and show location labels"
          git push origin HEAD:main
