name: Blue Ridge stop budget hotfix

on:
  push:
    branches:
      - fix/blue-ridge-stop-budget

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/blue-ridge-stop-budget
          fetch-depth: 0
      - name: Fix point-to-point activity and stop budget logic
        shell: python
        run: |
          from pathlib import Path

          engine = Path('lib/blue-ridge-parkway/point-to-point.js')
          s = engine.read_text()
          old = 'const interests=[...new Set(raw.split(",").map(x=>x.trim()).filter(x=>allowed.has(x)))].slice(0,4);if(!interests.length)interests.push("scenery");'
          new = 'const interests=[...new Set(raw.split(",").map(x=>x.trim()).filter(x=>allowed.has(x)))];if(!interests.length)interests.push("scenery");'
          assert old in s
          s = s.replace(old, new, 1)
          old = 'function buildCandidates(input){\n  const start=GATEWAYS[input.gateway],finish=GATEWAYS[input.finish],driveMinutes=Math.abs(finish.milepost-start.milepost)/MODELED_PARKWAY_MPH*60+15,spare=Math.max(0,input.hours*60-driveMinutes),pool=corridorStops(input.gateway,input.finish);'
          new = 'function nonstopMinutes(input){const start=GATEWAYS[input.gateway],finish=GATEWAYS[input.finish];return Math.abs(finish.milepost-start.milepost)/MODELED_PARKWAY_MPH*60+15;}\nfunction buildCandidates(input){\n  const driveMinutes=nonstopMinutes(input),spare=Math.max(0,input.hours*60-driveMinutes),pool=corridorStops(input.gateway,input.finish);'
          assert old in s
          s = s.replace(old, new, 1)
          old = 'function serialize(item,input,editorial,roadOk){const start=GATEWAYS[input.gateway],finish=GATEWAYS[input.finish],timeline=routeTimeline(item.route,item.stops,input,item.durationHours),outlook=T.viewOutlook(item.weather);return{id:item.route.id,name:item.route.name,tripMode:"point-to-point",roadSourceOk:roadOk,fit:item.fit,score:item.score,durationHours:item.durationHours,routeMiles:routeMiles(item.route),mileStart:item.route.startMile,mileTurn:item.route.turnMile,finishLabel:finish.label,'
          new = 'function serialize(item,input,editorial,roadOk){const start=GATEWAYS[input.gateway],finish=GATEWAYS[input.finish],timeline=routeTimeline(item.route,item.stops,input,item.durationHours),outlook=T.viewOutlook(item.weather),nonstop=round(nonstopMinutes(input)/60,1),stopBudget=Math.max(0,Math.round(input.hours*60-nonstopMinutes(input)));return{id:item.route.id,name:item.route.name,tripMode:"point-to-point",roadSourceOk:roadOk,fit:item.fit,score:item.score,durationHours:item.durationHours,routeMiles:routeMiles(item.route),nonstopHours:nonstop,stopBudgetMinutes:stopBudget,mileStart:item.route.startMile,mileTurn:item.route.turnMile,finishLabel:finish.label,'
          assert old in s
          s = s.replace(old, new, 1)
          old = 'module.exports._test={normalizeInput,corridorStops,stopValue,chooseStops,corridorRoute,routeMiles,modeledDuration,buildCandidates,routeScore,fitLabel};'
          new = 'module.exports._test={normalizeInput,corridorStops,stopValue,chooseStops,corridorRoute,routeMiles,modeledDuration,nonstopMinutes,buildCandidates,routeScore,fitLabel};'
          assert old in s
          s = s.replace(old, new, 1)
          engine.write_text(s)

          ui = Path('public/assets/blue-ridge-parkway.js')
          s = ui.read_text()
          old = '  const gatewayOptions=[\n    ["asheville","Asheville"],["boone","Boone / Blowing Rock"],["roanoke","Roanoke"],["floyd","Floyd / Meadows of Dan"],["afton","Afton / Waynesboro"],["cherokee","Cherokee"]\n  ];'
          new = '  const gatewayOptions=[\n    ["asheville","Asheville"],["boone","Boone / Blowing Rock"],["roanoke","Roanoke"],["floyd","Floyd / Meadows of Dan"],["afton","Afton / Waynesboro"],["cherokee","Cherokee"]\n  ];\n  const gatewayMileposts={asheville:384.1,boone:290.8,roanoke:121.4,floyd:167.2,afton:0,cherokee:469.1};'
          assert old in s
          s = s.replace(old, new, 1)
          old = '  function syncHours(){const finish=$("finish")?.value||"return",hours=$("hours");if(!hours)return;const long=[10,12,14,16];for(const n of long){let option=[...hours.options].find(o=>o.value===String(n));if(finish!=="return"&&!option){option=document.createElement("option");option.value=String(n);option.textContent=`${n} hours`;hours.appendChild(option);}else if(finish==="return"&&option){if(hours.value===String(n))hours.value="8";option.remove();}}\n  }'
          new = '''  function corridorDriveHours(){const start=$("gateway")?.value,finish=$("finish")?.value;if(!start||!finish||finish==="return")return 0;return Math.abs(gatewayMileposts[finish]-gatewayMileposts[start])/32+.25;}\n  function renderCorridorBudget(){const note=$("corridorBudget"),finish=$("finish")?.value||"return";if(!note)return;if(finish==="return"){note.textContent="";return;}const drive=corridorDriveHours(),available=Number($("hours")?.value||0),stop=Math.max(0,available-drive);note.textContent=`Parkway drive alone: about ${drive.toFixed(1)} hr · sightseeing budget at ${available} hr: about ${stop.toFixed(1)} hr.`;}\n  function syncHours(autoFit=false){const finish=$("finish")?.value||"return",hours=$("hours");if(!hours)return;const long=[7,9,10,11,12,13,14,15,16];for(const n of long){let option=[...hours.options].find(o=>o.value===String(n));if(finish!=="return"&&!option){option=document.createElement("option");option.value=String(n);option.textContent=`${n} hours`;hours.appendChild(option);}else if(finish==="return"&&option){if(hours.value===String(n))hours.value="8";option.remove();}}if(finish!=="return"&&autoFit){const required=corridorDriveHours(),choices=[...hours.options].map(o=>Number(o.value)).filter(Number.isFinite).sort((a,b)=>a-b),current=Number(hours.value);if(current<required){const fit=choices.find(n=>n>=required);hours.value=String(fit||choices[choices.length-1]||16);}}renderCorridorBudget();\n  }'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '  function selectedInterests(){return [...document.querySelectorAll(\'input[name="interest"]:checked\')].map(el=>el.value).slice(0,4);}'
          new = '  function selectedInterests(){return [...document.querySelectorAll(\'input[name="interest"]:checked\')].map(el=>el.value);}'
          assert old in s
          s = s.replace(old, new, 1)
          old = '    const pointToPoint=plan.tripMode==="point-to-point",direction=plan.direction==="northbound"?"North on the Parkway":"South on the Parkway",routeLine=pointToPoint?`${direction} · finish ${esc(plan.finishLabel||payload.finishGateway?.label||"")} near ${fmtMile(plan.mileTurn)}`:`${direction} · turn around near ${fmtMile(plan.mileTurn)}`,timeLabel=pointToPoint?"Arrive about":"Back about",endLabel=pointToPoint?"Finish":"Turn point",endValue=pointToPoint?esc(plan.finishLabel||payload.finishGateway?.label||"—"):fmtMile(plan.mileTurn);'
          new = '    const pointToPoint=plan.tripMode==="point-to-point",direction=plan.direction==="northbound"?"North on the Parkway":"South on the Parkway",routeLine=pointToPoint?`${direction} · finish ${esc(plan.finishLabel||payload.finishGateway?.label||"")} near ${fmtMile(plan.mileTurn)}`:`${direction} · turn around near ${fmtMile(plan.mileTurn)}`,timeLabel=pointToPoint?"Arrive about":"Back about",endLabel=pointToPoint?"Stop budget":"Turn point",endValue=pointToPoint?`${Math.round(Number(plan.stopBudgetMinutes)||0)} min`:fmtMile(plan.mileTurn);'
          assert old in s
          s = s.replace(old, new, 1)
          old = '$("gateway")?.addEventListener("change",()=>{syncFinishOptions();track("blue_ridge_gateway_change",{gateway:$("gateway").value});});$("finish")?.addEventListener("change",()=>{syncHours();track("blue_ridge_finish_change",{gateway:$("gateway").value,finish:$("finish").value});});'
          new = '$("gateway")?.addEventListener("change",()=>{syncFinishOptions();syncHours(true);track("blue_ridge_gateway_change",{gateway:$("gateway").value});});$("finish")?.addEventListener("change",()=>{syncHours(true);track("blue_ridge_finish_change",{gateway:$("gateway").value,finish:$("finish").value});});$("hours")?.addEventListener("change",renderCorridorBudget);'
          assert old in s
          s = s.replace(old, new, 1)
          old = 'document.querySelectorAll(".quick-gateway").forEach(btn=>btn.addEventListener("click",()=>{$("gateway").value=btn.dataset.gateway;syncFinishOptions();track("blue_ridge_gateway_change",{gateway:btn.dataset.gateway,method:"quick"});build();}));'
          new = 'document.querySelectorAll(".quick-gateway").forEach(btn=>btn.addEventListener("click",()=>{$("gateway").value=btn.dataset.gateway;syncFinishOptions();syncHours(true);track("blue_ridge_gateway_change",{gateway:btn.dataset.gateway,method:"quick"});build();}));'
          assert old in s
          s = s.replace(old, new, 1)
          ui.write_text(s)

          html = Path('public/blue-ridge-parkway/index.html')
          s = html.read_text()
          old = '      </div>\n      <div class="interests"><span class="interest-label">What should earn the stops?</span>'
          new = '      </div>\n      <div id="corridorBudget" class="planner-status" style="margin-top:8px" aria-live="polite"></div>\n      <div class="interests"><span class="interest-label">What should earn the stops?</span>'
          assert old in s
          s = s.replace(old, new, 1)
          s = s.replace('/assets/blue-ridge-parkway.js?v=20260924-2','/assets/blue-ridge-parkway.js?v=20260925-3',1)
          html.write_text(s)

          test = Path('tests/blue-ridge-parkway-destination.test.js')
          s = test.read_text()
          s += '''\n\ntest("all selected activities survive normalization",()=>{\n  const interests="scenery,fall-color,short-walk,waterfall,photography,history,picnic,sunset";\n  assert.equal(P.normalizeInput({gateway:"cherokee",finish:"roanoke",hours:12,interests}).interests.length,8);\n});\n\ntest("Cherokee to Roanoke uses spare time for activity stops when twelve hours are available",()=>{\n  const interests="scenery,fall-color,short-walk,waterfall,photography,history,picnic,sunset";\n  const input=P.normalizeInput({gateway:"cherokee",finish:"roanoke",hours:12,interests});\n  assert.ok(P.nonstopMinutes(input)/60>10.5);\n  assert.ok(P.nonstopMinutes(input)/60<11.5);\n  const routes=P.buildCandidates(input);\n  assert.ok(routes.some(route=>route.stopIds.length>0));\n  const stopIds=new Set(routes.flatMap(route=>route.stopIds));\n  assert.ok(stopIds.size>0);\n});\n\ntest("browser keeps every checked activity and auto-fits point-to-point time",()=>{\n  const source=fs.readFileSync(path.join(__dirname,"..","public","assets","blue-ridge-parkway.js"),"utf8");\n  assert.doesNotMatch(source,/selectedInterests\\(\\).*slice\\(0,4\\)/);\n  assert.match(source,/corridorDriveHours/);\n  assert.match(source,/syncHours\\(true\\)/);\n  const html=fs.readFileSync(path.join(__dirname,"..","public","blue-ridge-parkway","index.html"),"utf8");\n  assert.match(html,/id="corridorBudget"/);\n});\n'''
          test.write_text(s)
      - name: Run Blue Ridge destination tests
        run: node --test tests/blue-ridge-parkway-destination.test.js tests/blue-ridge-parkway-ui.test.js tests/blue-ridge-parkway.test.js
      - name: Commit patch
        run: |
          git config user.name "Chris Izworski"
          git config user.email "46615230+izworskic@users.noreply.github.com"
          git add lib/blue-ridge-parkway/point-to-point.js public/assets/blue-ridge-parkway.js public/blue-ridge-parkway/index.html tests/blue-ridge-parkway-destination.test.js
          git commit -m "Fix Blue Ridge point-to-point stop budgeting"
          git push origin HEAD:fix/blue-ridge-stop-budget
