name: Soo corridor historical replay
on:
  push:
    branches: [agent/great-lakes-corridor-intelligence-20261124]
    paths: [.github/workflows/soo-corridor-historical-replay.yml]
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate corridor decisions
        run: node --test tests/corridor-intelligence.test.js tests/soo-locks-next.test.js
      - name: Reuse successful NOAA artifact, no new archive downloads
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh run view 45390603940 --repo izworskic/chrisizworski-com --json conclusion -q .conclusion)" = success
          mkdir -p "$RUNNER_TEMP/soo-noaa" research-output
          gh run download 45390603940 --repo izworskic/chrisizworski-com --name great-lakes-noaa-historical-library-pilot --dir "$RUNNER_TEMP/soo-noaa"
          node scripts/soo-corridor-replay.cjs "$RUNNER_TEMP/soo-noaa"/2025-06-15.json "$RUNNER_TEMP/soo-noaa"/2025-08-15.json "$RUNNER_TEMP/soo-noaa"/2025-10-15.json | tee research-output/soo-corridor-replay.json
      - uses: actions/upload-artifact@v4
        with:
          name: soo-corridor-historical-replay
          path: research-output/
          retention-days: 5
          if-no-files-found: error
