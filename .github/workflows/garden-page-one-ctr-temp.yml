name: Temporary gardening page-one CTR composer

on:
  push:
    branches:
      - feat/garden-page-one-ctr-2026-08-22

permissions:
  contents: write

jobs:
  compose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compose gardening page-one CTR treatment
        run: node scripts/compose-garden-page-one-ctr.mjs
