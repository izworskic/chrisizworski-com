name: Refine decision network growth build
on:
  push:
    branches: [agent/decision-network-boat-shipwreck]
permissions:
  contents: write
jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/decision-network-boat-shipwreck
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/refine-decision-growth.mjs
      - run: rm scripts/refine-decision-growth.mjs .github/workflows/decision-growth-refine.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Refine boat ranking and shipwreck access wording"
          git push origin HEAD:agent/decision-network-boat-shipwreck
# retrigger
