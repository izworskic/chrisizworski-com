name: State Aurora Production Smoke
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/state-aurora-production-smoke.yml'
      - 'vercel.json'
      - 'public/sitemap-aurora-states.xml'
  schedule:
    - cron: '15 12 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public aurora pages, APIs and sitemap
        shell: bash
        run: |
          set -euo pipefail

          fetch_retry() {
            url="$1"
            out="$2"
            for attempt in 1 2 3 4 5 6; do
              if curl -L --fail --silent --show-error --max-time 30 "$url" -o "$out"; then
                return 0
              fi
              echo "Attempt ${attempt} failed for ${url}; retrying..."
              sleep 10
            done
            return 1
          }

          check_state() {
            state_slug="$1"
            api_host="$2"
            region="$3"
            state_name="$4"
            page="https://chrisizworski.com/national-tools/aurora/${state_slug}/"
            api="https://${api_host}/api/aurora?region=${region}"

            echo "Checking $state_name parent: $page"
            fetch_retry "$page" /tmp/page.html
            grep -Fq "https://${api_host}/api/aurora?region=" /tmp/page.html

            echo "Checking $state_name API: $api"
            fetch_retry "$api" /tmp/api.json
            STATE_NAME="$state_name" node - <<'NODE'
          const fs = require('fs');
          const d = JSON.parse(fs.readFileSync('/tmp/api.json','utf8'));
          if (d?.state?.name !== process.env.STATE_NAME || !d?.fetched_at || !d?.selected_region?.id) {
            console.error(d);
            process.exit(1);
          }
          const freshness = d.source_freshness;
          for (const key of ['kp_observed_fresh','solar_wind_fresh','ovation_fresh','nws_sky_fresh']) {
            if (typeof freshness?.[key] !== 'boolean') throw new Error('Missing source-age gate: '+key);
          }
          if (!freshness.kp_observed_fresh && d.conditions?.current_kp != null) throw new Error('Stale observed Kp used');
          if (!freshness.ovation_fresh && d.conditions?.local_ovation != null) throw new Error('Stale OVATION used');
          if (!freshness.nws_sky_fresh && d.conditions?.cloud_percent != null) throw new Error('Stale NWS cloud cover used');
          if (!freshness.solar_wind_fresh && d.conditions?.solar_wind != null) throw new Error('Stale solar wind used');
          console.log(JSON.stringify({state:d.state.name,region:d.selected_region.id,score:d.verdict?.score,fetched_at:d.fetched_at,degraded:d.degraded,freshness}));
          NODE
          }

          check_page() {
            path="$1"
            canonical="https://chrisizworski.com${path}"
            echo "Checking child page: $canonical"
            fetch_retry "$canonical" /tmp/child.html
            grep -Fq "<link rel=\"canonical\" href=\"${canonical}\"" /tmp/child.html
            grep -Fq 'FAQPage' /tmp/child.html
          }

          check_state alaska alaska-aurora-live.vercel.app fairbanks Alaska
          check_state minnesota minnesota-aurora-live.vercel.app voyageurs Minnesota
          check_state north-dakota north-dakota-aurora-live.vercel.app peace-garden 'North Dakota'
          check_state montana montana-aurora-live.vercel.app glacier Montana
          check_state maine maine-aurora-live.vercel.app allagash Maine

          echo 'Checking national aurora source age reporting'
          fetch_retry 'https://chrisizworski.com/api/national-aurora?lat=46.54&lon=-87.39' /tmp/national-aurora.json
          node - <<'NODE'
          const d=require('/tmp/national-aurora.json');
          const f=d.source_freshness;
          if (!d.retrieved_at || !f || typeof f.kp_observed_fresh!=='boolean' || typeof f.ovation_fresh!=='boolean' || typeof f.nws_sky_fresh!=='boolean') throw Error('National aurora freshness contract missing');
          if (!f.ovation_fresh && d.local_signal?.ovation_value != null) throw Error('National API used stale OVATION');
          if (!f.kp_observed_fresh && d.geomagnetic?.current_kp != null) throw Error('National API used stale Kp observation');
          NODE

          check_page /national-tools/aurora/alaska/fairbanks/
          check_page /national-tools/aurora/alaska/anchorage/
          check_page /national-tools/aurora/alaska/denali/
          check_page /national-tools/aurora/minnesota/duluth/
          check_page /national-tools/aurora/minnesota/grand-marais/
          check_page /national-tools/aurora/minnesota/ely-boundary-waters/
          check_page /national-tools/aurora/minnesota/voyageurs/
          check_page /national-tools/aurora/north-dakota/fargo/
          check_page /national-tools/aurora/north-dakota/bismarck/
          check_page /national-tools/aurora/north-dakota/grand-forks/
          check_page /national-tools/aurora/montana/glacier-national-park/
          check_page /national-tools/aurora/montana/whitefish/
          check_page /national-tools/aurora/montana/billings/
          check_page /national-tools/aurora/maine/presque-isle/
          check_page /national-tools/aurora/maine/bangor/
          check_page /national-tools/aurora/maine/acadia-national-park/
          check_page /northern-lights-michigan/keweenaw/
          check_page /northern-lights-michigan/marquette/
          check_page /northern-lights-michigan/munising/
          check_page /northern-lights-michigan/mackinaw-city/

          echo 'Checking aurora sitemap'
          fetch_retry https://chrisizworski.com/sitemap-aurora-states.xml /tmp/sitemap.xml
          count=$(grep -o '<url>' /tmp/sitemap.xml | wc -l | tr -d ' ')
          if [ "$count" != '26' ]; then
            echo "Expected 26 aurora sitemap URLs, got $count"
            cat /tmp/sitemap.xml
            exit 1
          fi
          grep -Fq 'https://chrisizworski.com/northern-lights-michigan/keweenaw/' /tmp/sitemap.xml
          grep -Fq 'https://chrisizworski.com/national-tools/aurora/maine/acadia-national-park/' /tmp/sitemap.xml

          echo 'Aurora production smoke passed: 5 parent engines, 20 child pages, 26 sitemap URLs.'
