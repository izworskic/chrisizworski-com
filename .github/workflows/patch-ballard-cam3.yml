name: Patch Ballard Camera 3 production pin

on:
  push:
    branches:
      - agent/ballard-cam3-only
    paths:
      - '.github/workflows/patch-ballard-cam3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ballard-cam3-only
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch package pin and production camera contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          old='551a995185a8213906913d81717520cdc9f2e1f9'
          new='a02157ef0d085879f3a7b1374ba25acc9c836f9a'
          for f in ['package.json','tests/ballard-locks-extracted.test.js']:
              p=Path(f); s=p.read_text()
              if old not in s: raise SystemExit(f'old pin missing in {f}')
              p.write_text(s.replace(old,new))
          p=Path('scripts/ballard-production-smoke.mjs')
          s=p.read_text()
          s=s.replace("  'https://www.sbmc.com/dock-cams/',\n  'Live Ballard Ship Canal cameras',", "  'https://g1.ipcamlive.com/player/player.php?alias=5ababb8154afe',\n  'Live Ballard Ship Canal camera',\n  'Live video from Salmon Bay Marine Center Camera #3',")
          marker="if (page.text.includes('UC1roj2AL1R0DxTjjX89gbEQ') || page.text.includes('youtube.com/@BallardLocksWebcam')) {"
          if marker not in s: raise SystemExit('YouTube guard marker missing')
          extra="if (page.text.includes('Open live Ship Canal cameras')) {\n  throw new Error('Multi-camera picker returned to Ballard production');\n}\n\n"
          s=s.replace(marker, extra+marker)
          p.write_text(s)
          PY
      - name: Install and run focused tests
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts
          node --test tests/ballard-locks-extracted.test.js
          node -c scripts/ballard-production-smoke.mjs
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json tests/ballard-locks-extracted.test.js scripts/ballard-production-smoke.mjs
          git commit -m 'Pin Ballard Camera 3 direct live stream'
          git push
