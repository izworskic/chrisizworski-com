name: Manistee production smoke

on:
  push:
    branches: [main]
    paths:
      - 'public/manistee-river-map/**'
      - 'public/assets/manistee-river-*.js'
      - 'public/assets/manistee-ausable-ui.js'
      - 'public/assets/manistee-ausable-ui.css'
      - 'api/manistee-river-*.js'
      - 'public/sitemap-manistee.xml'
      - 'public/robots.txt'
      - 'scripts/smoke-manistee-production.mjs'
      - '.github/workflows/manistee-production-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  public-origin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify public chrisizworski.com Manistee release
        run: node scripts/smoke-manistee-production.mjs
      - name: Publish production smoke commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          STATE: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
            -f state="${STATE}" \
            -f context='Manistee production smoke' \
            -f description="Public chrisizworski.com smoke: ${STATE}" \
            -f target_url="${RUN_URL}"
