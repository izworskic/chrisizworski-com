name: Manistee production smoke

on:
  push:
    branches: [main]
    paths:
      - 'public/manistee-river-map/**'
      - 'public/assets/manistee-river-*.js'
      - 'public/assets/manistee-route-core.js'
      - 'public/assets/manistee-ausable-ui.js'
      - 'public/assets/manistee-ausable-ui.css'
      - 'api/manistee-river-*.js'
      - 'api/manistee-float-v1.js'
      - 'public/sitemap-manistee.xml'
      - 'public/robots.txt'
      - 'scripts/smoke-manistee-production.mjs'
      - 'scripts/manistee-production-retry.mjs'
      - 'tests/manistee-production-retry.test.js'
      - '.github/workflows/manistee-production-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  public-origin:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify transient retry semantics
        run: node --test tests/manistee-production-retry.test.js
      - name: Wait for Vercel to complete this exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 48); do
            state="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/status" --jq '[.statuses[] | select(.context=="Vercel") | .state][0] // "pending"')"
            case "$state" in
              success)
                echo "Vercel status is successful for ${GITHUB_SHA}; allowing propagation."
                sleep 10
                exit 0
                ;;
              failure|error)
                echo "Vercel failed for ${GITHUB_SHA}: ${state}" >&2
                exit 1
                ;;
              pending)
                echo "Waiting for Vercel at ${GITHUB_SHA} (check ${attempt}/48)"
                sleep 10
                ;;
              *)
                echo "Unrecognized Vercel status ${state}" >&2
                exit 1
                ;;
            esac
          done
          echo "No successful Vercel deployment status for ${GITHUB_SHA} within the bound." >&2
          exit 1
      - name: Verify public chrisizworski.com Manistee release
        run: node scripts/smoke-manistee-production.mjs
      - name: Publish production smoke commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          STATE: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
            -f state="${STATE}" \
            -f context='Manistee production smoke' \
            -f description="Public chrisizworski.com smoke: ${STATE}" \
            -f target_url="${RUN_URL}"
