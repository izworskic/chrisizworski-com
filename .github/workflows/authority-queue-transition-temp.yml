name: Temporary authority queue transition

on:
  push:
    branches:
      - feat/search-growth-consolidation-2026-08-22

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Align immediate and protected authority queues
        run: |
          node <<'NODE'
          const fs = require('fs');

          const p = 'benchmarks/search-authority-portfolio.json';
          const portfolio = JSON.parse(fs.readFileSync(p,'utf8'));
          portfolio.immediateQueue = [
            'winter — EXPAND Michigan Ice and XC preseason authority now: grow crawlable statewide/regional coverage and contextual handoffs before seasonal demand, without rewriting safety truth or creating duplicate live-condition owners.',
            'manistee — EXPAND the existing Manistee River owner from its zero-click near-page-one signal into stronger map/access/trip-planning authority; coordinate with the live field-map work and do not clone Au Sable copy.',
            'garden-planner — BUILD_NEXT only after custom-domain attachment, production response, canonical, indexability and owned-network verification all pass.',
            'AI citation — run live answer-engine spot checks against the highest-value unprotected authority surfaces and feed only evidence-backed gaps back into existing canonical owners.'
          ];
          fs.writeFileSync(p, JSON.stringify(portfolio,null,2)+'\n');

          const b = 'scripts/benchmark-search-authority-portfolio.mjs';
          let s = fs.readFileSync(b,'utf8');
          const old = `  immediateText.includes("beach-report") &&\n    immediateText.includes("border-waits") &&\n    immediateText.includes("ausable-field-map") &&\n    immediateText.includes("boat-launches") &&\n    immediateText.includes("garden-planner") &&\n    immediateText.includes("winter") &&\n    !immediateText.includes("mackinac-tolls") &&\n    !immediateText.includes("great-lakes-buoys") &&\n    protectedText.includes("northern lights") &&\n    protectedText.includes("soo locks") &&\n    protectedText.includes("ship tracker") &&\n    protectedText.includes("fall color") &&\n    protectedText.includes("great lakes buoys") &&\n    protectedText.includes("mackinac bridge tolls") &&`;
          const next = `  immediateText.includes("garden-planner") &&\n    immediateText.includes("winter") &&\n    immediateText.includes("manistee") &&\n    !immediateText.includes("beach-report") &&\n    !immediateText.includes("border-waits") &&\n    !immediateText.includes("ausable-field-map") &&\n    !immediateText.includes("boat-launches") &&\n    !immediateText.includes("mackinac-tolls") &&\n    !immediateText.includes("great-lakes-buoys") &&\n    protectedText.includes("northern lights") &&\n    protectedText.includes("soo locks") &&\n    protectedText.includes("ship tracker") &&\n    protectedText.includes("fall color") &&\n    protectedText.includes("great lakes buoys") &&\n    protectedText.includes("mackinac bridge tolls") &&\n    protectedText.includes("beach conditions") &&\n    protectedText.includes("border wait") &&\n    protectedText.includes("boat launch") &&\n    protectedText.includes("au sable") &&`;
          if (!s.includes(old)) throw new Error('Expected stale immediate-queue assertion not found');
          s = s.replace(old,next);
          fs.writeFileSync(b,s);
          NODE
      - name: Commit queue transition
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/search-authority-portfolio.json scripts/benchmark-search-authority-portfolio.mjs
          git commit -m "Advance authority queue after growth treatments become protected"
          git push
