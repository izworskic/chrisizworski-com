name: Execute Kilauea interpretive ranger copy rewrite
on:
  push:
    branches:
      - agent/kilauea-interpretive-ranger-voice-2026-09-28
permissions:
  contents: write
jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply copy rewrite and test
        run: |
          set -euo pipefail
          python scripts/tmp-kilauea-ranger-copy.py
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/kilauea-live.test.js')
          s=p.read_text()
          old="assert.match(html, /Sources & status/i);"
          new="assert.match(html, /The official voices behind this answer/i);"
          if old not in s:
              raise SystemExit('old source-heading assertion not found')
          p.write_text(s.replace(old,new,1))
          PY
          node --test tests/kilauea-live.test.js
          rm scripts/tmp-kilauea-ranger-copy.py
          rm .github/workflows/tmp-kilauea-ranger-copy.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/kilauea-decision.js public/labs/kilauea-live/index.html tests/kilauea-live.test.js scripts/tmp-kilauea-ranger-copy.py .github/workflows/tmp-kilauea-ranger-copy.yml
          git commit -m 'Rewrite Kilauea in interpretive ranger voice'
          git push origin HEAD:agent/kilauea-interpretive-ranger-voice-2026-09-28
