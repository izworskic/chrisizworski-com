name: Compose entity discovery CTR sprint

on:
  push:
    branches:
      - feat/entity-discovery-runtime-ctr-2026-08-23

permissions:
  contents: write

jobs:
  compose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/entity-discovery-runtime-ctr-2026-08-23
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply measured CTR treatment
        run: node scripts/compose-entity-discovery-runtime-ctr.mjs
