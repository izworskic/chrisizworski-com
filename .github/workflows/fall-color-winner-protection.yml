name: Fall Color Winner Protection

on:
  pull_request:
    paths:
      - 'public/fall-color/**'
      - 'public/fall-color-northern-lights-michigan/**'
      - 'docs/search-growth-engine-fall-2026.md'
      - 'benchmarks/fall-color-winner-protection-2026-09-25.json'
      - 'scripts/benchmark-fall-color-winner-protection.mjs'
      - '.github/workflows/fall-color-winner-protection.yml'
  push:
    branches:
      - main
    paths:
      - 'public/fall-color/**'
      - 'public/fall-color-northern-lights-michigan/**'
      - 'docs/search-growth-engine-fall-2026.md'
      - 'benchmarks/fall-color-winner-protection-2026-09-25.json'
      - 'scripts/benchmark-fall-color-winner-protection.mjs'
      - '.github/workflows/fall-color-winner-protection.yml'

permissions:
  contents: read

jobs:
  protect-fall-color-winners:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify protected owners and reinforcement links
        run: node scripts/benchmark-fall-color-winner-protection.mjs --check
