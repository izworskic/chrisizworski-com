name: One-time lighthouse Commons photo import
on:
  push:
    branches:
      - feat/frozen-lighthouse-field-guide-visuals
    paths:
      - 'data/frozen-lighthouse-photography.json'
      - 'scripts/import-frozen-lighthouse-photos.py'
      - '.github/workflows/lighthouse-import-once.yml'
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image processor
        run: pip install pillow==11.3.0
      - name: Import source-credited historical photography and optimize webp
        run: python3 scripts/import-frozen-lighthouse-photos.py
      - name: Commit only the six verified optimized images to the feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/frozen-lighthouse-photos/*.webp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add licensed and optimized real winter lighthouse photographs"
          git push origin HEAD:feat/frozen-lighthouse-field-guide-visuals
