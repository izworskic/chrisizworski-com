name: Temporary gardening source parity repair

on:
  push:
    branches:
      - feat/garden-page-one-ctr-2026-08-22

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair scoped source parity declaration
        run: node scripts/repair-garden-source-parity-temp.mjs
