name: Blue Ridge infeasible-state fix

on:
  push:
    branches:
      - fix/blue-ridge-infeasible-trip-state

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/blue-ridge-infeasible-trip-state
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply infeasible-state patch
        run: python .github/blue-ridge-infeasible-patch.py
      - name: Run Blue Ridge tests
        run: node --test tests/blue-ridge-parkway-destination.test.js tests/blue-ridge-google-maps.test.js tests/blue-ridge-parkway-ui.test.js tests/blue-ridge-parkway.test.js
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/blue-ridge-parkway/point-to-point.js public/assets/blue-ridge-parkway.js public/blue-ridge-parkway/index.html tests/blue-ridge-parkway-destination.test.js
          git diff --cached --quiet && exit 0
          git commit -m "Reject infeasible Blue Ridge point-to-point plans"
          git push origin HEAD:fix/blue-ridge-infeasible-trip-state
