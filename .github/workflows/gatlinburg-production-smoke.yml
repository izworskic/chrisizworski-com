name: Gatlinburg production smoke

on:
  push:
    branches:
      - agent/gatlinburg-winter
  workflow_dispatch:

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for v3.5 API to reach production
        shell: bash
        run: |
          set -euo pipefail
          url='https://chrisizworski.com/api/gatlinburg-winter?date=2026-12-12&start=14%3A00&end=22%3A00&persona=first'
          for i in $(seq 1 36); do
            if curl --fail --silent --show-error --max-time 25 "$url" -o /tmp/gat.json; then
              if node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync("/tmp/gat.json","utf8")); if(d.version!=="3.5" || !d.visitSnapshot || !Array.isArray(d.commitChecklist) || !d.commitChecklist.length || !Array.isArray(d.itinerary) || d.itinerary.some(x=>!x.costLabel || !x.whyNow || !x.executionNote)) process.exit(1);'; then
                echo 'Production API is v3.5 with benchmark detail layer.'
                exit 0
              fi
            fi
            sleep 10
          done
          echo 'Production API never reached v3.5 during smoke window.' >&2
          cat /tmp/gat.json 2>/dev/null || true
          exit 1
      - name: Verify production page assets
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 25 'https://chrisizworski.com/gatlinburg-winter/' -o /tmp/gat.html
          grep -q 'gatlinburg-winter-benchmark.css' /tmp/gat.html
          grep -q 'leaflet@1.9.4' /tmp/gat.html
          grep -q 'id="visitSnapshot"' /tmp/gat.html
          grep -q 'id="commitRows"' /tmp/gat.html
          grep -q 'Official live checks' /tmp/gat.html
          grep -q 'CC BY-SA 4.0' /tmp/gat.html
      - name: Verify event-shaped date contract
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 25 'https://chrisizworski.com/api/gatlinburg-winter?date=2026-12-04&start=14%3A00&end=22%3A00&persona=christmas&mustLights=1' -o /tmp/parade.json
          node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync("/tmp/parade.json","utf8")); if(d.version!=="3.5") process.exit(1); if(!d.dateIntelligence || !d.decisionClock) process.exit(1); if(!Array.isArray(d.events) || !d.events.some(e=>String(e.name||"").toLowerCase().includes("parade"))) process.exit(1);'
