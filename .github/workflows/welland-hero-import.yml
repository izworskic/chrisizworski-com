name: Import Welland editorial hero photo
on:
  push:
    branches:
      - feature/welland-editorial-hero-20261011
    paths:
      - .github/workflows/welland-hero-import.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: welland-hero-import-${{ github.ref }}
  cancel-in-progress: false
jobs:
  import-hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download real Welland lock freighter photograph
        run: node scripts/fetch-welland-hero.cjs
      - name: Compress to editorial 16:9 JPEG
        run: |
          python -m pip install --quiet Pillow
          python scripts/optimize-welland-hero.py
      - name: Check JPEG output
        run: |
          set -euo pipefail
          f=public/assets/welland/photos/hero-algoberta.jpg
          test -s "$f"
          file "$f" | grep -q 'JPEG image data'
          test "$(wc -c < "$f")" -lt 1500000
          ls -lh "$f"
      - name: Commit the verified real photograph to the review branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'feature/welland-editorial-hero-20261011'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/welland/photos/hero-algoberta.jpg
          if git diff --cached --quiet; then echo "Hero image already present"; exit 0; fi
          git commit -m "Bundle licensed Welland hero photograph locally"
          git push origin "HEAD:$GITHUB_REF_NAME"
