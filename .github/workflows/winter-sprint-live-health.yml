name: Winter sprint live-source health
on:
  pull_request:
    paths:
      - "scripts/audit-winter-growth-sprints-live.cjs"
      - ".github/workflows/winter-sprint-live-health.yml"
      - "docs/WINTER_SPRINTS_1_8_PRODUCTION_AUDIT_2026-11-11.md"
      - "public/michigan-snow-totals/**"
      - "public/assets/michigan-snow-totals*"
      - "api/michigan-snow-totals.js"
      - "public/michigan-winter-weekends/**"
      - "public/assets/michigan-winter-weekend*"
      - "public/michigan-ski-hills/**"
      - "public/assets/michigan-ski*"
      - "api/michigan-ski.js"
      - "public/snowmobile/**"
      - "api/snowmobile*.js"
      - "public/michigan-ice/**"
      - "public/michigan-ice-caves/**"
      - "public/frozen-michigan/**"
      - "public/assets/frozen-michigan*.js"
      - "api/ice*.js"
      - "public/lake-effect-snow/**"
      - "public/michigan-snow-depth/**"
      - "public/welland-canal/**"
      - "public/duluth-canal-park/**"
      - "public/great-lakes-freighter-tracking/**"
      - "public/soo-locks/**"
      - "public/mackinac-bridge-live/**"
      - "public/northern-lights-michigan/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    name: Real production data, not merely HTTP 200
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Read-only audit of winter growth sprint APIs
        run: node scripts/audit-winter-growth-sprints-live.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: winter-growth-production-health
          path: artifacts/winter-sprints-production-health.json
          if-no-files-found: warn
          retention-days: 14
