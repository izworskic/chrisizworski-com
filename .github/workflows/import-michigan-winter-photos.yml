name: Import licensed Michigan winter photos once
on:
  push:
    branches: [feat/michigan-winter-activities-production]
    paths:
      - scripts/build-michigan-winter-photos.py
      - data/michigan-winter-photo-sources.json
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Import, optimize and verify every source-licensed photograph
        run: python scripts/build-michigan-winter-photos.py
      - name: Commit optimized images to this release branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/michigan-winter-activities/photos/ public/michigan-winter-activities/index.html docs/MICHIGAN_WINTER_PHOTO_IMPORT_REPORT.json
          git diff --cached --quiet || git commit -m "assets: serve Michigan winter photos locally with preserved Commons attribution"
          git push origin HEAD:feat/michigan-winter-activities-production
