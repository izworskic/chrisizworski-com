name: Prepare Mackinac JEV dependency

on:
  push:
    branches:
      - 'feature/mackinac-jev-platform-v2'

permissions:
  contents: write

jobs:
  install:
    if: "!contains(github.event.head_commit.message, 'Install Vercel OIDC helper')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mackinac-jev-platform-v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install @vercel/oidc@3.8.8 --save-exact --ignore-scripts
      - name: Commit dependency
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Chris Izworski"
          git config user.email "46615230+izworskic@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Install Vercel OIDC helper"
          git push origin HEAD:feature/mackinac-jev-platform-v2
