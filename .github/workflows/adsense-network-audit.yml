name: AdSense network coverage
on:
  workflow_dispatch:
  schedule:
    - cron: '20 10 * * *'
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Discover and audit published content pages
        run: node scripts/audit-adsense-network.mjs --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adsense-network-coverage
          path: audit/adsense-network.json
          retention-days: 30
