name: Migrate Gauley To National Hub

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-gauley-proxy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove duplicate Gauley deployment surface
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');

          const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
          pkg.scripts['vercel-build'] = pkg.scripts['vercel-build']
            .replace(' && node scripts/sync-gauley-release-live.mjs','');
          delete pkg.dependencies['gauley-release-live'];
          fs.writeFileSync('package.json', JSON.stringify(pkg,null,2)+'\n');

          const lock = JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          if (lock.packages?.['']?.dependencies) delete lock.packages[''].dependencies['gauley-release-live'];
          if (lock.packages) delete lock.packages['node_modules/gauley-release-live'];
          fs.writeFileSync('package-lock.json', JSON.stringify(lock,null,2)+'\n');

          const vercel = JSON.parse(fs.readFileSync('vercel.json','utf8'));
          if (vercel.functions) {
            delete vercel.functions['api/gauley-live.js'];
            delete vercel.functions['api/gauley-history.js'];
          }
          vercel.rewrites = (vercel.rewrites || []).filter(r => !String(r.source || '').startsWith('/national-tools/gauley-release-live'));
          fs.writeFileSync('vercel.json', JSON.stringify(vercel,null,2)+'\n');
          NODE

          rm -f api/gauley-live.js api/gauley-history.js
          rm -f scripts/sync-gauley-release-live.mjs
          rm -f public/national-tools/gauley-release-live/index.html
          rmdir public/national-tools/gauley-release-live 2>/dev/null || true
          rm -f data/gauley-release-mirror.json

          cat > scripts/verify-gauley-routing.mjs <<'EOF'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';

          const middleware=fs.readFileSync('middleware.ts','utf8');
          const vercel=JSON.parse(fs.readFileSync('vercel.json','utf8'));
          const sitemap=fs.readFileSync('public/sitemap.xml','utf8');
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          const url='https://chrisizworski.com/national-tools/gauley-release-live/';
          const clean='/national-tools/gauley-release-live';
          const hub='https://national-outdoor-tools-hub.vercel.app/national-tools/:path*';

          assert.ok(!middleware.includes('GAULEY_'),'Gauley must not use special middleware routing');
          assert.ok(!middleware.includes('gauley-release-live'),'Gauley must not depend on middleware self-fetching');
          assert.ok(!pkg.dependencies?.['gauley-release-live'],'Main site must not package the Gauley engine');
          assert.ok(!lock.packages?.['node_modules/gauley-release-live'],'Main-site lockfile must not package Gauley');
          assert.ok(!fs.existsSync('api/gauley-live.js'),'Main site must not duplicate the Gauley live function');
          assert.ok(!fs.existsSync('api/gauley-history.js'),'Main site must not duplicate the Gauley history function');
          assert.ok(!fs.existsSync('public/national-tools/gauley-release-live/index.html'),'Main site must not carry a stale Gauley page mirror');
          assert.ok(!String(pkg.scripts['vercel-build']).includes('sync-gauley-release-live'),'Main build must not sync Gauley locally');
          assert.ok(!Object.keys(vercel.functions||{}).some(k=>k.includes('gauley')),'Main Vercel function config must not package Gauley');
          assert.ok(!(vercel.rewrites||[]).some(r=>String(r.source||'').startsWith(clean)),'Gauley must use the generic National Tools proxy, not a special rewrite');
          const catchAll=(vercel.rewrites||[]).find(r=>r.source==='/national-tools/:path*');
          assert.ok(catchAll,'National Tools catch-all proxy missing');
          assert.equal(catchAll.destination,hub,'National Tools catch-all must point at the National Outdoor Tools hub');
          assert.ok(sitemap.includes(`<loc>${url}</loc>`),'Gauley sitemap URL missing');
          assert.equal(sitemap.split(url).length-1,1,'Gauley sitemap URL must be unique');
          console.log('Gauley generic National Tools proxy routing: PASS');
          EOF

      - name: Validate cleanup before commit
        run: |
          npm ci --ignore-scripts
          node scripts/add-gauley-to-sitemap.mjs
          node scripts/verify-gauley-routing.mjs

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json vercel.json scripts/verify-gauley-routing.mjs public/sitemap.xml
          git add -u api/gauley-live.js api/gauley-history.js scripts/sync-gauley-release-live.mjs public/national-tools/gauley-release-live/index.html data/gauley-release-mirror.json || true
          if git diff --cached --quiet; then
            echo 'No migration changes to commit.'
            exit 0
          fi
          git commit -m 'Route Gauley entirely through national tools hub'
          git push
