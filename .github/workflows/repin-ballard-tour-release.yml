name: Repin Ballard Tour Release

on:
  push:
    branches:
      - agent/ballard-interactive-tour-production
    paths:
      - '.github/workflows/repin-ballard-tour-release.yml'

permissions:
  contents: write

jobs:
  repin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ballard-interactive-tour-production
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repin authoritative Ballard release
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const pin='87c99c77cc0ed6a265ff9ae4fdffafa632ae6b50';
          const dep=`github:izworskic/national-ballard-locks#${pin}`;
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          pkg.dependencies['national-ballard-locks']=dep;
          fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');
          const testPath='tests/ballard-locks-extracted.test.js';
          let test=fs.readFileSync(testPath,'utf8');
          test=test.replace(/github:izworskic\/national-ballard-locks#[0-9a-f]{40}/g,dep);
          fs.writeFileSync(testPath,test);
          NODE
      - name: Install and regenerate lockfile
        run: npm install --ignore-scripts
      - name: Refresh committed Ballard mirror
        run: node scripts/sync-ballard-locks.mjs
      - name: Focused Ballard contracts
        run: node --test tests/ballard-locks-extracted.test.js
      - name: Full site tests
        run: npm test
      - name: Commit repin
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json tests/ballard-locks-extracted.test.js public/ballard-locks api/ballard-locks.js public/sitemap.xml
          git commit -m 'Repin Ballard tour to SEO-clean release'
          git push
