name: Freighter winter layup release gate
on:
  pull_request:
    branches: [main]
    paths:
      - 'public/great-lakes-freighter-winter-layup/**'
      - 'public/assets/freighter-layup*'
      - 'public/assets/freighter-vessel-biographies.json'
      - 'lib/freighter-layup-profile-render.cjs'
      - 'scripts/generate-freighter-layup-profiles.cjs'
      - 'tests/freighter-layup*'
      - '.github/workflows/freighter-layup-release.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: freighter-layup-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  release-check:
    name: Native data, biography, and real-browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned project dependencies
        run: npm ci
      - name: Verify actual Node assertions
        run: node --test tests/freighter-layup.test.js tests/freighter-layup-biographies.test.js
      - name: Check generated biographies match source exactly
        run: node scripts/generate-freighter-layup-profiles.cjs --check
      - name: Prepare headless browser runner
        run: |
          command -v google-chrome
          npm install --no-save --no-package-lock playwright@1.56.1
      - name: Exercise desktop and mobile winter layup interactions
        run: node tests/freighter-layup-browser.cjs
      - name: Upload screenshots of tested views
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freighter-layup-browser-screenshots
          path: artifacts/layup-qa/*.png
          if-no-files-found: ignore
          retention-days: 3
