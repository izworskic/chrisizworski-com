name: Promote Gauley Static Route

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-gauley-static.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Route Gauley to checked-in static persona bundle
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const file='vercel.json';
          let s=fs.readFileSync(file,'utf8');
          const pairs=[
            ['{"source":"/national-tools/gauley-release-live","destination":"/api/gauley-page"}','{"source":"/national-tools/gauley-release-live","destination":"/national-tools/gauley-release-live/index.html"}'],
            ['{"source":"/national-tools/gauley-release-live/","destination":"/api/gauley-page"}','{"source":"/national-tools/gauley-release-live/","destination":"/national-tools/gauley-release-live/index.html"}']
          ];
          for(const [from,to] of pairs){
            if(!s.includes(from)) throw new Error(`missing expected Gauley route: ${from}`);
            s=s.replace(from,to);
          }
          fs.writeFileSync(file,s);
          NODE
          rm -f api/gauley-page.js
          git diff --check
      - name: Commit static route cutover
        shell: bash
        run: |
          set -euo pipefail
          git add vercel.json api/gauley-page.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Serve Gauley persona bundle as first-party static page'
          git push origin HEAD:main
