name: Publish White Christmas discovery growth

on:
  push:
    branches:
      - growth/white-christmas-shell-2026-09-25

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: growth/white-christmas-shell-2026-09-25
      - name: Apply sitemap and measurement release
        run: python scripts/agent_publish_white_christmas_growth.py
      - name: Commit publication state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent-publish-white-christmas-growth.yml scripts/agent_publish_white_christmas_growth.py
          git add public/sitemap-white-christmas.xml public/sitemap.xml public/sitemap-winter.xml scripts/verify-white-christmas-indexing.mjs docs/WHITE_CHRISTMAS_GROWTH_RELEASE_2026-09-25.md
          git commit -m "Publish expanded White Christmas discovery network"
          git push origin HEAD:growth/white-christmas-shell-2026-09-25
