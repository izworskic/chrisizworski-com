name: Prune merged branches once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/prune-merged-branches-once.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all branch refs
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

      - name: Prune unchanged heads of closed pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail

          python - <<'PY' > "$RUNNER_TEMP/closed-heads.tsv"
          import json
          import os
          import urllib.request

          api = os.environ["GITHUB_API_URL"]
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          page = 1
          while True:
              url = f"{api}/repos/{repo}/pulls?state=closed&per_page=100&page={page}"
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as response:
                  pulls = json.load(response)
              if not pulls:
                  break
              for pr in pulls:
                  head = pr.get("head") or {}
                  head_repo = head.get("repo") or {}
                  if head_repo.get("full_name") != repo:
                      continue
                  ref = head.get("ref")
                  sha = head.get("sha")
                  if ref and sha:
                      print(f"{ref}\t{sha}")
              if len(pulls) < 100:
                  break
              page += 1
          PY

          python - <<'PY' > "$RUNNER_TEMP/open-heads.txt"
          import json
          import os
          import urllib.request

          api = os.environ["GITHUB_API_URL"]
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          req = urllib.request.Request(
              f"{api}/repos/{repo}/pulls?state=open&per_page=100",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(req) as response:
              pulls = json.load(response)
          for pr in pulls:
              head = pr.get("head") or {}
              head_repo = head.get("repo") or {}
              if head_repo.get("full_name") == repo and head.get("ref"):
                  print(head["ref"])
          PY

          deleted=0
          kept_changed=0
          kept_open=0
          failed=0

          while IFS=$'\t' read -r branch closed_sha; do
            [ -n "$branch" ] || continue
            [ "$branch" = "main" ] && continue

            if grep -Fxq "$branch" "$RUNNER_TEMP/open-heads.txt"; then
              kept_open=$((kept_open + 1))
              continue
            fi

            remote_ref="refs/remotes/origin/$branch"
            if ! git show-ref --verify --quiet "$remote_ref"; then
              continue
            fi

            current_sha="$(git rev-parse "$remote_ref")"
            if [ "$current_sha" != "$closed_sha" ]; then
              kept_changed=$((kept_changed + 1))
              continue
            fi

            echo "DELETE unchanged closed PR head: $branch"
            if git push origin --delete "$branch"; then
              deleted=$((deleted + 1))
            else
              echo "FAILED delete: $branch"
              failed=$((failed + 1))
            fi
          done < <(sort -u "$RUNNER_TEMP/closed-heads.tsv")

          echo "SUMMARY deleted=$deleted kept_changed=$kept_changed kept_open=$kept_open failed=$failed"
