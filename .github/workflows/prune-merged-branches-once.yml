name: Prune merged branches once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/prune-merged-branches-once.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all branch refs
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

      - name: Prune branches already contained in main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail

          python - <<'PY' > "$RUNNER_TEMP/open-heads.txt"
          import json
          import os
          import urllib.request

          api = os.environ["GITHUB_API_URL"]
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          url = f"{api}/repos/{repo}/pulls?state=open&per_page=100"
          req = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(req) as response:
              pulls = json.load(response)
          for pr in pulls:
              head_repo = (pr.get("head") or {}).get("repo") or {}
              if head_repo.get("full_name") == repo:
                  ref = (pr.get("head") or {}).get("ref")
                  if ref:
                      print(ref)
          PY

          deleted=0
          kept_unique=0
          kept_open=0
          failed=0

          while IFS= read -r branch; do
            [ -n "$branch" ] || continue
            [ "$branch" = "main" ] && continue
            [ "$branch" = "HEAD" ] && continue

            if grep -Fxq "$branch" "$RUNNER_TEMP/open-heads.txt"; then
              echo "KEEP open PR: $branch"
              kept_open=$((kept_open + 1))
              continue
            fi

            if git merge-base --is-ancestor "refs/remotes/origin/$branch" origin/main; then
              echo "DELETE merged/contained: $branch"
              if git push origin --delete "$branch"; then
                deleted=$((deleted + 1))
              else
                echo "FAILED delete: $branch"
                failed=$((failed + 1))
              fi
            else
              echo "KEEP unique commits: $branch"
              kept_unique=$((kept_unique + 1))
            fi
          done < <(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin | sort)

          echo "SUMMARY deleted=$deleted kept_unique=$kept_unique kept_open=$kept_open failed=$failed"
