name: Prune merged branches once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/prune-merged-branches-once.yml

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prune audited superseded and diagnostic branches
        shell: bash
        run: |
          set -uo pipefail

          branches=(
            "118/merge"
            "agent/coastal-location-admission"
            "agent/national-geocode-postmerge-smoke"
            "agent/national-geocode-source-probe"
            "agent/national-phase0-postmerge-smoke"
            "agent/national-portland-coastal-postmerge"
            "agent/national-snow-source-probe"
            "agent/national-snow-source-probe-v2"
            "agent/national-snow-targeted-verify"
            "agent/national-snow-targeted-verify-v2"
            "agent/national-snow-targeted-verify-v3"
            "agent/national-snowpack-melt"
            "agent/national-white-christmas-acis-multi-probe"
            "agent/national-white-christmas-source-probe"
            "agent/national-white-christmas-source-probe-v2"
            "debug/frost-production-verify"
            "feat/entity-discovery-ctr-2026-08-23"
            "feat/national-tools-use-my-location"
            "feat/winter-preseason-authority-2026-08-22"
            "growth/main-tool-publisher-flywheel-2026-08-29"
            "seo/name-serp-moat"
          )

          deleted=0
          missing=0
          failed=0

          for branch in "${branches[@]}"; do
            if ! git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              echo "ALREADY GONE: $branch"
              missing=$((missing + 1))
              continue
            fi

            echo "DELETE audited stale branch: $branch"
            if git push origin --delete "$branch"; then
              deleted=$((deleted + 1))
            else
              echo "FAILED delete: $branch"
              failed=$((failed + 1))
            fi
          done

          echo "SUMMARY deleted=$deleted missing=$missing failed=$failed"
