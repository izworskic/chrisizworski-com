name: Kilauea PR full verification

on:
  push:
    branches:
      - agent/kilauea-discovery-current-main-2026-09-28
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Full repository gate
        run: npm run verify:all
      - name: Kilauea targeted contracts
        run: node --test tests/kilauea-live.test.js tests/kilauea-discovery.test.js
