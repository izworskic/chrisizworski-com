name: Planting SERP one-time fix

on:
  push:
    branches:
      - agent/national-garden-expert-logic-20260902

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/national-garden-expert-logic-20260902
      - name: Shorten planting SERP strings and remove one-time workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('public/national-tools/planting/index.html')
          s = p.read_text()
          old_title = '<title>Planting Calendar by Location: Spring, Fall & Succession | Chris Izworski</title>'
          new_title = '<title>Planting Calendar by Location | Chris Izworski</title>'
          old_desc = '<meta name="description" content="Build a local vegetable planting calendar for direct sowing, indoor starts, transplants, fall gardens and succession planting from NOAA freeze climatology and Extension crop biology.">'
          new_desc = '<meta name="description" content="Get local spring, fall and succession planting dates using NOAA frost climatology, current cold forecasts, crop maturity, soil temperature and heat limits.">'
          if old_title not in s or old_desc not in s:
              raise SystemExit('Expected planting SERP strings not found')
          s = s.replace(old_title, new_title, 1).replace(old_desc, new_desc, 1)
          p.write_text(s)
          PY
          git rm .github/workflows/planting-serp-fix-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/national-tools/planting/index.html
          git commit -m "Fit planting metadata to SERP limits"
          git push origin HEAD:agent/national-garden-expert-logic-20260902
