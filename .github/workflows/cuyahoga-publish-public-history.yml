name: Cuyahoga one-time public NOAA historical sample export

# Research-only branch; manually review the generated asset before any site release.
# This compiles public-domain NOAA files already fetched into a successful historical study.
on:
  push:
    branches: [research/cuyahoga-ais-audit-20261122]
    paths: [.github/workflows/cuyahoga-publish-public-history.yml]

permissions:
  contents: write
  actions: read

jobs:
  create-static-public-noaa:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/cuyahoga-ais-audit-20261122
          persist-credentials: true
      - name: Verify source and visitor evidence guards
        run: node --test tests/cuyahoga-public-watch.test.js
      - name: Reuse original NOAA action evidence, no new download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cuyahoga-online-noaa"
          gh run download 45027320296 --repo izworskic/chrisizworski-com \
            --name cuyahoga-noaa-normal-transit-2025-research \
            --dir "$RUNNER_TEMP/cuyahoga-online-noaa"
          node scripts/build-cuyahoga-public-history.mjs \
            --dir "$RUNNER_TEMP/cuyahoga-online-noaa" \
            --out public/cuyahoga-freighter-watch/noaa-historical-2025.json
      - name: Commit only immutable derived source evidence to existing research branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public/cuyahoga-freighter-watch/noaa-historical-2025.json
          git diff --cached --exit-code && { echo 'No generated changes'; exit 0; } || true
          git commit -m 'Add verified NOAA observed Cuyahoga river fix samples'
          git pull --rebase origin research/cuyahoga-ais-audit-20261122
          git push origin HEAD:research/cuyahoga-ais-audit-20261122
      - name: Summarize factual limitations
        run: |
          echo '### Static historic Cuyahoga river AIS observations' >> "$GITHUB_STEP_SUMMARY"
          echo 'Real NOAA 2025 public-domain broadcasts are stored on the draft research branch.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No inferred route, crossing time, live position, bridge opening or arrival ETA is included.' >> "$GITHUB_STEP_SUMMARY"
