name: Rockhounding GLAHF Grand Marais water-side research

on:
  workflow_dispatch:
  push:
    branches:
      - research/rockhounding-shoreline-gis-20261015
    paths:
      - .github/workflows/rockhounding-water-side-gis.yml

permissions:
  contents: read

jobs:
  study-shoreline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check 14 real GLAHF lake/harbor water-body intersections
        shell: bash
        run: |
          python3 scripts/rockhounding/validate-grand-marais-water-side.py \
            --out artifacts/grand-marais-water-side-glahf.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify geological-source trust boundaries and model-cell exclusions
        run: node --test tests/rockhounding*.test.js
      - name: Check source sampling syntax and pure NOAA parser tests
        run: |
          python3 -m py_compile scripts/rockhounding/*.py
          python3 -m unittest discover -s tests -p 'test_rockhounding_*.py' -v
      - name: Preserve source-stamped, no-key geographic data for audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grand-marais-glahf-water-side-geo-audit
          path: artifacts/grand-marais-water-side-glahf.json
          retention-days: 30
          if-no-files-found: warn
