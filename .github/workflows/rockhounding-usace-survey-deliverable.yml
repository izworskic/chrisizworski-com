name: Rockhounding USACE 2026 original XYZ and beach exclusion audit

on:
  workflow_dispatch:
  push:
    branches:
      - research/rockhounding-usace-original-xyz-rebased-20261015
    paths:
      - .github/workflows/rockhounding-usace-survey-deliverable.yml

permissions:
  contents: read

jobs:
  survey-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run rockhounding source, survey and public-noindex regression tests
        run: |
          node --test tests/rockhounding*.test.js
          python3 -m unittest discover -s tests -p 'test_rockhounding_*.py' -v
      - name: Check research source/parser syntax
        run: python -m py_compile scripts/rockhounding/audit-usace-2026-deliverable.py scripts/rockhounding/inspect-usace-2026-zip.py
      - name: Check 2026 original USACE eHydro ZIP, chart source and survey footprint
        run: |
          python scripts/rockhounding/audit-usace-2026-deliverable.py \
            --out artifacts/grand-marais-usace-2026-survey-deliverable-audit.json
      - name: Verify full original USACE 2026 XYZ and IGLD85 research source against excluded public beach locations
        run: |
          python scripts/rockhounding/inspect-usace-2026-zip.py \
            --out artifacts/grand-marais-usace-2026-survey-archive-metadata.json
      - name: Keep source and coverage audit with no assumed safe depth
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rockhounding-usace-2026-deliverable-source-audit
          path: |
            artifacts/grand-marais-usace-2026-survey-deliverable-audit.json
            artifacts/grand-marais-usace-2026-survey-archive-metadata.json
          retention-days: 30
          if-no-files-found: warn
