name: Temporary Kilauea HVO expansion
on:
  push:
    branches:
      - agent/kilauea-expand-hvo-2026-09-28
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kilauea-expand-hvo-2026-09-28
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Expand HVO on first reference and test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('public/labs/kilauea-live/index.html')
          s = p.read_text()
          old = 'An interpretive read of official eruption, access, weather, and air evidence—so you can understand what the summit is doing and make a better visit decision.'
          new = 'An interpretive read of USGS Hawaiian Volcano Observatory (HVO) eruption reports, park access, weather, and air evidence—so you can understand what the summit is doing and make a better visit decision.'
          if old not in s:
              raise SystemExit('hero copy target not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          t = Path('tests/kilauea-live.test.js')
          ts = t.read_text()
          needle = "  assert.match(html, /What the summit is telling you/);"
          insert = "  assert.match(html, /USGS Hawaiian Volcano Observatory \\(HVO\\)/);\n" + needle
          if needle not in ts:
              raise SystemExit('test insertion target not found')
          ts = ts.replace(needle, insert, 1)
          t.write_text(ts)
          PY
          node --test tests/kilauea-live.test.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/labs/kilauea-live/index.html tests/kilauea-live.test.js
          git commit -m 'Spell out Hawaiian Volcano Observatory on first reference'
          git push origin HEAD:agent/kilauea-expand-hvo-2026-09-28
