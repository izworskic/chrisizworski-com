name: Rocket visual intelligence NASA image refresh
on:
  schedule:
    - cron: '26 7 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rocket-visual-nasa-manifest
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout reviewed repository without persistent credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Python standard-library runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Confirm NASA credit, identity and URL safety with synthetic tests
        run: python3 scripts/rocket_launch_visual_catalog.py --test
      - name: Refresh a bounded NASA-only archive catalog
        run: python3 scripts/rocket_launch_visual_catalog.py --build
      - name: Check resulting manifest and frontend consumer safety
        run: node --test tests/rocket-launch-visuals.test.js
      - name: Commit only if approved image metadata materially changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE=public/synced-national-tools/rocket-launch-live/visual-catalog.json
          if git diff --quiet -- "$FILE"; then
            echo "No new cleared photos; no commit or Vercel build."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$FILE"
          git commit -m "Refresh NASA-credited rocket and payload image catalog"
          # Action checkout disables saved credentials: use token only for this push.
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            push https://github.com/"$GITHUB_REPOSITORY".git HEAD:main
