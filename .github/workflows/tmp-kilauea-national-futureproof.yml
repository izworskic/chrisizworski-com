name: Temporary Kilauea national tools final verification
on:
  push:
    branches:
      - agent/kilauea-national-tools-launch-2026-09-28
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kilauea-national-tools-launch-2026-09-28
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Finalize directory count and verify Kilauea launch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/synced-national-tools/index.html')
          s=p.read_text().replace('Ten destination decisions · United States','Eleven destination decisions · United States')
          p.write_text(s)
          PY
          node --check scripts/sync-breakout-live-main.mjs
          node --test tests/kilauea-live.test.js
          test -f public/synced-national-tools/kilauea-live/index.html
          test ! -f public/labs/kilauea-live/index.html
          ! grep -n 'noindex' public/synced-national-tools/kilauea-live/index.html
          ! grep -n $'\u2014' public/synced-national-tools/kilauea-live/index.html lib/kilauea-decision.js
          grep -n 'https://chrisizworski.com/national-tools/kilauea-live/' public/sitemap-breakout-live.xml
          grep -n 'href="/national-tools/kilauea-live/"' public/synced-national-tools/live-decisions/index.html
          grep -n 'data-tool-id="kilauea-live"' public/synced-national-tools/index.html
          grep -n 'Eleven destination decisions' public/synced-national-tools/index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/synced-national-tools/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Finalize Kilauea National Tools discovery'
            git push origin HEAD:agent/kilauea-national-tools-launch-2026-09-28
          fi
