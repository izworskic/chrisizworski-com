name: Patch Ballard camera production pin

on:
  push:
    branches:
      - agent/ballard-camera-fix

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Pin verified Ballard Ship Canal cameras'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ballard-camera-fix
      - name: Patch pin and smoke contract
        run: |
          python - <<'PY'
          from pathlib import Path
          old='2822faf4adfb4eeb7ac7c96decca37f4ca55a377'
          new='551a995185a8213906913d81717520cdc9f2e1f9'
          for name in ['package.json','tests/ballard-locks-extracted.test.js']:
              p=Path(name); s=p.read_text()
              if old not in s: raise SystemExit(f'old pin missing in {name}')
              p.write_text(s.replace(old,new))

          p=Path('scripts/ballard-production-smoke.mjs')
          s=p.read_text()
          marker="  'National Weather Service',\n"
          add="  'https://www.sbmc.com/dock-cams/',\n  'Live Ballard Ship Canal cameras',\n"
          if add not in s:
              if marker not in s: raise SystemExit('smoke marker missing')
              s=s.replace(marker,marker+add)
          guard="\nif (page.text.includes('UC1roj2AL1R0DxTjjX89gbEQ') || page.text.includes('youtube.com/@BallardLocksWebcam')) {\n  throw new Error('Dead Ballard Locks YouTube camera embed/link returned to production');\n}\n"
          marker2="const { api, data } = await waitForApiContract();\n"
          if guard not in s:
              if marker2 not in s: raise SystemExit('smoke guard marker missing')
              s=s.replace(marker2,guard+'\n'+marker2)
          p.write_text(s)
          PY
      - name: Run focused tests
        run: node --test tests/ballard-locks-extracted.test.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json tests/ballard-locks-extracted.test.js scripts/ballard-production-smoke.mjs
          git commit -m "Pin verified Ballard Ship Canal cameras"
          git push origin HEAD:agent/ballard-camera-fix
